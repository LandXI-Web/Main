# GitHub Pages 발행 설정 — 무엇을 **내보내지 않을지**만 정한다.
#
# ── 먼저, 앞선 잘못된 진단을 바로잡아 둔다 (2026-09-20) ────────────────────
# 지도 서비스·통계·보고서를 올린 뒤 한동안 404 가 나서, 나는 "발행 사이트가
# 1 GB 를 넘어 Pages 빌드가 거부됐다"고 단정하고 이 파일을 만들었다.
# **틀렸다.** 이 파일이 아직 적용되기도 전에(tools/·legs/gen/ 이 그대로 200)
# 사이트는 정상으로 돌아왔다. 실제 원인은 그냥 **Pages 빌드가 오래 걸린 것**이다.
# 추적 파일이 1,480 MB 라 빌드가 느린 것과, 한도에 걸려 거부되는 것은 다른 얘기다.
#
# 그래서 이 파일은 "빌드를 고치는 것"이 아니다. 남겨 두는 이유는 따로 있다.
#
# ── 남겨 두는 이유 ────────────────────────────────────────────────────────
# 1. 테스트·생성기·비교 그림은 **사이트가 아니다.** 공개 주소로 나갈 이유가 없다.
# 2. 필름 생성 원본(666 MB)은 재생에 쓰이지 않는다. 발행에서 빼면 빌드가 가벼워진다.
# 3. 한도(1 GB)까지 여유가 실제로 얼마 없다 — 지금 1,480 MB 중 810 MB 를 빼면
#    670 MB 가 된다. 필름이 더 늘면 언젠가 진짜로 걸린다. 미리 줄여 둔다.
#
# 파일을 지우지 않는다. 저장소에는 그대로 있고 발행에서만 뺀다.
# 되돌리려면 해당 줄을 지우면 된다.
#
# ── 여기에 넣으면 안 되는 것 (확인했다) ───────────────────────────────────
#   design-canvas/   원판 95장. landxi/proto/review/masters.html 이 href/src 로 건다.
#   docs/            기록.
#   film/legs/ 의 w*.mp4 · *.webp · anchors-v3/*.jpg
#                    필름이 실제로 재생하는 파일. manifest.json 의 "src"·"poster" 가 가리킨다.
#                    ("source" 필드는 출처 기록일 뿐이라 legs/src/ 는 빼도 된다.)

exclude:
  # 필름 생성 원본 — kie.ai 산출물·리비전·중간 소스. 재생에 쓰이지 않는다.
  - landxi/assets/proto/film/legs/gen/    # 430 MB
  - landxi/assets/proto/film/legs/src/    # 236 MB

  # 작업 산출물 — 사이트가 아니다
  - shots/                                # 141 MB
  - tests/
  - tools/
  - design-review/

  # 개발 부속
  - node_modules/
  - package.json
  - package-lock.json
  - playwright.config.mjs
  - test-results/
  - playwright-report/
  - .claude/
