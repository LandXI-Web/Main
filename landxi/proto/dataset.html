<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>데이터 관리 — Land-XI</title>
<link rel="icon" href="../assets/images/favicon_landxi.png">
<script>
  // 로그인 관문. 그리기 전에 판정한다 — 관리자 화면이 한 프레임도 새어 나가지 않게.
  if (localStorage.getItem('lx_logged_in') !== '1') {
    location.replace('../login.html?next=' + encodeURIComponent('proto/dataset.html' + location.search));
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="fonts-system.css">
<link rel="stylesheet" href="v3-tokens.css">
<link rel="stylesheet" href="dataset.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
</head><body class="v3" data-colorway="light" data-tab="upload" data-pp="8">

<a class="skip" href="#grid">목록으로 건너뛰기</a>

<!-- ══ 데이터 관리 — 조판 마스터 design-canvas/v2/B5-DataMgmt.dc.html (1440×900, NOTES.md §13.7).
     대시보드(B5-Dashboard-Data)와 같은 골격: 마스트헤드(공지 + 기준일) → 제목 → KPI 카드 5 → 단계 뷰.
     단계 뷰 = 좌 타일 그리드(≈60%, 쪽당 4·6·8·16 = 2·3·4·4열, 아래 페이저) + 우 패널(≈40%, 그리드와 같은 높이).
     발주 2차(2026-08-27): 업로드 선택 없음 = 진행 현황판 · 완료 선택 = 실제 위치 + 성과 / 위치 없으면 데이터 테이블 속성 ·
     아카이브 = 사용 현황 · 발행 이력 · 메모(이 브라우저에만 저장). 레이어 목록 블록은 뺐다.
     KPI 카드 = 단계 선택(`?tab=`). 타일에는 선반이 없다 — 상태는 그림 위에, 액션은 우 패널에.
     기능은 원본 dataset.html + 프래그먼트 4종과 1:1(docs/superpowers/proto/2026-08-26-dataset-parity.md).
     색 역할(system.md §2): 파랑 = 정보/선택 · 빨강(warn) = 조치 필요(디스크 96% · 발행 실패) · 청록 = AI 결과. ══ -->

<aside id="rail" aria-label="주 메뉴">
  <a id="rail-mark" href="scrub/index.html" aria-label="Land-XI 홈"><span>LAND</span><span>XI</span></a>
  <nav id="rail-top" class="rail-group"></nav>
  <nav id="rail-foot" class="rail-group"></nav>
</aside>

<header id="mast">
  <a id="b-notice" class="notice" href="../notice.html" title="원본 notice.html">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M3 3.5h14v9H3z"/><path d="M6 12.5V17"/><path d="M6 7h8M6 9.5h5"/></svg>
    <span class="chip">공지</span>
    <span class="nt" id="notice-t"></span>
    <span class="n nd" id="notice-d"></span>
    <span class="more">전체 보기 ›</span>
  </a>
  <p id="b2" class="asof"><span class="k">기준일 현재</span><span class="n" id="b2-d"></span></p>
</header>

<main id="main" aria-label="데이터 관리">
  <div id="b1-row" data-line><h1 id="b1" class="d"><span class="rule">데이터 관리</span></h1><p id="b1-sub" class="n">V-World 정사영상 · EPSG:4326 · <em class="demo">시연</em></p></div>
  <hr class="hr">

  <!-- KPI 카드 5 — 내 디스크 사용량(조치 = warn) · 단계 4(선택 = 틴트) -->
  <div id="b-kpi" role="tablist" aria-label="단계"></div>
  <hr class="hr">

  <!-- 툴바 — 단계명 + 필터 + 검색 + 쪽당 타일 수 4단(4 · 6 · 8 · 16) -->
  <div id="tool">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M3 3h14v14H3z"/><path d="M3 7.67h14M3 12.33h14M7.67 3v14M12.33 3v14"/></svg>
    <h2 id="tool-h" class="d"></h2>
    <span id="tool-c" class="n cnt"></span>
    <label id="fsel" class="dd"><span id="fsel-k">형식</span>
      <select id="ds-filters" aria-label="필터"></select>
      <svg width="9" height="6" viewBox="0 0 9 6" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M.5.5 4.5 5 8.5.5"/></svg></label>
    <label id="search">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="#686868" stroke-width="1.25" aria-hidden="true"><circle cx="6.2" cy="6.2" r="4.6"/><path d="M9.6 9.6 13 13"/></svg>
      <input id="q" type="search" placeholder="파일명 · 데이터명" autocomplete="off" aria-label="검색">
    </label>
    <span class="sp"></span>
    <div id="pp" role="group" aria-label="쪽당 타일 수">
      <span class="lb">쪽당</span>
      <button type="button" class="n" data-pp="4" aria-pressed="false" title="2열 × 2">4</button>
      <button type="button" class="n" data-pp="6" aria-pressed="false" title="3열 × 2">6</button>
      <button type="button" class="n" data-pp="8" aria-pressed="true" title="4열 × 2">8</button>
      <button type="button" class="n" data-pp="16" aria-pressed="false" title="4열 × 4">16</button>
    </div>
  </div>

  <!-- 단계 뷰 — 좌 타일 그리드 / 헤어라인 / 우 패널 -->
  <section id="stage">
    <div id="grid" tabindex="-1" aria-label="데이터 목록">
      <section id="panel-upload" role="tabpanel" aria-labelledby="kpi-upload">
        <div class="tiles" id="up-list" role="list">
          <!-- 드롭존 = 첫 타일 -->
          <form id="up-form" class="tile tile--drop" role="listitem" novalidate>
            <div id="drop" class="th th--drop" tabindex="0" role="button" aria-label="파일 업로드 — 끌어다 놓거나 클릭">
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M11 2v13M5.5 9.5 11 15l5.5-5.5"/><path d="M3 19.25h16"/></svg>
              <span class="dz-t">끌어다 놓거나 클릭</span>
              <span class="dz-s n">최대 1 TB · <span id="dz-acc"></span></span>
              <input id="file" type="file" multiple hidden>
            </div>
            <p class="cap n"><span class="nm">업로드</span><span class="mt" id="dz-cap">· 검증 3 · 허용 형식 · 1 TB · 파일 없음</span></p>
            <p id="up-picked" class="picked n" hidden></p>
            <p id="up-err" class="err" role="alert" hidden></p>
            <button type="submit" id="up-go" class="br" hidden>업로드</button>
          </form>
          <div id="up-tiles" class="contents"></div>
        </div>
      </section>
      <section id="panel-manage" role="tabpanel" aria-labelledby="kpi-manage" hidden>
        <div class="tiles" id="dn-list" role="list"></div>
        <p id="dn-empty" class="empty n" hidden>일치 0건</p>
      </section>
      <section id="panel-publishing" role="tabpanel" aria-labelledby="kpi-publishing" hidden>
        <div class="tiles" id="pb-list" role="list"></div>
        <p id="pb-empty" class="empty n" hidden>일치 0건</p>
      </section>
      <section id="panel-archive" role="tabpanel" aria-labelledby="kpi-archive" hidden>
        <div class="tiles" id="ar-list" role="list"></div>
        <p id="ar-empty" class="empty n" hidden>일치 0건</p>
      </section>
    </div>
    <!-- 페이저 — 그리드 아래. `1 / 2 · ‹ ›` -->
    <nav id="pager" aria-label="쪽">
      <span id="pg-n" class="n"></span>
      <button type="button" id="pg-prev" class="n" aria-label="이전 쪽">‹</button>
      <button type="button" id="pg-next" class="n" aria-label="다음 쪽">›</button>
    </nav>

    <!-- 우 패널 — 선택 타일의 판(지도/그림) + 기본 정보 + 액션. 판은 한 번만 mount 되어 단계를 옮겨도 산다. -->
    <aside id="side" aria-label="선택 항목" data-mode="none">
      <header class="sh">
        <button type="button" id="side-back" class="n" hidden aria-label="현황판으로">‹ 현황</button>
        <h2 id="side-h" class="d"></h2>
        <span class="sp"></span>
        <span id="side-m" class="mic n"></span>
      </header>
      <div id="side-body">
        <div id="plate-wrap" hidden>
          <div id="plate" aria-hidden="true"></div>
          <div id="ex-layer" aria-hidden="true"></div>
          <p id="plate-cap" class="n"></p>
          <p id="plate-none" class="n" hidden></p>
        </div>
        <div id="fig-wrap" hidden></div>
        <div id="side-info"></div>
      </div>
        <div id="side-acts" class="acts"></div>
    </aside>
  </section>
</main>

<footer id="foot">
  <span id="foot-links"></span>
  <span id="foot-addr" class="n"></span>
</footer>

<!-- ── 모달 3종 — 디스크 증량 신청 · 공유 설정 · 좌표계 지정 ───────────────── -->
<div id="scrim" hidden></div>
<form id="m-quota" class="modal" role="dialog" aria-modal="true" aria-labelledby="mq-h" hidden>
  <p class="lb" id="mq-tag"></p>
  <h2 class="d" id="mq-h">디스크 증량 신청</h2>
  <p class="k">신청 용량 (GB)</p>
  <div id="mq-presets" class="chips"></div>
  <input id="mq-gb" type="number" min="1" class="n" placeholder="직접 입력 (GB)" hidden>
  <p class="k">신청 사유</p>
  <textarea id="mq-why" rows="3" placeholder="신청 사유"></textarea>
  <p id="mq-err" class="err" role="alert" hidden></p>
  <div class="acts"><button type="button" class="br" data-close>취소</button><button type="submit" class="fill d">저장</button></div>
</form>
<form id="m-share" class="modal" role="dialog" aria-modal="true" aria-labelledby="ms-h" hidden>
  <p class="lb">아카이브 · 공유 설정</p>
  <h2 class="d" id="ms-h">공유 설정</h2>
  <p id="ms-sub" class="n sub"></p>
  <div class="ph"><span class="lb">기관명</span><span class="lb">권한명</span></div>
  <div id="ms-perm"></div>
  <div class="acts"><button type="button" class="br" data-close>취소</button><button type="submit" class="fill d">저장</button></div>
</form>
<form id="m-crs" class="modal" role="dialog" aria-modal="true" aria-labelledby="mc-h" hidden>
  <p class="lb">레이어 발행중 · 실패</p>
  <h2 class="d" id="mc-h">좌표계 지정</h2>
  <p id="mc-sub" class="n sub"></p>
  <label class="fr"><span class="k">좌표계</span><select id="mc-epsg"><option>EPSG:5186</option><option>EPSG:5179</option><option>EPSG:5174</option><option>EPSG:4326</option></select></label>
  <div class="acts"><button type="button" class="br" data-close>취소</button><button type="submit" class="fill d">다시 발행</button></div>
</form>

<p id="say" class="n" role="status" aria-live="polite"></p>

<script type="module" src="dataset.js"></script>
</body></html>
