<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이디(이메일) 찾기 결과 — Land-XI 플랫폼</title>
<link rel="icon" href="../assets/images/favicon_landxi.png">
<!-- 로그인 전 화면 — 관문(shell-gate.js) · 레일 없음. 승인된 로그인과 같은 카드 가족: system.css + login.css 를 그대로 쓰고 auth.css 는 모자란 것만 얹는다. -->
<link rel="stylesheet" href="system.css">
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="auth.css">
</head><body class="lx au" data-page="find-id-result">

<a class="lx-skip" href="#auResult">본문 건너뛰기</a>

<!-- 마스터: design-canvas/v2/B6-Auth-FindId-Result · -Fail.dc.html · 원본: landxi7/find-id-result.html (문구 · 검증 1:1). 액자 · CI · 필름 · 푸터 = login.html 과 같은 마크업. -->
<div class="lg" id="lg">
  <div class="lg-wrap">

    <header class="lg-head">
      <a class="lg-brand" href="login.html" aria-label="Land-XI 플랫폼 로그인">
        <img class="lg-brand__ci" src="../assets/brand/landxi-wordmark.png" alt="LAND-XI PLATFORM" width="306" height="17">
      </a>
      <p class="lg-intro">LAND-XI의 직관적인 인터페이스를 사용하여 NO-CODE 기반의 AI 학습모델을 구축하고 활용할 수 있습니다.</p>
    </header>

    <div class="lg-card" id="lgCard">
      <figure class="lg-film" id="lgPlate" aria-label="디오라마 오프닝 필름">
        <video class="lg-film__v" id="lgVideo" autoplay muted loop playsinline preload="auto"
               poster="../assets/proto/film/legs/wfull.webp">
          <source src="../assets/proto/film/legs/wfull-m.mp4" type="video/mp4" media="(max-width: 900px)">
          <source src="../assets/proto/film/legs/wfull.mp4" type="video/mp4">
        </video>
      </figure>

      <main class="lg-panel" id="main">
        <div class="au-result" id="auResult">
          <h1 class="lg-h1" id="page-title"><span>아이디(이메일) 찾기</span><span class="au-chip">결과</span><em class="au-tag" data-when="ok">시연</em></h1>

          <!-- 성공 -->
          <div class="au-result-b" data-when="ok" role="status">
            <div class="au-mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 10.5 8.5 15 16 6"/></svg></div>
            <p class="au-lead au-lead--id" id="frLead">mini****@n****.com</p>
            <p class="au-msg">위의 아이디(이메일)로 로그인해 주세요.</p>
          </div>
          <div class="au-actions" data-when="ok"><a class="au-btn1" id="ctaLogin" href="login.html"><span>로그인 하러 가기</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a><a class="lg-signup__a au-s6" href="signup.html">회원가입</a></div>
          <p class="au-links" data-when="ok"><a class="lg-find__a" href="find-password.html">비밀번호 찾기</a></p>

          <!-- 실패 — ?result=fail -->
          <div class="au-result-b" data-when="fail" role="status" hidden>
            <div class="au-mark au-mark--fail" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 4l12 12M16 4 4 16"/></svg></div>
            <p class="au-lead">입력하신 정보로<br>회원 정보를 찾을 수 없습니다.</p>
          </div>
          <div class="au-actions" data-when="fail" hidden><a class="au-btn1 au-btn1--plain" id="ctaRetry" href="find-id.html">다시 시도</a><a class="lg-signup__a" href="signup.html">회원가입</a></div>
          <p class="au-links" data-when="fail" hidden><a class="lg-find__a" href="login.html">로그인</a><span class="lg-sep" aria-hidden="true">|</span><a class="lg-find__a" href="find-password.html">비밀번호 찾기</a></p>
        </div>
      </main>
    </div>

    <footer class="lg-foot">
      <img class="lg-foot__ci" src="../assets/brand/vector/lx-lockup.svg" alt="LX 한국국토정보공사" width="160" height="18">
      <p class="lg-foot__policy">
        <a class="lg-foot__ink" href="#privacy" data-policy="privacy">개인정보처리방침</a><span class="lg-sep" aria-hidden="true">|</span><a href="#terms" data-policy="terms">이용약관</a><span class="lg-sep" aria-hidden="true">|</span><a href="#email" data-policy="email">이메일무단수집거부</a>
      </p>
      <p class="lg-foot__legal lx-num">Copyright© LX. ALL RIGHTS RESERVED.</p>
    </footer>

  </div>
</div>

<script type="module" src="auth.js"></script>
</body></html>
