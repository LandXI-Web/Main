<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 — Land-XI 플랫폼</title>
<link rel="icon" href="../assets/images/favicon_landxi.png">
<!-- 컴포넌트 시트가 토큰(v3-tokens.css)까지 @import 한다. login.css 는 이 화면 고유의 것만 얹는다. -->
<link rel="stylesheet" href="system.css">
<link rel="stylesheet" href="login.css">
</head><body class="lx lg-login">

<a class="lx-skip" href="#loginForm">본문 건너뛰기</a>

<!-- 마스터: design-canvas/v2/B5-Login.dc.html (NOTES §14 · 7차 개정) — 구 랜드XI(login.do) 구도.
     페이지 중앙의 작은 카드 하나(폭 1200): 좌 60% = 필름 판(필름 안 글자 0) + 그 아래 계정 캡션 띠 · 우 40% = 폼.
     E0-2(2026-09-24): 카드 높이 고정(520)을 풀었다 — 계정 종류가 들어오며 폼이 카드를 뚫고 나왔다(G-01).
       계정 종류는 한 줄 세그먼트(선택 = 코너 브래킷), 설명 줄은 좌측 캡션 띠로 옮겼다(roles.js ROLES[].what · CAPS).
       로그인 버튼 = 잉크 채움(법전 복귀 · O7). 정지 상태 액센트 = 워드마크 밑줄 · 찾기 링크 2 — 셋뿐.
     카드 위 = 실제 Land-XI CI + 원본 소개 한 줄 · 카드 아래 = LX 락업 + 정책 링크 + Copyright. -->
<div class="lg" id="lg">
  <div class="lg-wrap">

    <!-- ══ 카드 위 — CI + 소개(원본 카피) ══ -->
    <header class="lg-head">
      <a class="lg-brand" href="scrub/index.html" aria-label="Land-XI 플랫폼 홈">
        <img class="lg-brand__ci" id="lgCiLandxi" src="../assets/brand/landxi-wordmark.png" alt="LAND-XI PLATFORM" width="306" height="17">
      </a>
      <p class="lg-intro">LAND-XI의 직관적인 인터페이스를 사용하여 NO-CODE 기반의 AI 학습모델을 구축하고 활용할 수 있습니다.</p>
    </header>

    <!-- ══ 카드 ══ -->
    <div class="lg-card" id="lgCard">

      <!-- 좌 60% — 필름 판 + 계정 캡션 띠. 필름 안 글자 0(발주 지시 5차) — 캡션은 필름 **아래** 띠에 선다.
           유휴 움직임은 필름 루프 하나. 캡션은 계정 종류를 바꿀 때만 들어온다(600ms · 60ms 스태거). reduced-motion = 포스터 · 즉시. -->
      <div class="lg-left">
        <figure class="lg-film" id="lgPlate" aria-label="디오라마 오프닝 필름">
          <video class="lg-film__v" id="lgVideo" autoplay muted loop playsinline preload="auto"
                 poster="../assets/proto/film/legs/wfull.webp">
            <source src="../assets/proto/film/legs/wfull-m.mp4" type="video/mp4" media="(max-width: 900px)">
            <source src="../assets/proto/film/legs/wfull.mp4" type="video/mp4">
          </video>
        </figure>
        <!-- 고른 계정이 무엇을 하는지 — 문구는 roles.js 에서만 온다(ROLES[].what · CAPS). -->
        <div class="lg-cap" id="lgCap" aria-live="polite">
          <p class="lg-cap__who"><b class="lg-cap__name" id="lgCapName"></b><span class="lg-cap__what" id="lgCapWhat"></span></p>
          <ul class="lg-cap__caps" id="lgCapCaps"></ul>
        </div>
      </div>

      <!-- 우 40% — 압축 폼 -->
      <main class="lg-panel">
        <!-- 6차: 우 패널 맨 위의 `Land-XI 플랫폼` 제목·한 줄 삭제. 제목 로그인 → 바로 아래 소개 한 문장(상시, ?logout 배너 자리 대체 — 배너 문구는 없다). -->
        <h1 class="lg-h1">로그인</h1>
        <p class="lg-lead" id="lgLead">Land-XI 플랫폼은 고해상도 드론·항공·위성영상과 AI기술을 활용하여 공공서비스 혁신을 지원합니다.</p>

        <form class="lg-form" id="loginForm" novalidate>

          <!-- 계정 종류 — LX 관리자 · LX 직원 · 영업용 계정 세 단이 분리 운영된다(2026-09-21).
               시연본이라 여기서 고른다. 실서비스에서는 계정에 붙은 권한이 그대로 들어온다. -->
          <fieldset class="lg-role" id="lgRole">
            <legend class="lx-field__label">계정 종류</legend>
            <div class="lg-seg">
              <label class="lg-seg__c"><input type="radio" name="role" value="admin" checked><span>LX 관리자</span></label>
              <label class="lg-seg__c"><input type="radio" name="role" value="staff"><span>LX 직원</span></label>
              <label class="lg-seg__c"><input type="radio" name="role" value="sales"><span>영업용 계정</span></label>
            </div>
          </fieldset>

          <div class="lx-field" data-field="email">
            <label class="lx-field__label" for="lgEmail">아이디 (이메일)</label>
            <input class="lx-field__input" id="lgEmail" name="email" type="email"
                   autocomplete="username" placeholder="example@lx.or.kr" spellcheck="false">
            <span class="lx-field__rule" aria-hidden="true"></span>
            <p class="lx-field__msg" id="lgEmailMsg" role="alert" hidden></p>
          </div>

          <div class="lx-field" data-field="pw">
            <label class="lx-field__label" for="lgPw">비밀번호</label>
            <input class="lx-field__input" id="lgPw" name="pw" type="password"
                   autocomplete="current-password" placeholder="비밀번호">
            <span class="lx-field__rule" aria-hidden="true"></span>
            <p class="lx-field__msg" id="lgPwMsg" role="alert" hidden></p>
          </div>

          <div class="lg-opts">
            <label class="lx-check"><input type="checkbox" name="remember"><span class="lx-check__box" aria-hidden="true"></span><span>로그인 상태 유지</span></label>
            <nav class="lg-find" aria-label="계정 찾기">
              <a class="lg-find__a" href="find-id.html">아이디 찾기</a><span class="lg-sep" aria-hidden="true">|</span><a class="lg-find__a" href="find-password.html">비밀번호 찾기</a>
            </nav>
          </div>

          <!-- 버튼 2 나란히 — 로그인(잉크 채움 · 법전 1차 버튼) · 계정 신청하기(헤어라인 잉크). 원본의 로그인 · 회원가입 자리. -->
          <div class="lg-actions">
            <button type="submit" class="lg-submit" id="lgSubmit">
              <span class="lg-submit__t">로그인</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
            <a class="lg-signup__a" id="lgSignup" href="signup.html"><span class="lg-signup__t">계정 신청하기</span></a>
          </div>

          <p class="lg-contact"><span class="lg-contact__ink">문의 <b class="lx-num">063-713-1218</b></span><span>· 평일 09:00~18:00</span></p>
        </form>
      </main>
    </div>

    <!-- ══ 카드 아래 — LX 락업 + 정책 링크 + Copyright ══ -->
    <footer class="lg-foot">
      <img class="lg-foot__ci" id="lgCiLx" src="../assets/brand/vector/lx-lockup.svg" alt="LX 한국국토정보공사" width="160" height="18">
      <p class="lg-foot__policy">
        <a class="lg-foot__ink" href="#privacy" data-policy="privacy">개인정보처리방침</a><span class="lg-sep" aria-hidden="true">|</span><a href="#terms" data-policy="terms">이용약관</a><span class="lg-sep" aria-hidden="true">|</span><a href="#email" data-policy="email">이메일무단수집거부</a>
      </p>
      <p class="lg-foot__legal lx-num">Copyright© LX. ALL RIGHTS RESERVED.</p>
    </footer>

  </div>
</div>

<script type="module" src="login.js"></script>
</body></html>
