<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 — Land-XI 플랫폼</title>
<link rel="icon" href="../assets/images/favicon_landxi.png">
<!-- 컴포넌트 시트가 토큰(v3-tokens.css)까지 @import 한다. login.css 는 이 화면 고유의 것만 얹는다. -->
<link rel="stylesheet" href="system.css">
<link rel="stylesheet" href="login.css">
</head><body class="lx">

<a class="lx-skip" href="#loginForm">본문 건너뛰기</a>

<!-- 마스터: design-canvas/v2/B5-Login.dc.html (NOTES §14 · 3차 개정) — SPLIT-5050.
     좌 = 실제 CI 두 개(좌상 Land-XI · 좌하 LX 락업)가 앵커, 폼은 우·하로 붙는다 · 우 = 필름 인셋 판(마진 56, 헤어라인). -->
<div class="lg" id="lg">

  <!-- ══ 좌 — 흰 종이, 폼이 1급 객체 ═══════════════════════════════════════ -->
  <main class="lg-left">

    <!-- 실제 Land-XI CI(공식 그라디언트 워드마크, 브랜드 예외 — 자기 색 허용). -->
    <a class="lg-brand" href="dive.html" aria-label="Land-XI 플랫폼 홈">
      <img class="lg-brand__ci" id="lgCiLandxi" src="../assets/brand/landxi-wordmark.png" alt="LAND-XI PLATFORM" width="306" height="17">
    </a>

    <div class="lg-head">
      <p class="lg-head__l lx-num">SIGN IN</p>
      <h1 class="lg-h1">로그인</h1>
      <p class="lg-sub">계정 정보를 입력해 주세요.</p>
      <!-- ?logout — 원본 배너 문구. 잉크 한 줄. -->
      <p class="lg-banner" id="lgBanner" role="status" hidden>안전하게 로그아웃되었습니다.</p>
    </div>

    <form class="lg-form" id="loginForm" novalidate>

      <div class="lx-field" data-field="email">
        <label class="lx-field__label" for="lgEmail">아이디 (이메일)</label>
        <input class="lx-field__input" id="lgEmail" name="email" type="email"
               autocomplete="username" placeholder="example@lx.or.kr" spellcheck="false">
        <span class="lx-field__rule" aria-hidden="true"></span>
        <p class="lx-field__msg" id="lgEmailMsg" role="alert" hidden></p>
      </div>

      <div class="lx-field" data-field="pw">
        <label class="lx-field__label" for="lgPw">비밀번호</label>
        <input class="lx-field__input" id="lgPw" name="pw" type="password"
               autocomplete="current-password" placeholder="비밀번호">
        <span class="lx-field__rule" aria-hidden="true"></span>
        <p class="lx-field__msg" id="lgPwMsg" role="alert" hidden></p>
      </div>

      <div class="lg-opts">
        <label class="lx-check"><input type="checkbox" name="remember"><span class="lx-check__box" aria-hidden="true"></span><span>로그인 상태 유지</span></label>
        <nav class="lg-find" aria-label="계정 찾기">
          <a class="lg-find__a" href="find-id.html">아이디 찾기</a><span class="lg-sep" aria-hidden="true">|</span><a class="lg-find__a" href="find-password.html">비밀번호 찾기</a>
        </nav>
      </div>

      <!-- 채운 CTA는 이것 하나(잉크). -->
      <button type="submit" class="lg-submit" id="lgSubmit">
        <span class="lg-submit__t">로그인</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>

      <p class="lg-signup"><span>처음 이용하시나요?</span> <a class="lg-signup__a" href="signup.html">계정 신청하기</a></p>
    </form>

    <footer class="lg-foot">
      <p class="lg-foot__row"><span class="lg-foot__ink">문의 <b class="lx-num">063-713-1218</b></span><span>· 평일 09:00~18:00</span></p>
      <p class="lg-foot__row lg-foot__policy">
        <a class="lg-foot__ink" href="#privacy" data-policy="privacy">개인정보처리방침</a><span class="lg-sep" aria-hidden="true">|</span><a href="#terms" data-policy="terms">이용약관</a><span class="lg-sep" aria-hidden="true">|</span><a href="#email" data-policy="email">이메일무단수집거부</a>
      </p>
      <p class="lg-foot__row lg-foot__legal"><img class="lg-foot__ci" id="lgCiLx" src="../assets/brand/vector/lx-lockup.svg" alt="LX 한국국토정보공사" width="160" height="18"><span class="lx-num">Copyright© LX. ALL RIGHTS RESERVED.</span></p>
    </footer>
  </main>

  <!-- ══ 우 — 디오라마 오프닝 필름(Leg 01 · 궤도), 인셋 판(마진 56 · 헤어라인 · 캡션 0) ═══
       유휴 움직임은 이 루프 하나. prefers-reduced-motion 이면 포스터만. -->
  <figure class="lg-film" id="lgPlate" aria-label="디오라마 오프닝 필름">
    <video class="lg-film__v" id="lgVideo" autoplay muted loop playsinline preload="auto"
           poster="../assets/proto/film/legs/w01.webp">
      <source src="../assets/proto/film/legs/w01-m.mp4" type="video/mp4" media="(max-width: 900px)">
      <source src="../assets/proto/film/legs/w01.mp4" type="video/mp4">
    </video>
  </figure>

</div>

<script type="module" src="login.js"></script>
</body></html>
