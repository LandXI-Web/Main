<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 · XI맵 퍼포먼스 맵 3</title>
<link rel="stylesheet" href="perf3.css">
<script defer src="../../../vendor/maplibre/maplibre-gl.js"></script>
<script defer src="../../../../xi/vendor/pmtiles/pmtiles.js"></script>
</head>
<body class="m">
<div class="app" id="app">
  <header class="mast">
    <span class="word">LAND-XI</span><span class="home">XI맵</span>
    <div class="search"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><span>시군구 · 지번 · 또는 XI ChatGEO 에 질문</span></div>
    <span class="sp"></span>

</div>

<div class="login" id="login" hidden>

    <input type="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>
    <p class="err" id="loginErr"></p><button type="submit">로그인</button></form>
</div>

<script type="module">
/* 설계 28차 · XI맵 퍼포먼스 맵 시안 3(원칙 229 · 233 · 237) — 27차 시안 2 바탕 한 판. 실제 화면 · 서버 수정 0 · GPU 0.
   바뀐 점: 특정 업무가 기본으로 골라져 있지 않다 — 처음부터 서버에 있는 모든 분석 결과(서비스 결과 장부 · 시군구 전역 분석 · 전국 분석 · 해외)가 함께 빛나고,
   업무별 거르기는 XI ChatGEO 에 말하거나 누른 곳 말풍선의 업무 줄을 눌렀을 때만. 왼쪽 위 글자에 업무 이름 없음(전국 = 합계 · 시군구 = 그 시군구 여러 업무 함께).
   남은 날 · 진행 % 없음. 나머지(범례 없음 · 올림 · 누름 · 시간 막대 · 말로 거르기 · 지도 영역 안)는 2차 그대로. 직원 메뉴 = 지금 실제 메뉴(lx-menu.js).
   예시 동작(표시함): 고치기 저장 · 두 해 사이 '바뀐 곳' 빛남 · ChatGEO 답 문구(숫자는 서버 값). */
import { createStage } from '../../../../v3/kit/stage.js';
import { api, API, session } from '../../../../shared/api-v1.js';
import { sourceSpec } from '../../../../xi/engine/sources.js';
import { addResultLayers } from '../../../../xi/fx/arrive.js';
API.mode = 'on';

const q = new URLSearchParams(location.search);
const AT = q.get('at'), ASK = q.get('ask'), CUR = q.get('cursor') === '1';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (n) => (n == null || Number.isNaN(Number(n)) ? '—' : Number(n).toLocaleString('ko-KR'));
const val = (e) => (e && typeof e === 'object' && 'value' in e ? e.value : e);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const norm = (s) => String(s || '').replace(/\s+/g, '');
const ui = document.getElementById('ui'), TIP = document.getElementById('tip'), MAIN = document.getElementById('main');
const now = new Date(); const hm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
document.getElementById('clock').textContent = hm;
document.getElementById('stampT').textContent = `${now.getMonth() + 1}-${String(now.getDate()).padStart(2, '0')} ${hm}`;

/* 색 — 결과 이름마다(서버가 주는 이름 그대로 · 새 이름 0). 범례로 늘어놓지 않고 그 자리 말풍선의 색 점으로만 */
const COLOR = { 경작지: '#2E9E5B', '경작·휴경': '#2E9E5B', 경작: '#2E9E5B', 비닐하우스: '#F59F00', 건물: '#3182F6', 건축물: '#3182F6', 주차장: '#868E96', 곤포사일리지: '#AE3EC9', 토지피복: '#5C7CFA', '국토 변화': '#F03E3E', 해양쓰레기: '#15AABF' };
const UNIT = { 경작지: '곳', '경작·휴경': '곳', 비닐하우스: '동', 건물: '동', 건축물: '동', 주차장: '곳', 곤포사일리지: '개', 토지피복: '개', '국토 변화': '곳', 해양쓰레기: '개' };
const canon = (n) => ({ '경작·휴경': '경작지', 경작: '경작지', 건축물: '건물' }[n] || n);
const colorBy = (prop) => ['match', ['get', prop], ...Object.entries(COLOR).flat(), '#5C7CFA'];
const dot = (c) => `<i class="dot" style="background:${COLOR[c] || '#5C7CFA'}"></i>`;
const AI = '#0FA9A0';
const KOREA = [125.0, 33.1, 130.0, 38.6];
const NAMWON = { bbox: [127.1839, 35.3025, 127.6742, 35.5608] };
const DEOKJIN = { bbox: [126.998, 35.8017, 127.2343, 35.9031] };
const OBJ_Z = 10.6, CELL_Z = 8.6;

/* 직원 메뉴 — 지금 실제 메뉴 그대로(v3/kit/lx-menu.js: 대시보드 · 프로젝트 · 분석하기 · 지도 서비스 · XI맵 | 요청함). 이 영역엔 XI맵 정보 0(원칙 233) */
const MENU = [['대시보드', '<path d="M3 9l7-6 7 6v8H3z"/>'], ['프로젝트', '<path d="M3 5h5l2 2h7v9H3z"/>'], ['분석하기', '<path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/><circle cx="10" cy="10" r="2.5"/>'], ['지도 서비스', '<path d="M3 5l5-2 4 2 5-2v12l-5 2-4-2-5 2z M8 3v12 M12 5v12"/>'], ['XI맵', null], ['요청함', '<path d="M3 11h4l1 2h4l1-2h4v6H3z M5 4h10l2 7H3z"/>']];
document.getElementById('rail').innerHTML = MENU.map(([l, ic]) => `<a class="ri${l === 'XI맵' ? ' on' : ''}${l === '요청함' ? ' sep' : ''}">${ic ? `<svg viewBox="0 0 20 20" aria-hidden="true">${ic}</svg>` : '<span class="xi">XI</span>'}${l}</a>`).join('');

async function ensureLogin() {
  if (session.get()) return;
  const box = document.getElementById('login'); box.hidden = false;
  await new Promise((done) => {
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault(); const f = new FormData(e.target);
      try {
        const r = await api('/auth/login', { method: 'POST', body: { login: f.get('login'), password: f.get('password'), realm: 'lx' } });
        session.set(r); box.hidden = true; done();
      } catch (err) { document.getElementById('loginErr').textContent = err.message || '로그인하지 못했습니다'; }
    });
  });
}

/* ═══ 재료 — 전부 서버에서(못 읽으면 '—' · 빈 층) ═══ */
const D = {};
const inKorea = (b) => b[2] > 124 && b[0] < 132 && b[3] > 33 && b[1] < 39;
async function load() {
  const safe = (p) => api(p).catch(() => null);
  const [prog, board, dens, edits, deps, sgg] = await Promise.all([
    safe('/national/progress'), safe('/ximap/board'), safe('/ximap/density?g=0'), safe('/ximap/edits/summary'), safe('/deploys?scope=global'),
    fetch('/landxi/assets/data/geo/sigungu.geojson').then((r) => r.json()).catch(() => ({ type: 'FeatureCollection', features: [] }))]);
  D.prog = prog; D.board = board; D.dens = dens; D.edits = edits; D.sgg = sgg;
  D.assets = Object.entries(prog?.assets || {}).filter(([, a]) => a && a.on !== false).map(([k, a]) => ({ k, a }));
  D.regions = board?.regions || [];
  D.byName = new Map(D.regions.map((r) => [norm(r.name), r]));
  D.nw = D.regions.find((r) => r.name === '남원시') || null;
  // 해외 — 배포된 분석 서비스 구역 중 나라 밖(구역 경계 · 이름은 서버 이름 그대로)
  D.abroad = (deps?.items || []).filter((d) => d.aoi && d.region_name?.ko).map((d) => ({ name: d.region_name.ko, aoi: d.aoi, b: bboxOf([d.aoi]) })).filter((d) => !inKorea(d.b));
  // 전국 합계 — 서비스 결과 장부(시군구 전역 분석 포함 · board) + 전국 분석(경작지 · 비닐하우스 = 농지 전수, 건물 = 하천 · 계곡)
  const fc = prog?.assets?.farm?.counts || {}, rc = prog?.assets?.river?.counts || {};
  const svcN = (board?.services || []).reduce((a, s) => a + (val(s.n) || 0), 0);
  D.total = svcN + (val(fc.경작지?.n) || 0) + (val(fc.비닐하우스?.n) || 0) + (val(rc.건물?.n) || 0);
}
const NEXT = () => D.assets.map(({ a }) => a.next).find(Boolean) || null;

/* ═══ 지도 ═══ */
let ST, MAP;
async function stage(bounds) { ST = createStage(document.getElementById('stage'), { bounds, interactive: true, padding: { top: 100, bottom: 150, left: 60, right: 60 } }); await ST.ready; MAP = ST.map; return MAP; }
function idle(max = 12000) { return new Promise((r) => { const t0 = performance.now(); const poll = () => (MAP.areTilesLoaded() || performance.now() - t0 > max ? r() : setTimeout(poll, 120)); MAP.once('idle', poll); setTimeout(poll, max); }); }
const FACE = (k = 1) => ['interpolate', ['linear'], ['zoom'], 4, 0.95 * k, 9, 0.8 * k, 11, 0.5 * k, 13, 0.25 * k, 15, 0.12 * k];
const BEFORE = () => (MAP.getLayer('slot-result') ? 'slot-result' : undefined);
const L = (id) => MAP.getLayer(id);
const setP = (id, k, v) => L(id) && MAP.setPaintProperty(id, k, v);
const bySource = (src) => (MAP.getStyle().layers || []).filter((l) => l.source === src).map((l) => l.id);
function centerOf(g) { let x = 0, y = 0, n = 0; const walk = (c) => (typeof c[0] === 'number' ? (x += c[0], y += c[1], n++) : c.forEach(walk)); walk(g.coordinates); return [x / n, y / n]; }
function bboxOf(gs) { let w = 180, s = 90, e = -180, n = -90; const walk = (c) => (typeof c[0] === 'number' ? (w = Math.min(w, c[0]), e = Math.max(e, c[0]), s = Math.min(s, c[1]), n = Math.max(n, c[1])) : c.forEach(walk)); gs.forEach((g) => walk(g.coordinates)); return [w, s, e, n]; }
const NSRC = (k) => 'n-' + k;
const hitLayers = () => D.assets.map(({ k }) => NSRC(k) + '-hit').filter((id) => L(id));

function addLayers() {
  const B = BEFORE();
  /* 시군구 — 올린 곳만 떠오르게(다른 곳은 가라앉음) */
  MAP.addSource('sg', { type: 'geojson', data: D.sgg });
  const none = ['==', ['get', 'name'], '__'];
  MAP.addLayer({ id: 'sg-veil', type: 'fill', source: 'sg', filter: none, paint: { 'fill-color': '#0E1622', 'fill-opacity': 0, 'fill-opacity-transition': { duration: 300 } } }, B);
  MAP.addLayer({ id: 'sg-hit', type: 'fill', source: 'sg', paint: { 'fill-color': '#000', 'fill-opacity': 0 } }, B);
  /* 전국 분석 — 자산마다 결과 면 · 칸(지금 서버에 켜진 자산 전부) */
  for (const { k } of D.assets) {
    const s = NSRC(k), v = D.prog?.v?.[k] || '0';
    MAP.addSource(s, { type: 'vector', tiles: [`${API.base}/tiles/national/${k}/${D.prog?.year || 2025}/{z}/{x}/{y}.pbf?v=${encodeURIComponent(v)}`], minzoom: 4, maxzoom: 10, attribution: '국토지리정보원 항공 정사영상 · AI 분석 결과' });
    MAP.addLayer({ id: s + '-face', type: 'fill', source: s, 'source-layer': 'faces', paint: { 'fill-color': colorBy('cls'), 'fill-opacity': FACE(), 'fill-opacity-transition': { duration: 400 } } }, B);
    MAP.addLayer({ id: s + '-veil', type: 'fill', source: s, 'source-layer': 'cells', filter: ['==', ['get', 'cd'], '__'], maxzoom: 12.5, paint: { 'fill-color': '#0E1622', 'fill-opacity': 0, 'fill-opacity-transition': { duration: 300 } } }, B);
    MAP.addLayer({ id: s + '-hit', type: 'fill', source: s, 'source-layer': 'cells', paint: { 'fill-color': '#000', 'fill-opacity': 0 } }, B);
  }
  /* 빛나는 밀도 — 서비스 결과 장부 + 시군구 전역 분석의 모든 결과(약 2km 칸 · 칸 합 = 결과 수) */
  const g = D.dens?.g || 0.02, sets = D.dens?.sets || [], c = D.dens?.cells || [], pts = [];
  for (let i = 0; i + 3 < c.length; i += 4) { const s = sets[c[i + 2]]; if (!s) continue; pts.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [(c[i] + 0.5) * g, (c[i + 1] + 0.5) * g] }, properties: { name: s.name, k: canon(s.name), region: s.region, n: c[i + 3] } }); }
  D.pts = pts;
  MAP.addSource('dens', { type: 'geojson', data: { type: 'FeatureCollection', features: pts } });
  MAP.addLayer({ id: 'dens-c', type: 'circle', source: 'dens', paint: {
    'circle-color': colorBy('name'), 'circle-blur': 0.8,
    'circle-radius': ['interpolate', ['linear'], ['zoom'], 5, ['min', 6, ['+', 1.4, ['*', 0.07, ['sqrt', ['get', 'n']]]]], 10, ['min', 22, ['+', 4, ['*', 0.35, ['sqrt', ['get', 'n']]]]]],
    'circle-opacity': ['interpolate', ['linear'], ['zoom'], 5, 0.7, 10, 0.6, 11.4, 0], 'circle-opacity-transition': { duration: 400 } } }, B);
  /* 올린 곳 · 지금 분석 중(이름표 없이 숨 쉬듯) */
  MAP.addLayer({ id: 'sg-hot-sh', type: 'line', source: 'sg', filter: none, paint: { 'line-color': '#000', 'line-opacity': 0.35, 'line-width': 10, 'line-blur': 8, 'line-translate': [4, 7] } }, B);
  MAP.addLayer({ id: 'sg-hot-f', type: 'fill', source: 'sg', filter: none, paint: { 'fill-color': '#FFFFFF', 'fill-opacity': 0 } }, B);
  MAP.addLayer({ id: 'sg-hot-l', type: 'line', source: 'sg', filter: none, paint: { 'line-color': '#fff', 'line-width': 2.4, 'line-opacity': 0.95 } }, B);
  for (const { k, a } of D.assets) {
    const s = NSRC(k), f0 = ['==', ['get', 'cd'], '__'];
    MAP.addLayer({ id: s + '-hot-sh', type: 'line', source: s, 'source-layer': 'cells', filter: f0, paint: { 'line-color': '#000', 'line-opacity': 0.35, 'line-width': 10, 'line-blur': 8, 'line-translate': [4, 7] } }, B);
    MAP.addLayer({ id: s + '-hot-f', type: 'fill', source: s, 'source-layer': 'cells', filter: f0, paint: { 'fill-color': '#FFFFFF', 'fill-opacity': 0 } }, B);
    MAP.addLayer({ id: s + '-hot-l', type: 'line', source: s, 'source-layer': 'cells', filter: f0, paint: { 'line-color': '#fff', 'line-width': 2.4, 'line-opacity': 0.95 } }, B);
    const nx = a.next;
    if (nx) {
      const f = ['all', ['==', ['get', 'name'], nx.emd], ['==', ['get', 'sgg'], nx.sgg]];
      MAP.addLayer({ id: s + '-now-f', type: 'fill', source: s, 'source-layer': 'cells', filter: f, paint: { 'fill-color': AI, 'fill-opacity': 0.18 } }, B);
      MAP.addLayer({ id: s + '-now-l', type: 'line', source: s, 'source-layer': 'cells', filter: f, paint: { 'line-color': AI, 'line-width': 2.4, 'line-opacity': 0.95 } }, B);
    }
  }
  let t = 0; (function breathe() { t += 0.035; for (const { k } of D.assets) setP(NSRC(k) + '-now-f', 'fill-opacity', (0.15 + 0.4 * (0.5 + 0.5 * Math.sin(t))) * YRES.n25); requestAnimationFrame(breathe); })();
  /* 해외 — 구역 경계(서버 배포 구역) */
  MAP.addSource('ov', { type: 'geojson', data: { type: 'FeatureCollection', features: D.abroad.map((d) => ({ type: 'Feature', geometry: d.aoi, properties: { name: d.name } })) } });
  MAP.addLayer({ id: 'ov-glow', type: 'line', source: 'ov', paint: { 'line-color': AI, 'line-width': 10, 'line-blur': 8, 'line-opacity': 0.5 } }, B);
  MAP.addLayer({ id: 'ov-f', type: 'fill', source: 'ov', paint: { 'fill-color': AI, 'fill-opacity': 0.22 } }, B);
  MAP.addLayer({ id: 'ov-l', type: 'line', source: 'ov', paint: { 'line-color': '#fff', 'line-width': 1.6 } }, B);
  let u = 0; (function pulse() { u += 0.05; setP('ov-glow', 'line-opacity', 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(u))); requestAnimationFrame(pulse); })();
}

/* 흐르는 결과 — 모든 결과 칸에서 차례로 고리(업무를 고르면 그 업무만) */
function flow() {
  if (!D.pts?.length) return;
  const bySet = new Map(); D.pts.forEach((p) => { const k = p.properties.name + '|' + p.properties.region; if (!bySet.has(k)) bySet.set(k, []); bySet.get(k).push(p); });
  const groups = [...bySet.values()];
  (function tick() {
    if (MAP && MAP.getZoom() < 9 && YRES.n25 > 0.5 && !FILTER) {
      const gs = TASK ? groups.filter((g) => g[0].properties.k === TASK) : groups;
      if (gs.length) {
        const g = gs[Math.floor(Math.random() * gs.length)], p = g[Math.floor(Math.random() * g.length)];
        const el = document.createElement('div'), rg = document.createElement('div'); rg.className = 'ring'; rg.style.setProperty('--rc', COLOR[p.properties.name] || '#5C7CFA'); el.append(rg);
        const m = new window.maplibregl.Marker({ element: el }).setLngLat(p.geometry.coordinates).addTo(MAP);
        setTimeout(() => m.remove(), 1900);
      }
    }
    setTimeout(tick, 480);
  })();
}

/* ═══ 그 자리 숫자 — 시군구 하나의 여러 업무를 함께(서비스 결과 장부 + 전국 분석 칸 합 · 지어낸 숫자 0) ═══ */
function natSums(sig) {
  const s = norm(sig), out = { 경작지: 0, 비닐하우스: 0, 건물: 0 }, seen = new Set(); let any = false;
  for (const { k } of D.assets) {
    if (!MAP.getSource(NSRC(k))) continue;
    MAP.querySourceFeatures(NSRC(k), { sourceLayer: 'cells' }).forEach((f) => {
      const p = f.properties, key = k + p.cd;
      if (!p.done || seen.has(key) || !norm(p.sgg).startsWith(s)) return; seen.add(key); any = true;
      if (k === 'farm') { out.경작지 += p.n1 || 0; out.비닐하우스 += p.n2 || 0; } else if (k === 'river') out.건물 += p.n3 || 0;
    });
  }
  return any ? out : null;
}
function rowsFor(sig) {
  const rows = [], r = D.byName.get(norm(sig));
  (r?.items || []).forEach((it) => rows.push([it.name, val(it.n)]));
  const n = natSums(sig);
  if (n) for (const [c, v] of Object.entries(n)) if (v) rows.push([c, v]);
  return rows.filter(([, v]) => v).sort((a, b) => b[1] - a[1]).slice(0, 5);
}
const rowHtml = (rows, btn) => rows.map(([c, v]) => `<span class="r${btn ? ' btn' : ''}" data-k="${esc(canon(c))}">${dot(c)}${esc(c)} <b>${nf(v)}${UNIT[c] || '개'}</b></span>`).join('');
function cellRows(p, k) {
  if (!p.done) return [];
  if (k === 'farm') return [['경작지', p.n1], ['비닐하우스', p.n2]].filter(([, v]) => v);
  return [['건물', p.n3], ['경작지', p.n1], ['비닐하우스', p.n2]].filter(([, v]) => v);
}

/* ═══ 지도 안 왼쪽 위 글자 — 업무 이름 없이. 전국 = 모든 결과 합 · 시군구로 들어가면 그 시군구의 여러 업무 함께(원칙 233 · 237) ═══ */
function hudHtml(k, big, unit, sub, rows, live) {

/* ═══ 1 · 올리면 — 그 시군구(가까이선 읍면동)가 떠오르고 차오른다 + 그 자리 여러 업무 숫자 ═══ */

  OPEN = YRES.n25; repaintObjs();
  const tl = document.getElementById('tl'); if (!tl) return;
  const x = ((YV - Y0) / (Y1 - Y0)) * 100;
  tl.querySelector('.knob').style.left = x + '%';
  tl.querySelector('.fill').style.left = '0'; tl.querySelector('.fill').style.width = x + '%';
  const yr = Math.round(YV), mid = YRES.glow > 0;
  tl.querySelector('.yv').innerHTML = mid ? `2023 + 2025<small>바뀐 곳 <span class="ex">예시 동작</span></small>` : `${yr}년`;
}
function timeline() {
  const has = new Set((D.board?.years || ['2023', '2025']).map(Number)); let ticks = '';
  for (let y = Y0; y <= Y1; y++) { const x = ((y - Y0) / (Y1 - Y0)) * 100; ticks += `<i class="tick${has.has(y) ? ' has' : ''}" style="left:${x}%"></i>${y % 2 === 1 || has.has(y) ? `<span class="yl${has.has(y) ? ' has' : ''}" style="left:${x}%">${String(y).slice(2)}</span>` : ''}`; }
  return `<div class="tl" id="tl"><div class="track" id="track">${ticks}<i class="fill"></i><i class="knob" id="knob"></i></div><span class="yv"></span></div>`;
}
function wireTimeline() {
  const tr = document.getElementById('track'); let drag = false;
  const at = (e) => { const r = tr.getBoundingClientRect(); return Y0 + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (Y1 - Y0); };
  tr.addEventListener('pointerdown', async (e) => { drag = true; tr.setPointerCapture(e.pointerId); await addNamwon(); setYear(at(e)); });
  tr.addEventListener('pointermove', (e) => { if (drag) setYear(at(e)); });
  tr.addEventListener('pointerup', (e) => { drag = false; const y = at(e); if (Math.abs(y - 2024) > 0.85) setYear(Math.round(y)); });
}

/* ═══ 4 · XI ChatGEO 에 말하면 — 업무별 거르기 · 조건 거르기(각본 · 숫자는 서버 · 화면 값) ═══ */
function applyTask(k) {
  TASK = k || null; FILTER = null;
  const cls = TASK ? ['==', ['match', ['get', 'cls'], '경작·휴경', '경작지', '경작', '경작지', '건축물', '건물', ['get', 'cls']], TASK] : null;
  for (const { k: a } of D.assets) { MAP.setFilter(NSRC(a) + '-face', cls); setP(NSRC(a) + '-face', 'fill-opacity', FACE(YRES.n25)); }
  MAP.setFilter('dens-c', TASK ? ['==', ['get', 'k'], TASK] : null);
  repaintObjs(); showReset(!!TASK);
}
function visibleCells() {
  const cv = MAP.getCanvas(), W = cv.clientWidth, H = cv.clientHeight, m = new Map();
  const ly = L('n-farm-hit') ? ['n-farm-hit'] : hitLayers();
  MAP.queryRenderedFeatures({ layers: ly }).forEach((f) => {
    if (!f.properties.done) return;
    const c = MAP.project(centerOf(f.geometry));
    if (c.x < 260 || c.x > W - 260 || c.y < 200 || c.y > H - 260) return;
    if (!m.has(f.properties.cd)) m.set(f.properties.cd, { p: f.properties, c });
  });
  return [...m.values()].sort((a, b) => (b.p.n1 || 0) - (a.p.n1 || 0));
}
function busiestCell() {
  const m = new Map(); visibleCells().forEach((v) => m.set(v.p.cd, v.p));
  if (!m.size && MAP.getSource('n-farm')) MAP.querySourceFeatures('n-farm', { sourceLayer: 'cells', filter: ['==', ['get', 'done'], 1] }).forEach((f) => m.set(f.properties.cd, f.properties));
  return [...m.values()].sort((a, b) => (b.n1 || 0) - (a.n1 || 0))[0] || null;
}
function applyArea(min) {
  TASK = null; FILTER = min ? { min } : null;
  for (const { k } of D.assets) MAP.setFilter(NSRC(k) + '-face', null);
  MAP.setFilter('dens-c', null);
  let n = 0, all = 0;
  for (const o of OBJ.values()) {
    if (!o.nat) continue;
    const seen = new Map();
    MAP.querySourceFeatures(o.src, { sourceLayer: 'results', filter: ['==', ['get', 'cls'], '경작지'] }).forEach((f) => { const a = areaM2(f); if (!seen.has(f.id) || seen.get(f.id) < a) seen.set(f.id, a); });
    MAP.querySourceFeatures(o.src, { sourceLayer: 'results' }).forEach((f) => MAP.setFeatureState({ source: o.src, sourceLayer: 'results', id: f.id }, { big: false }));
    for (const [id, a] of seen) { all++; const big = min ? a > min : true; if (big) n++; MAP.setFeatureState({ source: o.src, sourceLayer: 'results', id }, { big }); }
  }
  repaintObjs();
  for (const { k } of D.assets) setP(NSRC(k) + '-face', 'fill-opacity', min ? 0.04 : FACE(YRES.n25));
  showReset(!!min);
  return { n, all };
}
function resetAll() { applyTask(null); applyArea(0); const a = document.getElementById('askA'); if (a) a.hidden = true; }
function showReset(on) {
  const chips = document.querySelector('.ask .chips'); if (!chips) return;
  chips.querySelector('.reset')?.remove();
  if (on) { const b = document.createElement('button'); b.type = 'button'; b.className = 'reset'; b.textContent = '원래대로'; b.onclick = resetAll; chips.prepend(b); }
}
const ASKS = [
  { q: '비닐하우스만 보여 줘', async run() {
      PIN?.remove(); applyArea(0);
      if (MAP.getZoom() > 8 || VIEW === 'ov') { VIEW = 'kr'; ABM.forEach((m) => m.remove()); ABM.length = 0; await ST.go(KOREA, { ms: 1800, maxZoom: 7.5 }); edge(); }
      applyTask('비닐하우스');
      const rs = D.regions.map((r) => [r.name, val(r.items.find((i) => i.name === '비닐하우스')?.n)]).filter(([, v]) => v).sort((a, b) => b[1] - a[1]);
      const nat = val(D.prog?.assets?.farm?.counts?.비닐하우스?.n);
      return `${dot('비닐하우스')}<b>비닐하우스</b>만 남겼습니다 — ${rs.slice(0, 3).map(([n, v]) => `${esc(n)} <span class="num">${nf(v)}동</span>`).join(' · ')}${nat ? ` · 전국 분석 <span class="num">${nf(nat)}동</span>` : ''}.`;
    } },
  { q: '1,000㎡ 넘는 경작지만', async run() {
      applyTask(null);
      if (MAP.getZoom() < 13) { const p = busiestCell(); if (p) { const fs = MAP.querySourceFeatures('n-farm', { sourceLayer: 'cells', filter: ['==', ['get', 'cd'], p.cd] }); if (fs.length) await ST.go(bboxOf(fs.map((f) => f.geometry)), { ms: 1800, maxZoom: 14 }); } }
      await objects(); OPEN = 1; repaintObjs(); await idle(3500); await sleep(300);
      const r = applyArea(1000);
      return `${dot('경작지')}<b>경작지 1,000㎡ 넘는 곳</b> <span class="num">${nf(r.n)}곳</span> — 지금 화면 안 ${nf(r.all)}곳 중. 나머지는 흐리게 했습니다.`;
    } },
  { q: '남원 2023과 2025 비교해 줘', async run() {
      resetAll(); await addNamwon(); PIN?.remove(); await ST.go(NAMWON.bbox, { ms: 1800, maxZoom: 11.2 });
      for (let y = 2025; y >= 2024; y -= 0.05) { setYear(y); await sleep(30); }
      const g = D.nw?.items?.find((i) => i.name === '비닐하우스'), f = D.nw?.items?.find((i) => i.name === '경작·휴경');
      return `<b>남원시</b> — ${dot('비닐하우스')}2023 비닐하우스 <span class="num">${nf(val(g?.n))}동</span> · ${dot('경작지')}2025 경작·휴경 <span class="num">${nf(val(f?.n))}곳</span>.`;
    } },
];
let asking = false;
async function runAsk(i) {
  if (asking) return; asking = true;
  const a = ASKS[i], qEl = document.getElementById('askQ'), aEl = document.getElementById('askA');
  aEl.classList.remove('in'); aEl.hidden = true; qEl.classList.remove('ph');
  for (let k = 1; k <= a.q.length; k++) { qEl.innerHTML = esc(a.q.slice(0, k)) + '<span class="caret"></span>'; await sleep(40); }
  const html = await a.run();
  aEl.innerHTML = `<span class="tag">시안 답</span>${html}`;
  aEl.hidden = false; requestAnimationFrame(() => aEl.classList.add('in'));
  asking = false;
}
function ask() {
  return `<div class="ask" id="ask"><div class="chips">${ASKS.map((a, i) => `<button type="button" data-i="${i}">${esc(a.q)}</button>`).join('')}</div>
    <div class="bar"><span class="logo">XI</span><span class="q ph" id="askQ">XI ChatGEO</span><button class="send" type="button" aria-label="보내기"><svg viewBox="0 0 20 20"><path d="M3 10h13M11 5l5 5-5 5"/></svg></button></div>
    <div class="ans" id="askA" hidden></div></div>`;
}
const evo = () => `<section class="evo" id="evo"><p><span>수정된 부분</span><b>${nf(val(D.edits?.total))}장</b></p></section>`;

/* ═══ 시작 ═══ */
await ensureLogin();
await load();
await stage(KOREA);
addLayers();
const [, k0, b0, u0, s0, r0, l0] = hudNational();
ui.innerHTML = `<section class="hud" id="hud">${hudHtml(k0, b0, u0, s0, r0, l0)}</section>` + timeline() + ask() + evo()
  + `<div class="src"><span class="on">최신 영상</span><span>분석한 영상</span></div><button type="button" class="abroad" id="abroad" hidden></button>`;
ui.querySelectorAll('.ask .chips button').forEach((b) => b.addEventListener('click', () => runAsk(Number(b.dataset.i))));
document.getElementById('abroad').addEventListener('click', goAbroad);
wireTimeline(); setYear(2025); wireMap(); flow(); edge();
if (CUR) { const c = document.createElement('div'); c.className = 'cur'; document.body.append(c); addEventListener('mousemove', (e) => { c.style.left = e.clientX + 'px'; c.style.top = e.clientY + 'px'; }); addEventListener('mousedown', () => c.classList.add('down')); addEventListener('mouseup', () => c.classList.remove('down')); }
if (AT === 'deok') await ST.go(DEOKJIN.bbox, { ms: 10, maxZoom: 10.6 });
if (AT === 'namwon') { await addNamwon(); await ST.go(NAMWON.bbox, { ms: 10, maxZoom: 11.2 }); }
await idle(); paintHud(true);
document.documentElement.dataset.mapReady = '1';
/* 촬영 도우미 — 화면 좌표만 돌려준다(누르기 · 올리기는 실제 마우스로) */
const scr = (p) => { const r = MAP.getCanvas().getBoundingClientRect(); return { x: r.left + p.x, y: r.top + p.y }; };
window.__pt = {
  region(name) {
    const r = D.byName.get(norm(name)); if (!r) return null;
    const ls = ['sg-hit'], cands = [r.center, [(r.bbox[0] + r.bbox[2]) / 2, (r.bbox[1] + r.bbox[3]) / 2]];
    for (const c of cands) { const p = MAP.project(c); const h = MAP.queryRenderedFeatures([p.x, p.y], { layers: ls })[0]; if (h && norm(h.properties.name) === norm(name)) return scr(p); }
    return scr(MAP.project(r.center));
  },
  obj() {
    const r = MAP.getCanvas().getBoundingClientRect(), ls = objLayers();
    const fs = MAP.queryRenderedFeatures([[r.width * 0.3, r.height * 0.3], [r.width * 0.6, r.height * 0.7]], { layers: ls }).filter((f) => { const a = areaM2(f); return a > 800 && a < 30000; }).sort((a, b) => areaM2(b) - areaM2(a)).slice(0, 14);
    for (const f of fs) {
      const ring = (f.geometry.type === 'Polygon' ? f.geometry.coordinates : f.geometry.coordinates[0])[0], c = MAP.project(centerOf(f.geometry));
      const cands = [c, ...ring.slice(0, 40).map((v) => { const qq = MAP.project(v); return { x: c.x * 0.6 + qq.x * 0.4, y: c.y * 0.6 + qq.y * 0.4 }; })];
      for (const pt of cands) { const h = MAP.queryRenderedFeatures([pt.x, pt.y], { layers: ls })[0]; if (h && h.id === f.id && h.source === f.source) return { x: r.left + pt.x, y: r.top + pt.y }; }
    }
    return null;
  },
  year(y) { const r = document.getElementById('track').getBoundingClientRect(); return { x: r.left + ((y - Y0) / (Y1 - Y0)) * r.width, y: r.top + 12 }; },
  fix() { const b = document.querySelector('.pin-b button.pri'); if (!b) return null; const r = b.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; },
  chip(i) { const b = document.querySelector(`.ask .chips button[data-i="${i}"]`); const r = b.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; },
};
if (ASK != null) { await sleep(800); runAsk(Number(ASK)); }
</script>
