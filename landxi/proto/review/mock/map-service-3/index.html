async function ensureLogin() {
  if (session.get()) return;
  const box = document.getElementById('login'); box.hidden = false;
  await new Promise((done) => {
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault(); const f = new FormData(e.target);
      try {
        const r = await api('/auth/login', { method: 'POST', body: { login: f.get('login'), password: f.get('password'), realm: 'lx' } });
        session.set(r); box.hidden = true; done();
      } catch (err) { document.getElementById('loginErr').textContent = err.message || '로그인하지 못했습니다'; }
    });
  });
}

function mapView(base) {
  const grpOf = (k) => MINE.filter((m) => m.g === k);
  const grp = (k, open) => {
    const rows = grpOf(k); const onN = rows.filter((m) => m.on).length;

function drawSum() {
  const on = onRows(); const svcs = new Set(on.map((m) => m.svc));
  const tot = on.reduce((a, m) => a + m.n, 0);
  document.getElementById('sum').innerHTML = `<div><b>${nf(tot)}<i>건</i></b><small>켜진 결과 · ${svcs.size}개 묶음</small></div><div><b>${MINE.length}<i>건</i></b><small>내가 돌린 분석 · 4개 묶음</small></div>`;
  document.getElementById('mcap').innerHTML = on.map((m) => `${esc(m.svc.replace('프로젝트 추론 — ', ''))} · ${esc(m.r)} · ${nf(m.n)}${esc(m.u)}`).join('<small></small>') + `<small>영상 ${esc(on[0]?.img || '')} · 분석 ${on.map((m) => m.d).filter((x, i, a) => a.indexOf(x) === i).join(' · ')}</small>`;
  document.querySelectorAll('.grp').forEach((g) => { const rows = grpRows(g.dataset.g); const onN = rows.filter((m) => m.on).length; g.querySelector('header small').innerHTML = `${onN ? `<b>${onN}</b> / ` : ''}${rows.length}건`; });
}
const grpRows = (k) => MINE.filter((m) => m.g === k);

async function addSet(m) {
  if (LAYERS[m.job]) return;
  const item = { id: 'results-lx-' + m.job, kind: 'vector', set: 'results/lx/' + m.job, layer: 'results', promote_id: 'id', signed: false, source: 'pmtiles' };
  const sid = 'my-' + m.job;
  MAP.addSource(sid, await sourceSpec(item));
  LAYERS[m.job] = addResultLayers(MAP, sid, sid, { kind: 'result', sourceLayer: 'results', visible: true });
  MAP.on('click', `${sid}-fill`, (e) => { const f = e.features?.[0]; if (f) openProps(f, m, e.lngLat); });
  MAP.on('mouseenter', `${sid}-fill`, () => { MAP.getCanvas().style.cursor = 'pointer'; });
  MAP.on('mouseleave', `${sid}-fill`, () => { MAP.getCanvas().style.cursor = ''; });
}
async function toggle(m, focusOnly = false) {
  if (!focusOnly) m.on = !m.on;
  if (m.on) { await addSet(m); setVis(MAP, LAYERS[m.job], true); MAP.fitBounds(m.bb, { padding: { top: 40, bottom: 40, left: 40, right: 380 }, duration: 900, maxZoom: 14.5 }); }
  else if (LAYERS[m.job]) setVis(MAP, LAYERS[m.job], false);
  document.querySelectorAll('.ly li').forEach((li) => { li.classList.toggle('on', !!MINE.find((x) => x.job === li.dataset.job)?.on); li.classList.toggle('focus', li.dataset.job === m.job); });
  drawSum();
}
/* 오른쪽 속성 — 결과 속성(PMTiles 그대로: 분류 · 신뢰도 · 면적 · 읍면동) + 필지 정보(연속지적 API /parcels?lng&lat) */
async function openProps(f, m, lngLat) {
  const p = f.properties || {};
  const rp = document.getElementById('rp'); rp.classList.add('open');
  if (HOVER) { try { MAP.setFeatureState(HOVER, { hover: false }); } catch { /* */ } }
  HOVER = { source: f.source, sourceLayer: f.sourceLayer, id: f.id }; try { MAP.setFeatureState(HOVER, { hover: true }); } catch { /* */ }
  const conf = p.conf != null ? Math.round(p.conf * 100) : null;
  rp.innerHTML = `<header><div><h2>${esc(p.cls || '')}</h2><small>${esc(m.svc.replace('프로젝트 추론 — ', ''))} · ${esc(m.r)} · ${esc(p.emd || '')}</small></div><span class="x" id="rpx">×</span></header>
    <div class="big"><div><b>${p.area_m2 != null ? nf(Math.round(p.area_m2)) : '—'}<i>㎡</i></b><small>AI 가 그린 면적</small></div><div><b>${conf != null ? conf : '—'}<i>%</i></b><small>신뢰도</small></div></div>
    <h3>분석 결과</h3><dl class="kv">
      <div><dt>분류</dt><dd><b>${esc(p.cls || '')}</b></dd></div>
      <div><dt>신뢰도</dt><dd><div class="conf"><i style="--w:${conf ?? 0}%"></i><span class="num">${conf != null ? conf + '%' : '—'}</span></div></dd></div>
      <div><dt>영상 시점</dt><dd><b>${esc(m.img)}</b></dd></div>
      <div><dt>분석한 날</dt><dd><span class="num">${esc(m.d)}</span></dd></div>
      <div><dt>읍면동</dt><dd>${esc(p.emd || '—')}</dd></div>
    </dl>
    <h3>필지 정보 <small>연속지적</small></h3><dl class="kv" id="parcel"><div><dt>지번</dt><dd class="none">불러오는 중</dd></div></dl>
    <div class="acts"><span class="go sm">메모 남기기</span><span class="go sm ghost">이 필지로 가기</span></div>
    <p class="src">결과는 AI 분석 값(결과 확인 전) · 필지는 연속지적도</p>`;
  document.getElementById('rpx').onclick = () => { rp.classList.remove('open'); if (HOVER) { try { MAP.setFeatureState(HOVER, { hover: false }); } catch { /* */ } } };
  try {
    const pc = await api(`/parcels?lng=${lngLat.lng.toFixed(6)}&lat=${lngLat.lat.toFixed(6)}`);
    const area = pc.area_m2?.value, price = pc.price_krw_m2?.value;
    document.getElementById('parcel').innerHTML = `
      <div><dt>지번</dt><dd><b>${esc(pc.emd || '')} ${esc(pc.ri || '')} ${esc(pc.jibun || '')}</b></dd></div>
      <div><dt>지목</dt><dd>${esc(pc.jimok || '—')}</dd></div>
      <div><dt>필지 면적</dt><dd><span class="num">${area != null ? nf(Math.round(area)) + ' ㎡' : '—'}</span></dd></div>
      <div><dt>결과 비율</dt><dd><span class="num">${area && p.area_m2 ? Math.min(100, Math.round(p.area_m2 / area * 100)) + '%' : '—'}</span> <span class="k">필지 가운데 AI 가 ${esc(p.cls || '결과')}로 그린 몫</span></dd></div>
      <div><dt>공시지가</dt><dd><span class="num">${price != null ? nf(price) + ' 원/㎡' : '—'}</span> <span class="k">${esc(pc.price_krw_m2?.as_of || '')}</span></dd></div>`;
  } catch (e) { document.getElementById('parcel').innerHTML = `<div><dt>지번</dt><dd class="none">이 자리의 필지 정보를 읽지 못했습니다</dd></div>`; }
}
async function mountMap(base, z, pick) {
  ST = createStage(document.getElementById('stage'), { bounds: NAMWON, interactive: true });
  await ST.ready; MAP = ST.map;
  const cat = await api('/catalog/layers?' + new URLSearchParams({ stage: 'domestic', build: 'lx', locale: 'ko' }));
  const byId = (id) => (cat.items || []).find((i) => i.id === id);
  if (base === 'img') { const it = byId('ap25-namwon-2023'); if (it) { MAP.addSource('b-img', await sourceSpec(it)); MAP.addLayer({ id: 'b-img', type: 'raster', source: 'b-img' }, 'slot-imagery'); } }
  if (base === 'lx') {
    const wms = `${API.prefix}/proxy/vworld/wms?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=lt_c_landinfobasemap&STYLES=&CRS=EPSG:3857&BBOX={bbox-epsg-3857}&WIDTH=256&HEIGHT=256&FORMAT=image/png&TRANSPARENT=false`;
    MAP.addSource('b-lx', { type: 'raster', tiles: [wms], tileSize: 256 }); MAP.addLayer({ id: 'b-lx', type: 'raster', source: 'b-lx' }, 'slot-imagery');
  }
  const pcl = byId('parcels-namwon');

    <section class="box"><h2>분야 목록 <small>분석하기 거르기 · 서비스 카드 · 기관 공유가 이 순서를 따릅니다</small></h2>
      <table class="ct"><thead><tr><th>순서</th><th>분야</th><th>서비스</th><th>수</th><th></th></tr></thead><tbody>${rows}
      <tr class="new"><td></td><td colspan="4"><div class="chips"><span class="inp ph">새 분야 이름</span><span class="go sm">새 분야 만들기</span><span class="note">예: 하천 · 재난 — 서비스가 하나도 없는 분야는 분석하기에 나오지 않습니다</span></div></td></tr></tbody></table>
    </section>
    <div class="fw-r">
      <section class="box"><h2>직원이 요청한 새 분야 <small>배포 신청서에서</small></h2><ul class="hist"><li><small>10.09</small><div><b>하천</b> — 하천 점용 분석서비스 (김제 2026 프로젝트) <span class="note">만들기 · 기존 분야에 넣기</span></div></li></ul></section>
      <section class="box"><h2>바뀐 기록</h2><ul class="hist"><li><small>10.10</small><div>'농지·시설' 설명 고침 · lxadmin</div></li><li><small>10.07</small><div>'해외' 순서 맨 뒤로 · lxadmin</div></li></ul></section>
    </div>
  </div></div>`;
}
/* 분석하기 목록 — 거르기 칩이 분야 목록(순서)을 따르고, 소개는 서비스 설명(원칙 156), 영상별 거르기(드론 · 항공 · 위성) */
const CARDS = [
  { nm: '경작·휴경 분석서비스', cat: ['농지·시설'], imgs: ['드론', '항공'], img: 'v3/service-detail/data/img/namwon-cycle4/3@2x.jpg', acc: 95, upd: '2026.01', desc: '필지별 경작 · 휴경 유무와 면적을 분석할 수 있는 서비스입니다' },
  { nm: '비닐하우스 분석서비스', cat: ['농지·시설', '건축·변화'], imgs: ['항공', '드론'], img: 'assets/proto/crops/namwon-greenhouse-2025/2@2x.jpg', acc: 89, upd: '2026.05.16', desc: '비닐하우스의 위치 · 동 수 · 면적을 필지별로 분석할 수 있는 서비스입니다' },
  { nm: '건축물 분석서비스', cat: ['건축·변화'], imgs: ['항공'], img: null, acc: 89, upd: '2026.05.16', desc: '건물의 위치와 면적을 찾아 건축물대장과 다른 필지를 분석할 수 있는 서비스입니다' },
  { nm: '주차장 분석서비스', cat: ['건축·변화'], imgs: ['항공'], img: null, acc: 89, upd: '2026.05.16', desc: '주차장으로 쓰이는 땅의 위치와 면적을 찾아 지목과 다른 필지를 분석할 수 있는 서비스입니다' },
  { nm: '곤포사일리지 분석서비스', cat: ['농지·시설'], imgs: ['드론', '항공'], img: null, acc: 96, upd: '2026.09.30', desc: '들에 쌓아 둔 곤포사일리지의 위치와 개수를 필지별로 분석할 수 있는 서비스입니다' },
];
function listView(cat, img) {
  const list = CARDS.filter((c) => (!cat || c.cat.includes(cat)) && (!img || c.imgs.includes(img)));
  const catChips = CATS.map((c) => ({ n: c.n, k: CARDS.filter((x) => x.cat.includes(c.n)).length })).filter((c) => c.k).map((c) => `<span class="chip ${cat === c.n ? 'on' : ''}">${esc(c.n)} <small>${c.k}</small></span>`).join('');
  const imgChips = ['드론', '항공', '위성'].map((k) => `<span class="chip ${img === k ? 'on' : ''}">${k} <small>${CARDS.filter((c) => c.imgs.includes(k)).length}</small></span>`).join('');
  const card = (c) => `<article class="ca">${c.img ? `<div class="pic"><img src="${LX + c.img}" alt=""><div class="cat-tag">${c.cat.map((k) => `<span>${esc(k)}</span>`).join('')}</div></div>` : `<div class="pic blank"><span>결과 장면이 아직 없습니다</span><div class="cat-tag">${c.cat.map((k) => `<span>${esc(k)}</span>`).join('')}</div></div>`}
    <div class="bd"><h3 class="nm">${esc(c.nm)}</h3><p class="ds2">${esc(c.desc)}</p><div class="hero2"><div><b>${c.acc}<i>%</i></b><small>검증 정확도</small></div><div><b class="d">${c.upd}</b><small>모델 갱신</small></div></div><div class="imk">${c.imgs.map((k) => `<span>${k}</span>`).join('')}</div>
    <div class="acts"><span class="go">분석하기</span><span class="more">자세히</span></div></div></article>`;
  return `<header class="head"><h1>분석하기</h1><p class="sub">정식 분석 서비스를 골라 내 영상으로 분석합니다 — 결과는 지도 서비스에서 봅니다</p></header>
  <div class="tools2"><div class="chips"><span class="chip ${!cat ? 'on' : ''}">전체 <small>${CARDS.length}</small></span>${catChips}<span class="sep"></span><span class="k">영상</span>${imgChips}</div>
    <div class="per"><span>한 페이지</span>${[2, 4, 6, 8].map((k) => `<b class="${k === 8 ? 'on' : ''}">${k}</b>`).join('')}<span>장</span></div></div>
  <div class="gl">${list.map(card).join('')}</div><nav class="pager"><small>${list.length}장 모두 한 페이지에 · 분야 칩은 LX 관리자의 분야 목록 순서를 따릅니다</small></nav>`;
}

/* ── 그리기 ── */
const boot = () => new Promise((r) => { const t = () => (window.maplibregl && window.pmtiles ? r() : setTimeout(t, 30)); t(); });
if (v === 'map') {
  await ensureLogin();
  const base = q.get('base') || 'img', z = q.get('z') || 'all';
  rail(STAFF, 'mapsvc'); document.getElementById('homeName').textContent = '지도 서비스'; page.classList.add('map3'); page.innerHTML = mapView(base);
  stamp.textContent = `지도 서비스 3차 — 실제 지도 · 실제 결과 데이터 · 바탕 ${({ img: '영상(2023 항공)', lx: 'LX맵', cad: '연속지적' })[base]} · 켜진 묶음 2(비닐하우스 남원 703동 + 프로젝트 추론 덕과면 144건)`;
  await boot(); await mountMap(base, z, q.get('pick') === '1');
} else if (v === 'imagery') {
  const pick = q.get('pick') || 'ap25-namwon-2023';
  rail(STAFF, 'analyze'); page.classList.add('flow'); page.innerHTML = flowView(pick);
  document.querySelectorAll('.ic').forEach((el) => { el.onclick = () => { q.set('pick', el.dataset.id); location.search = q.toString(); }; });
  stamp.textContent = `영상 고르기 3차 — 영상 원천(브이월드 · 국토지리정보원) + 공유 데이터셋 카드 두 열 + 범위 지도 · 학습 정보는 상세 오른쪽 · 고른 것 = ${pick}`;
  await boot(); await mountRangeMap(pick);
} else if (v === 'apply') {
  rail(STAFF, 'projects'); page.innerHTML = applyView(); stamp.textContent = '분야 관리 ① — 배포 신청서에 분야(여러 개) · 서비스 설명 · 쓸 수 있는 영상'; document.documentElement.dataset.mapReady = '1';
} else if (v === 'admin') {
  rail(ADMIN, 'deploys', true); page.innerHTML = adminView(); stamp.textContent = "분야 관리 ② — LX 관리자 배포 메뉴 '분야' 탭(새 분야 · 이름 바꾸기 · 순서)"; document.documentElement.dataset.mapReady = '1';
} else {
  const cat = q.get('cat') || '', img = q.get('img') || '';
  rail(STAFF, 'analyze'); page.innerHTML = listView(cat, img); stamp.textContent = `분야 관리 ③ — 분석하기 거르기가 분야 목록을 따름 · 서비스 설명 · 영상별 거르기 (${cat || '전체'}${img ? ' · ' + img : ''})`; document.documentElement.dataset.mapReady = '1';
}
</script>
</body>
</html>
