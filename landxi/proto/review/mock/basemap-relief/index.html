<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 · XI맵 입체 베이스</title>
<link rel="stylesheet" href="../../../../v3/shared/tokens-v2.2.css">
<link rel="stylesheet" href="../../../vendor/maplibre/maplibre-gl.css">
<script defer src="../../../vendor/maplibre/maplibre-gl.js"></script>
<style>
/* 설계 29차 · XI맵 입체 베이스 시안 — 바로 위에서 본 평면(기울이기 0) · 건물 그림자 · 둘레 음영 · 지형 음영을 구운 조각.
   실제 XI맵 화면 · 서버 수정 0 · GPU 0. 조각: 02. 데이터/basemap-relief/pub(→ data/tiles/basemap-relief) */
html,body{margin:0;height:100%;background:#F2F4F6;color:#1C1F25;font-family:Pretendard,sans-serif;word-break:keep-all}
#map{position:fixed;inset:0;background:#F2F4F6}
.bar{position:fixed;left:24px;top:24px;z-index:5;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;background:#fff;
  box-shadow:0 1px 0 rgba(28,31,37,.04),0 8px 24px rgba(28,31,37,.12)}
.seg{display:flex;gap:4px;padding:4px;border-radius:8px;background:#F2F4F6}
.seg button{flex:1;min-width:96px;height:36px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:#727780;font:500 14px/36px Pretendard,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:#1C1F25;box-shadow:0 1px 3px rgba(28,31,37,.12)}
.seg button:focus-visible,.tog:focus-visible{outline:2px solid #006DF7;outline-offset:2px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:16px;height:36px;padding:0 4px 0 8px;border:0;background:none;color:#1C1F25;font:500 14px/20px Pretendard,sans-serif;cursor:pointer}
.tog i{position:relative;width:40px;height:24px;border-radius:8px;background:#B0B8C1;transition:background .2s}
.tog i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:6px;background:#fff;transition:transform .2s}
.tog[aria-pressed=true] i{background:#1C1F25}
.tog[aria-pressed=true] i::after{transform:translateX(16px)}
.stamp{position:fixed;right:24px;top:24px;z-index:6;display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:8px;background:#1C1F25;color:#fff;font:500 14px/20px Pretendard,sans-serif}
.stamp span{color:#B0B8C1;font-family:Inter,sans-serif;font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:7;pointer-events:none;padding:8px 12px;border-radius:8px;background:#fff;box-shadow:0 1px 0 rgba(28,31,37,.04),0 8px 24px rgba(28,31,37,.12);font:500 14px/20px Pretendard,sans-serif;color:#1C1F25;display:none}
.tip small{display:block;color:#727780;font-weight:400}
.maplibregl-ctrl-attrib{font:400 12px/16px Pretendard,sans-serif}
@media (max-width:600px){.bar{left:12px;right:12px;top:12px}.seg button{min-width:0}.stamp{top:auto;bottom:40px;right:12px}}
</style>
</head>
<body>
<div id="map" role="region" aria-label="지도"></div>
<div class="bar">
  <div class="seg" id="city"><button type="button" data-v="namwon" aria-pressed="true">남원</button><button type="button" data-v="bishkek" aria-pressed="false">비슈케크</button></div>
  <div class="seg" id="base"><button type="button" data-v="relief" aria-pressed="true">새 베이스</button><button type="button" data-v="now" aria-pressed="false">지금 영상</button></div>
  <button type="button" class="tog" id="ai" aria-pressed="true">AI 결과<i></i></button>
</div>
<div class="stamp"><b>시안</b><span id="stampT"></span></div>
<div class="tip" id="tip"></div>
<script>
const DATA = '../../../../data/tiles/basemap-relief/';
const CITY = {
  namwon:  { center: [127.390, 35.413], zoom: 14.4, bbox: [127.357, 35.386, 127.423, 35.440] },
  bishkek: { center: [74.604, 42.876], zoom: 14.4, bbox: [74.567, 42.849, 74.641, 42.903] },
};
const CLS = {
  building:   { ko: '건물', c: '#0FA9A0' },
  farmland:   { ko: '경작지', c: '#7BB342' },
  greenhouse: { ko: '비닐하우스', c: '#3D8BEF' },
  parking:    { ko: '주차장', c: '#8E7CC3' },
  cropland:   { ko: '경작지', c: '#7BB342' },
  new_built:  { ko: '새로 생긴 시가지', c: '#0FA9A0', sub: '2017년과 2025년 비교' },
};
const S = { city: 'namwon', base: 'relief', ai: true };
const pad = (n) => String(n).padStart(2, '0');
const d = new Date(); document.getElementById('stampT').textContent = `${d.getMonth() + 1}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const colorExpr = ['match', ['get', 'cls_en'], ...Object.entries(CLS).flatMap(([k, v]) => [k, v.c]), '#0FA9A0'];

const ATT_R = { namwon: '건물 © 국토교통부 브이월드 · 도로·하천 © OpenStreetMap 기여자(ODbL) · 표고 © DLR · Airbus(Copernicus)',
                bishkek: '건물 © Overture Maps(OSM · ODbL 포함) · 도로·하천 © OpenStreetMap 기여자(ODbL) · 표고 © DLR · Airbus(Copernicus) · 결과 10m 토지피복 © Impact Observatory · Esri(CC BY 4.0)' };
const style = {
  version: 8,
  sources: {
    'r-namwon':  { type: 'raster', tiles: [DATA + 'tiles/namwon/{z}/{x}/{y}.webp?v=3'], tileSize: 256, minzoom: 13, maxzoom: 18, bounds: CITY.namwon.bbox, attribution: ATT_R.namwon },
    'r-bishkek': { type: 'raster', tiles: [DATA + 'tiles/bishkek/{z}/{x}/{y}.webp?v=3'], tileSize: 256, minzoom: 13, maxzoom: 18, bounds: CITY.bishkek.bbox, attribution: ATT_R.bishkek },
    'now-eox': { type: 'raster', tiles: ['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/GoogleMapsCompatible/{z}/{y}/{x}.jpg'], tileSize: 256, maxzoom: 13, attribution: 'Sentinel-2 cloudless © EOX(Copernicus)' },
    'now-vw': { type: 'raster', tiles: ['https://xdworld.vworld.kr/2d/Satellite/service/{z}/{x}/{y}.jpeg'], tileSize: 256, minzoom: 6, maxzoom: 19, bounds: [124.5, 33.0, 132.0, 38.9], attribution: '영상 © 브이월드' },
    'ai-namwon':  { type: 'geojson', data: DATA + 'overlay/namwon-ai.geojson', generateId: true },
    'ai-bishkek': { type: 'geojson', data: DATA + 'overlay/bishkek-ai.geojson', generateId: true },
  },
  layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': '#F2F4F6' } },
    { id: 'now-eox', type: 'raster', source: 'now-eox', layout: { visibility: 'none' } },
    { id: 'now-vw', type: 'raster', source: 'now-vw', layout: { visibility: 'none' } },
    { id: 'r-namwon', type: 'raster', source: 'r-namwon', paint: { 'raster-fade-duration': 150 } },
    { id: 'r-bishkek', type: 'raster', source: 'r-bishkek', paint: { 'raster-fade-duration': 150 } },
    ...['namwon', 'bishkek'].flatMap((c) => [
      { id: `ai-${c}-f`, type: 'fill', source: `ai-${c}`, paint: { 'fill-color': colorExpr, 'fill-opacity': ['case', ['boolean', ['feature-state', 'hover'], false], 0.62, 0.34] } },
      { id: `ai-${c}-l`, type: 'line', source: `ai-${c}`, paint: { 'line-color': colorExpr, 'line-width': ['interpolate', ['linear'], ['zoom'], 14, 0.4, 18, 1.4], 'line-opacity': 0.9 } },
    ]),
  ],
};

window.addEventListener('DOMContentLoaded', () => {
  const map = new maplibregl.Map({ container: 'map', style, center: CITY.namwon.center, zoom: CITY.namwon.zoom, minZoom: 12, maxZoom: 18.5,
    pitch: 0, maxPitch: 0, bearing: 0, dragRotate: false, pitchWithRotate: false, touchPitch: false, attributionControl: { compact: false } });
  map.touchZoomRotate.disableRotation(); map.keyboard.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
  window.__map = map;
  const vis = (id, on) => map.getLayer(id) && map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none');
  function apply() {
    const rel = S.base === 'relief';
    for (const c of ['namwon', 'bishkek']) {
      vis('r-' + c, rel && S.city === c);
      vis(`ai-${c}-f`, S.ai && S.city === c); vis(`ai-${c}-l`, S.ai && S.city === c);
    }
    vis('now-eox', !rel); vis('now-vw', !rel && S.city === 'namwon');
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(S[b.parentElement.id] === b.dataset.v)));
    document.getElementById('ai').setAttribute('aria-pressed', String(S.ai));
  }
  function fly(c) {
    const C = CITY[c]; const b = C.bbox, m = 0.03;
    map.setMaxBounds(null); map.jumpTo({ center: C.center, zoom: C.zoom });
    map.setMaxBounds([[b[0] - m, b[1] - m * 0.8], [b[2] + m, b[3] + m * 0.8]]);
  }
  document.getElementById('city').addEventListener('click', (e) => { const v = e.target.closest('button')?.dataset.v; if (!v || v === S.city) return; S.city = v; fly(v); apply(); });
  document.getElementById('base').addEventListener('click', (e) => { const v = e.target.closest('button')?.dataset.v; if (!v) return; S.base = v; apply(); });
  document.getElementById('ai').addEventListener('click', () => { S.ai = !S.ai; apply(); });
  // 결과는 범례 없이 — 가리키면 이름(원칙 233)
  const tip = document.getElementById('tip'); let hov = null;
  const clear = () => { if (hov) map.setFeatureState(hov, { hover: false }); hov = null; tip.style.display = 'none'; map.getCanvas().style.cursor = ''; };
  for (const c of ['namwon', 'bishkek']) {
    map.on('mousemove', `ai-${c}-f`, (e) => {
      const f = e.features[0]; if (!f) return;
      if (hov) map.setFeatureState(hov, { hover: false });
      hov = { source: `ai-${c}`, id: f.id }; if (f.id != null) map.setFeatureState(hov, { hover: true });
      const k = CLS[f.properties.cls_en] || { ko: '분석 결과' };
      tip.innerHTML = `${k.ko}<small>${k.sub || 'AI 분석 결과'}</small>`;
      tip.style.display = 'block'; tip.style.left = e.originalEvent.clientX + 14 + 'px'; tip.style.top = e.originalEvent.clientY + 14 + 'px';
      map.getCanvas().style.cursor = 'pointer';
    });
    map.on('mouseleave', `ai-${c}-f`, clear);
  }
  const q = new URLSearchParams(location.search);
  if (q.get('city') in CITY) S.city = q.get('city');
  if (q.get('base') === 'now') S.base = 'now';
  if (q.get('ai') === '0') S.ai = false;
  map.on('load', () => {
    fly(S.city);
    if (q.get('z')) map.jumpTo({ zoom: +q.get('z'), center: q.get('c') ? q.get('c').split(',').map(Number) : map.getCenter() });
    apply();
    map.once('idle', () => { document.documentElement.dataset.mapReady = '1'; });
  });
});
</script>
</body>
</html>
