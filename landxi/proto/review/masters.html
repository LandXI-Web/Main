ta.dc.html"></a><figcaption><b>B5 · 프로젝트 — 데이터 탭: 타일 3열 248×140 + 데이터셋 띠 + 파일 추가 드로어(썸네일 8) · CTA 파일 추가</b><span>B5-Project-Data</span></figcaption></figure><figure><a href="../../../design-canvas/v2/renders/B5-Project-Train.png" target="_blank"><img loading="lazy" src="../../../design-canvas/v2/renders/B5-Project-Train.png" alt="B5-Project-Train.dc.html"></a><figcaption><b>B5 · 프로젝트 — 학습 탭: 워크플로우 캔버스 노드 6(데이터셋 → 증강 없음 → 기반 모델 → 학습 → 검증 → 결과, 칩 = 원본 10필드) + 학습 곡선(에폭 눈금자 · 현재 에폭 테이프 58) + 이력 띠 5 + 결과 드로어(클래스별 F1 · 오분류 행렬) · CTA 학습 시작</b><span>B5-Project-Train</span></figcaption></figure><figure><a href="../../../design-canvas/v2/renders/B5-Project-Labeling.png" target="_blank"><img loading="lazy" src="../../../design-canvas/v2/renders/B5-Project-Labeling.png" alt="B5-Project-Labeling.dc.html"></a><figcaption><b>B5 · 프로젝트 — 라벨링 편집(&did=): 지도 1368 실정사영상 + 라벨 폴리곤 5 · 툴바 8 · 좌 영상 3 · 우 드로어 = 클래스 편집기(견본 · 인라인 이름 · 단축키 · 수 · ↑↓ · × · 추가) + 라벨 목록 + 일괄 변경 · CTA 저장</b><span>B5-Project-Labeling</span></figcaption></figure><figure><a href="../../../design-canvas/v2/renders/B5-Project-Analysis.png" target="_blank"><img loading="lazy" src="../../../design-canvas/v2/renders/B5-Project-Analysis.png" alt="B5-Project-Analysis.dc.html"></a><figcaption><b>B5 · 프로젝트 — 분석 탭: 지도 풀블리드 + 좌 드로어(세그먼트 3 · 픽커 3단 실썸네일 6) + 우 실행 목록 3(실행중 2 · 완료 1 → 결과 폴리곤) + 공유 설정 · CTA 분석 실행</b><span>B5-Project-Analysis</span></figcaption></figure><figure><a href="../../../design-canvas/v2/renders/B5-Project-Deploy.png" target="_blank"><img loading="lazy" src="../../../design-canvas/v2/renders/B5-Project-Deploy.png" alt="B5-Project-Deploy.dc.html"></a><figcaption><b>B5 · 프로젝트 — 배포 탭: 세그먼트 2(발행 요청 1 · 모델 등록 0 빈 판) + 우 드로어 720 발행 폼 13필드 + 학습 결과 픽커 · 썸네일 실크롭 2 · CTA 발행 요청</b><span>B5-Project-Deploy</span></figcaption></figure><figure><a href="../../../design-canvas/v2/renders/B5-Project-Delete.png" target="_blank"><img loading="lazy" src="../../../design-canvas/v2/renders/B5-Project-Delete.png" alt="B5-Project-Delete.dc.html"></a><figcaption><b>B5 · 프로젝트 — 삭제 확인: 개요 .54 감쇠 + 대화상자(원본 confirm 문구 그대로) · 취소 / 삭제</b><span>B5-Project-Delete</span></figcaption></figure><figure><a href="../../../design-canvas/v2/renders/B5-Project-Create.png" target="_blank"><img loading="lazy" src="../../../design-canvas/v2/renders/B5-Project-Create.png" alt="B5-Project-Create.dc.html"></a><figcaption><b>B5 · 프로젝트 — 만들기: 5단계 워크플로우 레일(01 프로젝트명 ✓ · 02 서비스 유형 ✓ · 03 영상 불러오기 진행 · 04 학습데이터 · 05 구성원 초대) + 03 아카이브 타일 6 + 풋프린트 판 + 우 프로젝트 요약(실크롭) · 클래스 없음 · CTA 프로젝트 만들기</b><span>B5-Project-Create</span></figcaption></figure></div></section><section><h2>홈·필름·XI맵 (B2 초안)</h2><div class="grid"><figure><a href="../../../design-canvas/v2/renders/B2-HomeFilm.png" target="_blank"><img loading="lazy" src="../../../design-canvas/v2/renders/B2-HomeFilm.png" alt="B2-HomeFilm.dc.html"></a><figcaption><b>B2 · 홈 — 필름 스테이지 (CHAPTER 01)</b><span>B2-HomeFilm</span></figcaption></figure><figure><a href="../../../design-canvas/v2/renders/B2-HomeAtlas.png" target="_blank"><img loading="lazy" src="../../../design-canvas/v2/renders/B2-HomeAtlas.png" alt="B2-HomeAtlas.dc.html"></a><figcaption><b>B2 · 홈 — 아틀라스 (CHAPTER 02)</b><span>B2-HomeAtlas</span></figcaption></figure><figure><a href="../../../design-canvas/v2/renders/B2-XiMap.png" target="_blank"><img loading="lazy" src="../../../design-canvas/v2/renders/B2-XiMap.png" alt="B2-XiMap.dc.html"></a><figcaption><b>B2 · 지도 서비스 (XI맵) — 분석 지도</b><span>B2-XiMap</span></figcaption></figure></div></section></div></body></html>
