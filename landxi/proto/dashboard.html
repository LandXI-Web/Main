<!-- 대시보드 = LX 직원의 현황판(2026-09-24 E0-6 — 공용 셸로 이관 · 관리 위젯은 운영 현황으로).
     레일 · 마스트헤드(공지 띠 · 기준일) · 제목 행 · 푸터 · 토스트는 shell.js 가 넣는다.
     본문 = 큰 숫자 밴드(정보 3) → 좌 백본 + 대한민국 전도 판(0.25° 그리드 · 토글 2) / 우 탭 패널(용량 · 스토리지).
     원본 위젯 8종의 행선지 표 — docs/superpowers/audit-0923/wave0/E0-6-result.md -->
<main id="main">
  <nav id="b-kpi" aria-label="현황 숫자"></nav>

  <section id="split">
    <section id="left" aria-labelledby="bb-h">
      <header class="sh" id="b-bb">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M3 3h14v14H3z"/><path d="M3 7.67h14M3 12.33h14M7.67 3v14M12.33 3v14"/><path d="M7.67 7.67h4.66v4.66H7.67z" fill="currentColor" stroke="none"/></svg>
        <h2 id="bb-h" class="d">AI 기반 모델 (백본)</h2>
        <span class="sp"></span>
        <span class="big bbv" id="bb-name"></span>
      </header>
      <p class="sub n" id="bb-sub"></p>
      <div id="plate-wrap">
        <div id="plate" aria-hidden="true"></div>
        <svg id="grid" aria-hidden="true"></svg>
        <div id="cells" role="group" aria-label="0.25° 그리드 셀 — 클릭하면 그 자리의 결과로"></div>
        <div id="seg" role="tablist" aria-label="판 모드">
          <button type="button" role="tab" id="seg-res" aria-selected="true" data-mode="res">AI 분석 결과</button>
          <button type="button" role="tab" id="seg-train" aria-selected="false" data-mode="train">AI 학습데이터 구축 현황</button>
        </div>
        <div id="callout" class="n" role="tooltip" hidden></div>
        <div id="legend" class="n"></div>
      </div>
    </section>

    <!-- 우 패널 조판 2가지(dashboard.js fitPanel) — 패널이 두 목록을 다 담을 만큼 높으면(1920×1200 등) 두 목록을 한 패널에 위아래로,
         아니면 탭 2개. 어느 쪽이든 행 높이를 패널에 맞춰 빈 띠(법전 §6 · 80px)를 콘텐츠로 채운다. -->
    <section id="right" aria-label="개발 자원">
      <header class="sh">
        <h2 id="both-h" class="d">개발 자원 현황</h2>
        <div id="tabs" role="tablist" aria-label="개발 자원 탭">
          <button type="button" role="tab" id="tab-proj" aria-selected="true" aria-controls="pane-proj" data-tab="proj">AI 개발 프로젝트 현황</button>
          <button type="button" role="tab" id="tab-store" aria-selected="false" aria-controls="pane-store" data-tab="store" tabindex="-1">전체 스토리지 사용량</button>
        </div>
        <span class="sp"></span>
        <a class="mic more" id="b10-more" href="ai-project.html">전체 보기 ›</a>
      </header>
      <div id="panel">
        <section id="pane-proj" role="tabpanel" aria-labelledby="tab-proj"></section>
        <section id="pane-store" role="tabpanel" aria-labelledby="tab-store" hidden></section>
      </div>
    </section>
  </section>
