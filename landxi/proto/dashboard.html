<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LX 관리자 대시보드 — Land-XI</title>
<link rel="icon" href="../assets/images/favicon_landxi.png">
<script>
  // 로그인 관문. 그리기 전에 판정한다 — 관리자 화면이 한 프레임도 새어 나가지 않게.
  if (localStorage.getItem('lx_logged_in') !== '1') {
    location.replace('../login.html?next=' + encodeURIComponent('proto/dashboard.html' + location.search));
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="v3-tokens.css">
<link rel="stylesheet" href="dashboard.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
</head><body class="v3" data-colorway="light">

<a class="skip" href="#ledger">원장으로 건너뛰기</a>

<!-- ══ A안 "지도 위 원장" ══════════════════════════════════════════════════
     레일 A1–A11 · 원장 B1–B15(원본 순서 그대로) · 판 PLATE-FULL.
     기능은 원본 dashboard.html 과 1:1 이고, 지도는 새 위젯이 아니라 그 위젯들을
     조판하는 바탕이다. 대조표 docs/superpowers/proto/2026-08-26-dashboard-parity.md -->

<!-- ── A1–A11 좌측 내비게이션 레일 ────────────────────────────────────── -->
<aside id="rail" aria-label="주 메뉴">
  <a id="rail-mark" href="../home.html" aria-label="Land-XI 홈"><img src="../assets/images/lx_symbol.png" alt=""></a>
  <nav id="rail-top" class="rail-group"></nav>
  <nav id="rail-foot" class="rail-group"></nav>
</aside>

<!-- ── 판 ─────────────────────────────────────────────────────────────── -->
<div id="plate" aria-hidden="true"></div>
<!-- 판의 비네트 — 카드도 유리도 아니다. 사진 자체의 인화 처리로 계기가 앉을 자리를 만든다.
     (§4 "오버레이는 이미지 안에". 판 위 흰 헤어라인·캡션이 밝은 지형에서도 읽히게.) -->
<div id="plate-veil" aria-hidden="true"></div>

<!-- ── 원장 — 원본 위젯 B1 → B15 를 원본 순서 그대로 세운 흰 단 ────────── -->
<aside id="ledger" tabindex="-1" aria-label="LX 관리자 대시보드">
  <div id="led-head">
    <span id="mark">LAND-XI</span>
    <h1 id="b1">LX 관리자 대시보드</h1>
    <p class="caption" id="b1-sub">서비스 운영 현황과 승인·관리 업무를 한눈에 확인하세요.</p>
    <hr class="tickrule">
    <p class="caption" id="b2">—</p>
  </div>
  <div id="led-body"></div>
  <footer id="led-foot"></footer>
</aside>

<!-- ── 판 위 계기 — 전부 이미지 안 헤어라인(D20). 떠 있는 HUD 스티커 금지. ── -->
<div id="fresh">
  <p class="caption" id="fresh-t">—</p>
  <button type="button" id="allmap" class="ghost">전체 지도로</button>
</div>

<!-- D01 취득 밀도 스캔 스트립 — 남원 농경지 정사영상 4시점 + 변화 급변 -->
<section id="scan" aria-label="정사영상 취득 · 변화 스캔">
  <p class="caption" id="scan-h">—</p>
  <div id="scan-bar"></div>
  <div id="scan-ax"></div>
</section>

<!-- D17 정직 태깅 범례 -->
<ul id="tags" aria-label="표기 규약">
  <li><i class="sw sw--m"></i>측정</li>
  <li><i class="sw sw--e"></i>추정</li>
  <li><i class="sw sw--u"></i>미확정</li>
  <li><i class="sw sw--x"></i>결측</li>
</ul>

<!-- 판 오른쪽 계기단 — 벡터 추출 카드 + 임계 범례. 한 단으로 흐른다(겹치지 않게). -->
<div id="instr">
  <!-- 지도-속-지도. B9(백본 모델)가 하는 일의 증거. -->
  <figure id="vcard" hidden></figure>
  <!-- 임계 드래그 범례 — 슬라이더가 아니라 히스토그램 위의 마커 -->
  <section id="thr" hidden aria-label="신뢰도 임계"></section>
</div>

<!-- D18 뷰어 플래그 — 지도가 지금 무엇을 보고 있는지 한 줄 -->
<p id="flag" class="caption">—</p>

<div id="probe" hidden></div>
<div id="card" hidden aria-live="polite"></div>
<p id="attrib" class="caption">자료제공: 브이월드(www.vworld.kr) · 경계 sigungu.geojson</p>

<!-- D02 어두운 유리 시간 스크러버 — 화면에 허용된 단 하나의 유리. 사건에서 선다. -->
<div id="strip" aria-label="시간 스크러버">
  <button type="button" id="strip-play" aria-pressed="true" aria-label="재생/정지"><svg viewBox="0 0 12 12" aria-hidden="true"><path class="ic-play" d="M3 2l7 4-7 4z"/><path class="ic-pause" d="M3.2 2h2.1v8H3.2zM6.7 2h2.1v8H6.7z"/></svg></button>
  <span class="num strip-end" id="strip-t0">—</span>
  <div id="strip-track" role="slider" tabindex="0" aria-label="시점" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <canvas id="strip-bar"></canvas>
    <i id="strip-head"></i>
    <div id="strip-marks"></div>
  </div>
  <span class="num strip-end" id="strip-t1">—</span>
  <span class="num" id="strip-now">—</span>
  <span id="strip-note" class="caption"></span>
</div>

<script type="module" src="dashboard.js"></script>
</body></html>
