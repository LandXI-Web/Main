<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Land-XI — 국토 조사 보드 · 남원시 비닐하우스 9,664동</title>
<link rel="icon" href="../assets/images/favicon_landxi.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="v3-tokens.css">
<link rel="stylesheet" href="workflow.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="env.js"></script>
</head><body class="v3" data-colorway="dark">

<a class="skip" href="#stage">보드로 건너뛰기</a>

<!-- ── 상단 79px 바 하나. 이것이 화면의 유일한 크롬이다. ───────────────── -->
<header id="bar">
  <span id="mark">LAND-XI</span>
  <h1 id="ttl">국토 조사 보드</h1>
  <p id="place" class="caption">—</p>
  <div id="bar-r">
    <div id="presets" role="tablist" aria-label="조사 과업">
      <button role="tab" aria-selected="true" data-preset="namwon-greenhouse">남원 비닐하우스</button>
      <button role="tab" aria-selected="false" data-preset="yeosu-marine">여수 해양쓰레기</button>
    </div>
    <span id="live"><i></i>LIVE</span>
  </div>
</header>

<main id="stage" tabindex="-1">
  <div id="map"></div>
  <canvas id="glow" aria-hidden="true"></canvas>
  <canvas id="edges" aria-hidden="true"></canvas>
  <div id="nodes" data-band="mid"></div>

  <!-- 거의 안 보이는 관측 격자 인덱스 — "여기는 계측 공간이다" -->
  <div id="gridhud" aria-hidden="true"></div>

  <!-- 커서 좌표 · 사람 척도 스케일바 -->
  <p id="xy" class="num" aria-hidden="true"></p>
  <div id="scale" aria-hidden="true"><span id="scale-bar"></span><span id="scale-t" class="num"></span></div>

  <!-- ── 우: 라이브 분석 (패널 배경 없음 · 헤어라인 한 줄로만 구획) ─────── -->
  <section id="panel" aria-label="라이브 분석">
    <p id="eyebrow" class="label">—</p>
    <div id="stat" class="stat num" aria-live="polite"></div>
    <p id="statsub" class="caption"></p>

    <hr class="hr">
    <div class="row"><span class="label">신뢰도 임계</span><span id="thr" class="num">0.50</span></div>
    <canvas id="conf" tabindex="0" role="slider" aria-label="신뢰도 임계값"
            aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.5"></canvas>
    <p id="confnote" class="caption"></p>

    <hr class="hr">
    <div class="row"><span class="label">클래스</span><span id="clsnote" class="caption"></span></div>
    <ul id="cls"></ul>

    <hr class="hr">
    <div class="row"><span class="label">실행</span><span id="tps" class="num">—</span></div>
    <button id="run" class="bracket" type="button">파이프라인 실행</button>
    <p id="runnote" class="caption"></p>
  </section>

  <!-- ── 좌하단: 선택 타일 스트립 (삼면 결속의 두 번째 면) ───────────────── -->
  <section id="strip" aria-label="선택 타일">
    <div class="row"><span class="label">TILES</span><span id="striph" class="caption"></span></div>
    <div id="stripl"></div>
  </section>

  <!-- ── 우하단: 미니맵은 그래프가 아니라 영토다 ─────────────────────────── -->
  <div id="mini"><canvas id="minic"></canvas><span class="label">남원시 · 처리 현황</span></div>

  <!-- ── 심층 검토 — 밝은 면과 어두운 면이 칼로 그은 경계로 만난다 ───────── -->
  <aside id="inspect" data-colorway="light" hidden aria-label="심층 검토">
    <div class="ins-h">
      <span class="label">DEEP INSPECT</span>
      <button id="ins-x" type="button" aria-label="닫기">×</button>
    </div>
    <div id="ins-n" class="stat num"></div>
    <p id="ins-sub" class="caption"></p>
    <canvas id="ins-c" width="640" height="420"></canvas>
    <p id="ins-cap" class="caption"></p>
    <dl id="ins-meta"></dl>
    <div id="ins-rows"></div>
  </aside>

  <div id="lasso-hint" class="caption">SHIFT+드래그 영역 선택 · 클릭 탐지 선택 · I 심층 검토 · [ ] 임계</div>
</main>

<!-- ── 상주 타임라인 — 이 화면에서 허용된 단 하나의 유리 ────────────────── -->
<div id="time">
  <button id="play" type="button" aria-label="시점 자동재생">▶</button>
  <canvas id="tl"></canvas>
  <div id="tside">
    <span id="tstamp" class="num">2025-10</span>
    <span id="tnote" class="caption"></span>
  </div>
</div>

<p id="attrib" class="caption"></p>

<!-- 로더는 스피너가 아니라 3단 조립 -->
<div id="boot"><div id="boot-in">
  <span class="label">LAND-XI · 국토 조사 보드</span>
  <ol id="boot-steps">
    <li data-s="1">실자산 카탈로그</li><li data-s="2">탐지 폴리곤</li><li data-s="3">정사영상 타일</li>
  </ol>
  <span id="boot-note" class="caption"></span>
</div></div>

<script type="module" src="workflow.js"></script>
</body></html>
