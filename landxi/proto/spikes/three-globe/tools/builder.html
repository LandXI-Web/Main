<!doctype html><meta charset="utf-8"><title>spike texture builder</title>
<body style="background:#111;color:#ccc;font:12px monospace"><pre id="log"></pre>
<script>
const log = m => { document.getElementById('log').textContent += m + '\n'; console.log(m); };
const R2D = 180 / Math.PI;
const tileLon = (x, z) => x / 2 ** z * 360 - 180;
const tileLat = (y, z) => { const t = Math.PI - 2 * Math.PI * y / 2 ** z; return R2D * Math.atan(0.5 * (Math.exp(t) - Math.exp(-t))); };
const lonTile = (lon, z) => (lon + 180) / 360 * 2 ** z;
const latTile = (lat, z) => { const s = Math.sin(lat / R2D); return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 2 ** z; };

function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function load(url) {
  return new Promise(res => {
    const i = new Image(); i.crossOrigin = 'anonymous';
    i.onload = () => res(i); i.onerror = () => res(null); i.src = url;
  });
}
async function pool(items, n, fn) {
  let i = 0, done = 0;
  await Promise.all(Array.from({ length: n }, async () => {
    while (i < items.length) { const k = i++; await fn(items[k]); if (++done % 128 === 0) log('  ' + done + '/' + items.length); }
  }));
}

// 머케이터 타일 격자를 하나의 캔버스로 붙인다.
async function mosaic(tpl, z, x0, x1, y0, y1, ts = 256, conc = 24) {
  const c = cv((x1 - x0 + 1) * ts, (y1 - y0 + 1) * ts), g = c.getContext('2d');
  const jobs = [];
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) jobs.push([x, y]);
  await pool(jobs, conc, async ([x, y]) => {
    const img = await load(tpl.replace('{z}', z).replace('{x}', x).replace('{y}', y));
    if (img) g.drawImage(img, (x - x0) * ts, (y - y0) * ts, ts, ts);
  });
  return c;
}

// V-World 위성은 한국 영역 밖(및 일부 해상)에 실촬영 대신 매끈한 저해상 채움 타일을 준다.
// 그 경계가 타일 단위 계단으로 보이므로, 분산이 낮은 '무데이터' 타일은 지워서
// 셰이더가 저해상 원본(EOX)을 쓰게 한다.
function dropFlatTiles(src, ts = 256, sdMin = 7) {
  const W = src.width, H = src.height, g = src.getContext('2d');
  const img = g.getImageData(0, 0, W, H), d = img.data;
  const nx = Math.ceil(W / ts), ny = Math.ceil(H / ts);
  let dropped = 0;
  for (let ty = 0; ty < ny; ty++) for (let tx = 0; tx < nx; tx++) {
    let s = 0, s2 = 0, n = 0;
    const x1 = Math.min(W, (tx + 1) * ts), y1 = Math.min(H, (ty + 1) * ts);
    for (let y = ty * ts; y < y1; y += 3) for (let x = tx * ts; x < x1; x += 3) {
      const i = (y * W + x) * 4;
      const l = d[i] * 0.2126 + d[i + 1] * 0.7152 + d[i + 2] * 0.0722;
      s += l; s2 += l * l; n++;
    }
    if (!n) continue;
    const m = s / n, sd = Math.sqrt(Math.max(0, s2 / n - m * m));
    if (sd >= sdMin) continue;
    dropped++;
    for (let y = ty * ts; y < y1; y++) for (let x = tx * ts; x < x1; x++) {
      const i = (y * W + x) * 4; d[i] = d[i + 1] = d[i + 2] = 0;
    }
  }
  g.putImageData(img, 0, 0);
  log('  dropFlatTiles ' + dropped + '/' + (nx * ny) + ' 무데이터 타일 제거');
  return src;
}

// V-World 위성 모자이크는 타일마다 촬영/보정 노출이 달라 바다 위에 체크무늬가 남는다.
// 타일 평균 휘도로 저주파 보정장을 만들어(쌍선형 확대) 나눠 주면 이음매가 사라진다.
function flattenTiles(src, ts = 256) {
  const W = src.width, H = src.height, g = src.getContext('2d');
  const img = g.getImageData(0, 0, W, H), d = img.data;
  const nx = Math.ceil(W / ts), ny = Math.ceil(H / ts);
  const small = cv(nx, ny), sg = small.getContext('2d');
  const sd = sg.createImageData(nx, ny);
  let gSum = 0, gN = 0;
  for (let ty = 0; ty < ny; ty++) for (let tx = 0; tx < nx; tx++) {
    let sum = 0, n = 0;
    for (let y = ty * ts; y < Math.min(H, (ty + 1) * ts); y += 4)
      for (let x = tx * ts; x < Math.min(W, (tx + 1) * ts); x += 4) {
        const i = (y * W + x) * 4;
        const l = d[i] * 0.2126 + d[i + 1] * 0.7152 + d[i + 2] * 0.0722;
        if (l > 3) { sum += l; n++; }
      }
    const m = n > 64 ? sum / n : -1;
    const k = (ty * nx + tx) * 4;
    sd.data[k] = sd.data[k + 1] = sd.data[k + 2] = m < 0 ? 0 : Math.min(255, Math.round(m));
    sd.data[k + 3] = 255;
    if (m > 0) { gSum += m; gN++; }
  }
  if (!gN) return src;
  const gMean = gSum / gN;
  // 빈 타일(-1)은 전역 평균으로 메워 보정장이 튀지 않게 한다
  for (let k = 0; k < sd.data.length; k += 4)
    if (sd.data[k] === 0) sd.data[k] = sd.data[k + 1] = sd.data[k + 2] = Math.round(gMean);
  sg.putImageData(sd, 0, 0);

  const field = cv(W, H), fg = field.getContext('2d');
  fg.imageSmoothingEnabled = true; fg.imageSmoothingQuality = 'high';
  fg.drawImage(small, 0, 0, nx, ny, -ts / 2, -ts / 2, W + ts, H + ts);   // 타일 중심 정렬
  const fd = fg.getImageData(0, 0, W, H).data;
  for (let i = 0; i < d.length; i += 4) {
    const f = fd[i] || gMean;
    const gain = Math.max(0.72, Math.min(1.38, gMean / f));
    d[i] = Math.min(255, d[i] * gain);
    d[i + 1] = Math.min(255, d[i + 1] * gain);
    d[i + 2] = Math.min(255, d[i + 2] * gain);
  }
  g.putImageData(img, 0, 0);
  log('  flattenTiles ' + nx + 'x' + ny + ' mean ' + gMean.toFixed(1));
  return src;
}

// 전지구 머케이터(±85.051°) 모자이크 → 등장방형(equirect, ±90°)
function toEquirect(src, W, H) {
  const out = cv(W, H), g = out.getContext('2d');
  g.imageSmoothingEnabled = true;
  const S = src.height;
  for (let row = 0; row < H; row++) {
    const lat = 90 - (row + 0.5) / H * 180;
    if (Math.abs(lat) > 85.0511) continue;            // 극지방: 머케이터에 자료 없음
    const yPx = latTile(lat, 0) * S;                   // z0 정규화 → 0..1 → 픽셀
    g.drawImage(src, 0, Math.min(S - 1, Math.max(0, yPx - 0.5)), src.width, 1, 0, row, W, 1);
  }
  // 극지방을 가장 가까운 유효 행으로 채워 심(seam)을 없앤다
  const topRow = Math.ceil(H * (90 - 85.0511) / 180) + 1, botRow = H - topRow - 1;
  for (let r = 0; r < topRow; r++) g.drawImage(out, 0, topRow, W, 1, 0, r, W, 1);
  for (let r = botRow; r < H; r++) g.drawImage(out, 0, botRow - 1, W, 1, 0, r, W, 1);
  return out;
}

function jpg(c, q = 0.9) { return c.toDataURL('image/jpeg', q); }
function png(c) { return c.toDataURL('image/png'); }

const SRC = {
  eox: 'https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2024_3857/default/g/{z}/{y}/{x}.jpg',
  night: 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Black_Marble/default/2016-01-01/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png',
  dem: 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png',
  vsat: 'https://xdworld.vworld.kr/2d/Satellite/service/{z}/{x}/{y}.jpeg',
  ortho: '/landxi/assets/tiles/namwon_city_2510/{z}/{x}/{y}.webp',
};

window.build = {
  async day(z = 5) {                                  // 전지구 주간 — EOX Sentinel-2 cloudless
    const n = 2 ** z - 1;
    const m = await mosaic(SRC.eox, z, 0, n, 0, n);
    log('day mosaic ' + m.width + 'x' + m.height);
    return jpg(toEquirect(m, m.width, m.width / 2), 0.86);
  },
  async night(z = 4) {                                // 야간등 — NASA Black Marble
    const n = 2 ** z - 1;
    const m = await mosaic(SRC.night, z, 0, n, 0, n);
    return jpg(toEquirect(m, 4096, 2048), 0.82);
  },
  async terrain(z = 5) {                              // terrarium DEM → 범프(높이) + 해양 마스크
    const n = 2 ** z - 1;
    const m = await mosaic(SRC.dem, z, 0, n, 0, n);
    const eq = toEquirect(m, 4096, 2048), g = eq.getContext('2d');
    const d = g.getImageData(0, 0, 4096, 2048), p = d.data;
    const bump = cv(4096, 2048), spec = cv(4096, 2048);
    const bd = bump.getContext('2d').createImageData(4096, 2048);
    const sd = spec.getContext('2d').createImageData(4096, 2048);
    for (let i = 0; i < p.length; i += 4) {
      const h = p[i] * 256 + p[i + 1] + p[i + 2] / 256 - 32768;   // terrarium 디코드(m)
      const v = Math.max(0, Math.min(255, Math.round(h / 8000 * 255 * 1.0 + 8)));
      bd.data[i] = bd.data[i + 1] = bd.data[i + 2] = h <= 0 ? 0 : v; bd.data[i + 3] = 255;
      const s = h <= 0 ? 255 : 0;                                  // 바다=1 → 스펙큘러
      sd.data[i] = sd.data[i + 1] = sd.data[i + 2] = s; sd.data[i + 3] = 255;
    }
    bump.getContext('2d').putImageData(bd, 0, 0);
    spec.getContext('2d').putImageData(sd, 0, 0);
    // 해안선 계단을 부드럽게
    const blur = (src) => { const o = cv(2048, 1024), g2 = o.getContext('2d'); g2.filter = 'blur(1.2px)'; g2.drawImage(src, 0, 0, 2048, 1024); return o; };
    return { bump: jpg(bump, 0.85), spec: jpg(blur(spec), 0.85) };
  },
  async korea(z = 8, b = [122, 32, 133, 40]) {        // 한반도 지역 고해상 패치 (V-World 위성)
    const x0 = Math.floor(lonTile(b[0], z)), x1 = Math.ceil(lonTile(b[2], z)) - 1;
    const y0 = Math.floor(latTile(b[3], z)), y1 = Math.ceil(latTile(b[1], z)) - 1;
    const m = flattenTiles(dropFlatTiles(await mosaic(SRC.vsat, z, x0, x1, y0, y1)));
    const bounds = [tileLon(x0, z), tileLat(y1 + 1, z), tileLon(x1 + 1, z), tileLat(y0, z)];
    log('korea ' + m.width + 'x' + m.height + ' bounds ' + bounds.map(v => v.toFixed(3)));
    // 구면 셰이더에서 등장방형 uv 로 샘플하려면 위도 방향을 선형(equirect)으로 다시 편다.
    const H = Math.round(m.width * (bounds[3] - bounds[1]) / (bounds[2] - bounds[0]));
    const out = cv(m.width, H), g = out.getContext('2d');
    for (let row = 0; row < H; row++) {
      const lat = bounds[3] - (row + 0.5) / H * (bounds[3] - bounds[1]);
      const yPx = (latTile(lat, z) - y0) * 256;
      g.drawImage(m, 0, Math.max(0, yPx - 0.5), m.width, 1, 0, row, m.width, 1);
    }
    return { data: jpg(out, 0.88), bounds };
  },
  async ortho(z, lon, lat, tiles = 16) {              // 우리 정사영상 — 정중앙 tiles×tiles 창
    const cx = Math.floor(lonTile(lon, z)), cy = Math.floor(latTile(lat, z));
    const h = tiles >> 1;
    const x0 = cx - h, x1 = cx + h - 1, y0 = cy - h, y1 = cy + h - 1;
    // 촬영 범위가 사각형이 아니라 성기다 → 빈 칸은 V-World 위성으로 메운다
    const m = await mosaic(SRC.vsat, z, x0, x1, y0, y1, 256, 24);
    const our = await mosaic(SRC.ortho, z, x0, x1, y0, y1, 256, 32);
    m.getContext('2d').drawImage(our, 0, 0);
    const bounds = [tileLon(x0, z), tileLat(y1 + 1, z), tileLon(x1 + 1, z), tileLat(y0, z)];
    log('ortho z' + z + ' ' + m.width + 'x' + m.height + ' bounds ' + bounds.map(v => v.toFixed(4)));
    return { data: jpg(m, 0.9), bounds };
  },
  async clouds() {                                    // NASA Visible Earth 구름 (turban/webgl-earth 미러)
    const i = await load('https://raw.githubusercontent.com/turban/webgl-earth/master/images/fair_clouds_4k.png');
    if (!i) return null;
    const c = cv(4096, 2048), g = c.getContext('2d');
    g.drawImage(i, 0, 0, 4096, 2048);
    const d = g.getImageData(0, 0, 4096, 2048);       // 휘도 × 원본 알파 → 알파
    for (let k = 0; k < d.data.length; k += 4) {
      const lum = (d.data[k] * 0.3 + d.data[k + 1] * 0.59 + d.data[k + 2] * 0.11);
      const a = Math.round(lum * (d.data[k + 3] / 255));
      d.data[k] = d.data[k + 1] = d.data[k + 2] = 255; d.data[k + 3] = a;
    }
    g.putImageData(d, 0, 0);
    return png(c);
  },
};
window.__ready = 1;
</script>
