<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPIKE · scrollcam — 스크롤 구동 카메라 레일</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="scrollcam.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
</head>
<body>

<div id="stage">
  <div id="map"></div>

  <div id="copy">
    <p class="ch" data-ch="0"><b>궤도</b><span>국토가 깨어난다</span></p>
    <p class="ch" data-ch="1"><b>대기권</b><span>구름을 지난다</span></p>
    <p class="ch" data-ch="2"><b>강하</b><span>남원 분지로</span></p>
    <p class="ch" data-ch="3"><b>착지</b><span>정사영상 위에 선다</span></p>
  </div>

  <div id="rail"><i></i><em id="rail-p">0.000</em></div>

  <aside id="hud">
    <h1>scrollcam <small>SPIKE</small></h1>
    <dl>
      <dt>fps</dt><dd id="m-fps">—</dd>
      <dt>지연 p50 / p95</dt><dd id="m-lat">—</dd>
      <dt>정지 잔떨림</dt><dd id="m-jit">—</dd>
      <dt>게이트</dt><dd id="m-gate">—</dd>
      <dt>프레임 최악</dt><dd id="m-worst">—</dd>
      <dt>apply / skip</dt><dd id="m-app">—</dd>
    </dl>
    <hr>
    <dl class="cam">
      <dt>p</dt><dd id="c-p">—</dd>
      <dt>center</dt><dd id="c-c">—</dd>
      <dt>zoom</dt><dd id="c-z">—</dd>
      <dt>pitch / bearing</dt><dd id="c-tb">—</dd>
      <dt>투영 · 모드</dt><dd id="c-proj">—</dd>
    </dl>
  </aside>

  <nav id="ctl">
    <p class="cap">레일</p>
    <label><input type="checkbox" id="o-tension" checked> Catmull-Rom (끄면 선형)</label>
    <label><input type="checkbox" id="o-warp" checked> 화면속도 재매개변수화</label>
    <label><input type="checkbox" id="o-join" checked> 이징 이음(경계 속도 연결)</label>
    <label><input type="checkbox" id="o-magnet" checked> 챕터 자석</label>
    <label><input type="checkbox" id="o-gate" checked> 타일 준비 게이트</label>
    <label><input type="checkbox" id="o-terrain"> 지형 (fps 비용)</label>
    <label><input type="checkbox" id="o-reduced"> 모션 감소 모의</label>
    <div class="row">
      <button id="b-play">20s 자동재생</button>
      <button id="b-reset">계측 초기화</button>
    </div>
    <p class="cap">결과 판 — 클릭하면 실제 지점으로 난다</p>
    <div id="plates"></div>
    <p class="hint">휠 · 터치 · ↑↓ PgUp/PgDn Space · ←→ 챕터 · Home/End<br>판을 띄운 뒤 스크롤하면 레일로 되돌아온다</p>
  </nav>

  <div id="boot">타일 수신 중…</div>
</div>

<div id="scroller"></div>

<script type="module" src="app.js"></script>
</body>
</html>
