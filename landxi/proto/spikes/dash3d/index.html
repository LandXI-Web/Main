<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>스파이크 — 대시보드 판 3D · Land-XI</title>
<link rel="stylesheet" href="../../vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="../../v3-tokens.css">
<script src="../../vendor/maplibre/maplibre-gl.js"></script>
<style>
@import url("https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css");
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap");
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#FFF;color:#010102;font-family:'Pretendard',system-ui,sans-serif}
.d{font-family:'SUIT','Pretendard',sans-serif;font-weight:500;letter-spacing:-.01em}.n{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums}
.mic{font-size:12px;color:#686868;line-height:1.35}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#010102}
#map{position:absolute;inset:0}
.maplibregl-canvas{outline:none}
#hd{position:absolute;left:56px;top:40px;color:#FFF;z-index:3;pointer-events:none}
#hd h1{margin:0;font-size:48px;line-height:1.1}#hd p{margin:10px 0 0;font-size:15px;color:rgba(255,255,255,.72)}
#tg{position:absolute;left:56px;top:150px;display:flex;z-index:4}
#tg button{height:32px;padding:0 14px;font:400 13px 'Pretendard',sans-serif;border:1px solid #FFF;background:rgba(1,1,2,.35);color:#FFF;cursor:pointer;margin-right:-1px}
#tg button[aria-checked="true"]{background:#FFF;color:#010102}
#tg button:focus-visible{outline:2px solid #FFF;outline-offset:2px}
#co{position:absolute;z-index:5;width:264px;background:#FFF;border:1px solid #010102;padding:8px 11px;line-height:15px;font-size:12px;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity 200ms cubic-bezier(.15,1,.3,1),transform 200ms cubic-bezier(.15,1,.3,1)}
#co.on{opacity:1;transform:none}#co b{font-weight:400}#co .k{color:#0FA9A0;letter-spacing:.04em;margin-top:5px}#co .g{color:#686868}
#lg{position:absolute;right:56px;bottom:40px;color:#FFF;font-size:12px;line-height:16px;z-index:3;display:flex;flex-direction:column;gap:4px}
#lg i{display:inline-block;width:10px;height:10px;margin-right:7px;vertical-align:-1px}
#nt{position:absolute;left:56px;bottom:40px;color:rgba(255,255,255,.6);font-size:12px;z-index:3;max-width:520px;line-height:1.5}
@media (prefers-reduced-motion:reduce){#co{transition:none}}
</style></head><body>
<div id="stage">
  <div id="map" aria-label="대한민국 전도 3D 판"></div>
  <div id="hd"><h1 class="d">국토 위에 쌓이는 AI</h1><p>셀의 높이 = 그 자리에 쌓인 결과·영상의 수 · 0.25° 그리드 · 실존 AOI 만</p></div>
  <div id="tg" role="radiogroup" aria-label="판 모드">
    <button role="radio" aria-checked="true" data-mode="ai">AI 분석 결과</button>
    <button role="radio" aria-checked="false" data-mode="data">AI 학습데이터 구축 현황</button>
  </div>
  <div id="co" role="status"></div>
  <div id="lg"></div>
  <div id="nt">스파이크 — 승인된 대시보드(12.8)의 판을 3D로 바꾼 실험. 커서를 움직이면 판이 기울고, 셀에 올리면 기둥이 떠오른다. 클릭하면 그 셀로 내려간다. 데이터는 12.8 구현과 같은 집계(db-data.js).</div>
</div>
<script type="module">
import { cellsFor, gradeOf, legendFor, calloutFor, cellBBox, cellCoords, CELL, GRID } from '../../dashboard-128/db-data.js';
import { EOX } from '../../js/sources.js';
const TEAL = '#0FA9A0', RM = matchMedia('(prefers-reduced-motion:reduce)').matches;
const cells = cellsFor();
let mode = 'ai', hoverId = null, grow = 0;

const H = (c, m) => { const n = m === 'ai' ? c.ai : c.data; return n * 9000; };          // m per unit
const fc = (m, k) => ({ type: 'FeatureCollection', features: cells.map((c, i) => {
  const [w, s, e, n] = cellBBox(c); const planned = (c.planned || []).length && !c.ai && !c.data;
  return { type: 'Feature', id: i, properties: { i, h: H(c, m) * k, n: m === 'ai' ? c.ai : c.data, planned: planned ? 1 : 0 },
    geometry: { type: 'Polygon', coordinates: [[[w, s], [e, s], [e, n], [w, n], [w, s]]] } }; }) });
const gridLines = () => { const f = []; for (let x = GRID.w; x <= GRID.e + 1e-9; x += CELL) f.push({ type: 'Feature', properties: { major: Number.isInteger(+x.toFixed(2)) ? 1 : 0 }, geometry: { type: 'LineString', coordinates: [[x, GRID.s], [x, GRID.n]] } });
  for (let y = GRID.s; y <= GRID.n + 1e-9; y += CELL) f.push({ type: 'Feature', properties: { major: Number.isInteger(+y.toFixed(2)) ? 1 : 0 }, geometry: { type: 'LineString', coordinates: [[GRID.w, y], [GRID.e, y]] } });
  return { type: 'FeatureCollection', features: f }; };

const HOME = { center: [127.7, 35.9], zoom: 6.35, pitch: 56, bearing: -18 };
const map = new maplibregl.Map({ container: 'map', attributionControl: false, interactive: false, maxPitch: 75,
  style: { version: 8, projection: { type: 'globe' }, sources: { eox: { type: 'raster', tiles: [EOX], tileSize: 256, maxzoom: 14 } },
    layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#010102' } }, { id: 'eox', type: 'raster', source: 'eox', paint: { 'raster-saturation': -.25, 'raster-contrast': .06, 'raster-brightness-max': .86 } }],
    sky: { 'sky-color': '#010102', 'horizon-color': '#0b1320', 'fog-color': '#010102', 'sky-horizon-blend': .6, 'horizon-fog-blend': .7, 'fog-ground-blend': .4, 'atmosphere-blend': .6 } },
  center: [127.7, 36.2], zoom: RM ? HOME.zoom : 1.6, pitch: RM ? HOME.pitch : 0, bearing: RM ? HOME.bearing : 0 });

const colorExpr = () => mode === 'ai'
  ? ['case', ['==', ['get', 'planned'], 1], 'rgba(255,255,255,.0)', ['>=', ['get', 'n'], 1], TEAL, 'rgba(255,255,255,.25)']
  : ['case', ['==', ['get', 'planned'], 1], 'rgba(255,255,255,.0)', ['>=', ['get', 'n'], 1], '#FFFFFF', 'rgba(15,169,160,.25)'];
const opExpr = () => ['case', ['boolean', ['feature-state', 'hover'], false], .98, ['interpolate', ['linear'], ['get', 'n'], 0, .25, 1, .5, 2, .68, 4, .86]];

map.on('load', () => {
  map.addSource('grid', { type: 'geojson', data: gridLines() });
  map.addLayer({ id: 'grid', type: 'line', source: 'grid', paint: { 'line-color': '#FFFFFF', 'line-opacity': ['case', ['==', ['get', 'major'], 1], .28, .1], 'line-width': 1 } });
  map.addSource('cells', { type: 'geojson', data: fc(mode, RM ? 1 : 0) });
  map.addLayer({ id: 'cells-base', type: 'line', source: 'cells', filter: ['!=', ['get', 'planned'], 1], paint: { 'line-color': '#FFFFFF', 'line-width': 1, 'line-opacity': .8 } });
  map.addLayer({ id: 'cells-plan', type: 'line', source: 'cells', filter: ['==', ['get', 'planned'], 1], paint: { 'line-color': '#FFFFFF', 'line-width': 1, 'line-dasharray': [2, 2] } });
  map.addLayer({ id: 'cells', type: 'fill-extrusion', source: 'cells', paint: { 'fill-extrusion-color': colorExpr(), 'fill-extrusion-height': ['+', ['get', 'h'], ['case', ['boolean', ['feature-state', 'hover'], false], 6000, 0]], 'fill-extrusion-base': ['case', ['boolean', ['feature-state', 'hover'], false], 6000, 0], 'fill-extrusion-opacity': .82, 'fill-extrusion-vertical-gradient': false } });
  legend();
  if (RM) return;
  map.easeTo({ ...HOME, duration: 3200, easing: (t) => 1 - Math.pow(1 - t, 4) });
  map.once('moveend', () => rise());
});

function rise(from = 0) { const t0 = performance.now(), D = 1000; const tick = (t) => { const p = Math.min(1, (t - t0) / D), k = from + (1 - from) * (1 - Math.pow(1 - p, 4)); map.getSource('cells')?.setData(fc(mode, k)); if (p < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }

// 커서 패럴랙스 — 판이 커서를 따라 조금 기운다(유휴 운동 없음: 커서가 멈추면 판도 멈춘다)
let tx = 0, ty = 0, cx = 0, cy = 0, zoomed = false, raf = 0;
const stage = document.getElementById('stage');
stage.addEventListener('pointermove', (e) => { tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5; if (!raf && !RM) raf = requestAnimationFrame(para); hover(e); });
function para() { raf = 0; cx += (tx - cx) * .12; cy += (ty - cy) * .12; if (!zoomed && !map.isEasing()) map.jumpTo({ bearing: HOME.bearing + cx * 14, pitch: HOME.pitch - cy * 10 }); if (Math.abs(tx - cx) + Math.abs(ty - cy) > .002) raf = requestAnimationFrame(para); }

const co = document.getElementById('co');
function hover(e) {
  const f = map.getLayer('cells') ? map.queryRenderedFeatures([e.clientX, e.clientY], { layers: ['cells', 'cells-base', 'cells-plan'] })[0] : null;
  const id = f ? f.id : null;
  if (id === hoverId) { if (id != null) place(e); return; }
  if (hoverId != null) map.setFeatureState({ source: 'cells', id: hoverId }, { hover: false });
  hoverId = id;
  if (id == null) { co.classList.remove('on'); stage.style.cursor = ''; return; }
  map.setFeatureState({ source: 'cells', id }, { hover: true }); stage.style.cursor = 'pointer';
  const c = cells[id]; const lines = calloutFor(c, mode);
  co.innerHTML = `<div>${lines.place} <span class="n g">${lines.coords}</span></div><div class="k" style="color:${lines.headTone === 'ai' ? '#0FA9A0' : '#686868'}">${lines.head}</div>` + lines.lines.map((r) => `<div class="n${r.tone === 'mute' ? ' g' : ''}">${r.t}</div>`).join('');
  co.classList.add('on'); place(e);
}
function place(e) { const x = Math.min(innerWidth - 280, e.clientX + 18), y = Math.max(16, e.clientY - 110); co.style.left = x + 'px'; co.style.top = y + 'px'; }

stage.addEventListener('click', () => {
  if (hoverId == null) { if (zoomed) { zoomed = false; map.easeTo({ ...HOME, duration: 1400 }); } return; }
  const [w, s, e2, n] = cellBBox(cells[hoverId]); zoomed = true;
  map.easeTo({ center: [(w + e2) / 2, (s + n) / 2], zoom: 9.2, pitch: 62, bearing: HOME.bearing + 24, duration: RM ? 0 : 1800, easing: (t) => 1 - Math.pow(1 - t, 4) });
});

for (const b of document.querySelectorAll('#tg button')) b.addEventListener('click', (ev) => { ev.stopPropagation(); setMode(b.dataset.mode); });
document.getElementById('tg').addEventListener('keydown', (e) => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { setMode(mode === 'ai' ? 'data' : 'ai'); document.querySelector(`#tg [data-mode="${mode}"]`).focus(); } });
function setMode(m) { if (m === mode) return; mode = m; for (const b of document.querySelectorAll('#tg button')) b.setAttribute('aria-checked', String(b.dataset.mode === m)); map.setPaintProperty('cells', 'fill-extrusion-color', colorExpr()); RM ? map.getSource('cells').setData(fc(mode, 1)) : rise(.15); legend(); co.classList.remove('on'); }

function legend() { const L = legendFor(cells, mode); const sw = (bg, bd, dash) => `<i style="background:${bg};border:1px ${dash ? 'dashed' : 'solid'} ${bd}"></i>`;
  document.getElementById('lg').innerHTML = `<div style="opacity:.7;letter-spacing:.04em">${mode === 'ai' ? '기둥 높이 = 결과 건수' : '기둥 높이 = 영상 시점 수'}</div>` + L.rows.map((r) => { const plan = r.g === 'plan', empty = /0$/.test(r.g), lv = +r.g.slice(1) || 0, a = [0, .3, .55, .82][Math.min(3, lv)]; const bg = plan || empty ? 'none' : (mode === 'ai' ? `rgba(15,169,160,${a})` : `rgba(255,255,255,${a})`); return `<div>${sw(bg, plan || mode !== 'ai' ? '#FFF' : (empty ? 'rgba(255,255,255,.45)' : TEAL), plan)}${r.name} <span class="n">${r.n}셀</span></div>`; }).join(''); }
window.__spike = { map, cells };
</script></body></html>
