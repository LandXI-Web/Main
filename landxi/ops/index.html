<body data-stage="ops">
<script type="module">
import { gate, ready } from '/landxi/ops/js/boot.js';

import { mountOverview } from '/landxi/ops/js/deploy-map.js';
import { mountPalette } from '/landxi/ops/js/palette.js';
const w = await gate();
if (w) {
  const frame = mountFrame({ page: 'index', title: '운영 현황', crumb: '배포 · 노드 · 결재', user: w });
  await mountOverview(frame, {});
  mountPalette(); ready();
}
