<meta charset="utf-8">

<script>/* 교차문서 전환 옵트인을 head 인라인에 두고(CSS 늦게 도착 시 opt-in disabled 방지) 전환 약속 거부를 삼킨다 — 레일 클릭 이동 pageerror 0 (F2-C must_fix) */
(function () { var h = function (e) { var vt = e.viewTransition; if (!vt) return; ['ready', 'finished', 'updateCallbackDone'].forEach(function (k) { if (vt[k] && vt[k].catch) vt[k].catch(function () {}); }); };
  addEventListener('pagereveal', h); addEventListener('pageswap', h); })();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LX/OPS — 기관·할당</title>
<link rel="stylesheet" href="../proto/fonts-system.css">

</head>
<body data-stage="ops" data-page="tenants">
<!-- 첫 페인트 골격(F2-C 3차): 모듈이 데이터를 받기 전에도 레일·마스트·판 머리가 선다(화면 이동 시 검정 판 0).
     직전 방문 스냅샷이 있으면 그 화면으로 덮고('직전 화면 hh:mm:ss · 수신 중' 꼬리표), 실데이터가 서면 boot.js unveil() 이 걷는다. -->
<div class="og-shell og-skel" id="ogSkel" aria-hidden="true" inert><aside class="og-rail"><a class="og-mark" href="./index.html">LX<b>/</b>OPS</a><nav class="og-nav"><a href="./index.html" data-page="index"><svg aria-hidden="true"><use href="../assets/icons.svg#i-map"/></svg>운영 현황</a><a href="./infra.html" data-page="infra"><svg aria-hidden="true"><use href="../assets/icons.svg#i-run"/></svg>인프라 관제</a><a href="./tenants.html" data-page="tenants" aria-current="page"><svg aria-hidden="true"><use href="../assets/icons.svg#i-user"/></svg>기관·할당</a><a href="./deploys.html" data-page="deploys"><svg aria-hidden="true"><use href="../assets/icons.svg#i-upload"/></svg>배포 제어</a><hr><a data-ext="" data-page="x"><svg aria-hidden="true"><use href="../assets/icons.svg#i-card"/></svg>카드 발행</a><a data-ext="" data-page="x"><svg aria-hidden="true"><use href="../assets/icons.svg#i-data"/></svg>데이터 관리</a><a data-ext="" data-page="x"><svg aria-hidden="true"><use href="../assets/icons.svg#i-settings"/></svg>서비스 관리</a><a data-ext="" data-page="x"><svg aria-hidden="true"><use href="../assets/icons.svg#i-user"/></svg>MY</a><hr><a data-ext="" data-page="xi"><svg aria-hidden="true"><use href="../assets/icons.svg#i-map"/></svg>XI맵</a><a data-ext="" data-page="global"><svg aria-hidden="true"><use href="../assets/icons.svg#i-map"/></svg>Global</a></nav></aside><header class="og-mast"><h1>기관·할당</h1><span class="og-crumb">쿼터 8차원 · LLM 계량 · 격리 · 결재</span><span class="og-spacer"></span><span class="og-src" data-kind="gateway"><i></i><span class="og-src-t">연결 중 · 게이트웨이</span></span><span class="og-clock" id="skClock"></span></header><main class="og-main"><div class="sk-grid" data-page="tenants"><section class="og-panel sk-panel" style="--i:0"><header><h2>기관</h2><span class="og-sub">6곳 · GPU 초/월</span><span class="og-right sk-wait">수신 중</span></header><div class="sk-scan"><i></i></div></section><section class="og-panel sk-panel" style="--i:1"><header><h2>쿼터 8차원</h2><span class="og-sub">GPU·s · 저장 · 면적 · 동시 · LLM</span><span class="og-right sk-wait">수신 중</span></header><div class="sk-scan"><i></i></div></section><section class="og-panel sk-panel" style="--i:2"><header><h2>사용량 추이</h2><span class="og-sub">usage_events</span><span class="og-right sk-wait">수신 중</span></header><div class="sk-scan"><i></i></div></section><section class="og-panel sk-panel" style="--i:3"><header><h2>결재</h2><span class="og-sub">2인 승인</span><span class="og-right sk-wait">수신 중</span></header><div class="sk-scan"><i></i></div></section></div></main></div>
<script>/* 스냅샷 복원 · 시계 · 안전 타이머(모듈 오류 시에도 8 s 뒤 걷힘) */(function(){try{var d=document,b=d.body,sk=d.getElementById("ogSkel"),pg=b.dataset.page;b.classList.add("has-skel");var c=d.getElementById("skClock");if(c)c.textContent=new Date().toLocaleTimeString("ko-KR",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit",timeZone:"Asia/Seoul"});var v=null;try{v=JSON.parse(localStorage.getItem("lxops:snap:"+pg)||"null")}catch(e){}if(v&&v.h&&Date.now()-v.t<1800000&&Math.abs(v.w-innerWidth)<2){sk.innerHTML=v.h;sk.dataset.snap="1";var m=sk.querySelector(".og-main");if(m)m.scrollTop=v.st||0;var tg=d.createElement("span");tg.className="og-snap-tag";tg.textContent="직전 화면 "+v.at+" · 수신 중";var ms=sk.querySelector(".og-mast .og-spacer");if(ms)ms.after(tg);}setTimeout(function(){var s=d.getElementById("ogSkel");if(s){s.remove();b.classList.remove("has-skel");}},8000);}catch(e){}})();</script>
<script type="module">
import { gate, ready, get, h, prov, setText, fmt, tag, hhmmss, ymd, SRC, t, gwRead } from './js/boot.js';
import { mountFrame } from './js/rail.js';
import { mountPalette } from './js/palette.js';
import { DIMS, quotaRing, quotaEditor, project, monthKey, llmDims } from './js/quota.js';
import { connect } from './js/telemetry.js';

const w = await gate();
if (w) {
  const frame = mountFrame({ page: 'tenants', title: '기관·할당', crumb: '쿼터 8차원 · LLM 계량 · 격리 · 결재', user: w });
  const [tenants, usage, approvals, deploys, jobs, llm] = await Promise.all([get('tenants'), get('opsTenants'), get('approvals'), get('deploys'), get('jobs'), SRC.kind === 'gateway' ? gwRead('llm') : null]);
  let brand = null, studio = null; try { brand = await import('../assets/data/brand.js'); studio = await import('../assets/data/studio.js'); } catch { /* 원본 데이터 읽기 실패 → 칸 결손 */ }
  const U = new Map((usage?.items || []).map((u) => [u.tenant_id, u]));
  // 링 7·8(LLM) — 게이트웨이 Usage 에 차원이 없으면 정본 usage_events(llm_tokens) 계량을 읽기만 해서 붙인다(없으면 결손)
  for (const u of U.values()) llmDims(u, (llm?.items || []).find((x) => x.tenant_id === u.tenant_id), llm?.as_of || new Date().toISOString(), llm?.source || '계량 경로 없음(브리지 · off)');
  const T = tenants?.items || [];
  const G = h('div', { class: 'tn' }); frame.main.append(G);
  const q0 = new URLSearchParams(location.search).get('tenant') || new URLSearchParams(location.search).get('t');   // v1.1-29 ?tenant= (구 ?t= 호환)
  let sel = T.find((x) => x.id === q0)?.id || 'lx'; let selDim = 'gpu_s_month';

  // ── 좌: 기관 6
  const list = h('div', { role: 'listbox', 'aria-label': '기관' });
  G.append(h('section', { class: 'og-panel tn-list' }, h('header', {}, h('h2', {}, '기관'), h('span', { class: 'og-sub' }, `${T.length}곳 · GPU 초/월`), usage?._fallback ? h('span', { class: 'og-right' }, tag('demo', '픽스처')) : null), list));
  const bars = new Map();
  const barScale = (u) => { const q = u.dims.gpu_s_month; const pj = project('gpu_s_month', q.used.value) || 0; return q.hard ?? Math.max(1000, pj * 1.25); };
  for (const x of T) {
    const u = U.get(x.id); const q = u?.dims?.gpu_s_month;
    const num = h('span', { class: 'og-num-s', 'data-k': 'gpu' }); const bar = h('div', { class: 'og-bar' }, h('i'));
    const item = h('button', { class: 'tn-item', role: 'option', 'aria-selected': x.id === sel ? 'true' : 'false', 'data-t': x.id, type: 'button', onclick: () => pick(x.id) },
      h('b', {}, x.name?.ko || x.id), h('span', { class: 'og-tag', 'data-dashed': x.scope === 'global' ? '' : null }, x.scope === 'global' ? '해외' : '국내'),
      h('span', { class: 'og-num-s' }, x.id + (x.id === 'lx-demo' ? ' · 시연 계량' : '')), num, bar);
    list.append(item); bars.set(x.id, { item, num, bar, scale: u ? barScale(u) : 1 });
  }
  const drawBar = (id) => {
    const b = bars.get(id); const u = U.get(id); if (!b || !u) return; const q = u.dims.gpu_s_month; const v = q.used.value ?? 0;
    setText(b.num, `${fmt(v, Number.isInteger(v) ? 0 : 1)} / ${q.hard == null ? '무제한' : fmt(q.hard)} gpu_s`);
    b.bar.querySelector('i').style.width = Math.min(100, v / b.scale * 100) + '%'; b.bar.dataset.caution = q.hard != null && v / q.hard > 0.8 ? '1' : '0';
    b.item.title = `${q.used.source}${q.used.note ? ' · ' + q.used.note : ''}${q.hard == null ? ' · 막대 기준 = 월말 예측×1.25 [추정]' : ''}`;
  };
  T.forEach((x) => drawBar(x.id));

  // ── 우: 머리(격리 · CI) · 링 6 · 편집
  const headBox = h('div', { class: 'tn-head' }); const ringsBox = h('div', { class: 'tn-rings' }); const edHost = h('div', {});
  const provBox = h('div', { class: 'og-body', style: { paddingTop: '8px', paddingBottom: '12px' } });
  const main = h('div', { class: 'tn-main' }); G.append(main);
  main.append(h('section', { class: 'og-panel' }, headBox, ringsBox, provBox, edHost));
  const rings = new Map(); for (const d of DIMS) rings.set(d, quotaRing(ringsBox, d, { size: 100, onPick: (dim) => pickDim(dim) }));
  const ed = quotaEditor(edHost, {
    onDraft: (tid, dim, draft) => { if (tid === sel) rings.get(dim).draw(U.get(tid).dims[dim], draft); },
    onSaved: async (tid, dim, r) => {
      const fresh = r?.usage || (await get('opsTenants')).items?.find((u) => u.tenant_id === tid);
      if (fresh) U.set(tid, fresh);
      rings.get(dim).draw(U.get(tid).dims[dim], null, { rescale: false }); drawBar(tid); loadApprovals(true);
    },
  });
  const low = h('div', { class: 'tn-low' }); main.append(low);
  const apBody = h('div', { class: 'og-body', style: { paddingTop: '4px' } });
  const quoteBody = h('div', { class: 'og-body' }); const rqBody = h('div', { class: 'og-body', style: { paddingTop: '4px' } });
  low.append(h('section', { class: 'og-panel' }, h('header', {}, h('h2', {}, '결재 · 쿼터'), h('span', { class: 'og-sub' }, "approvals subject_type='quota'")), apBody),
    h('section', { class: 'og-panel' }, h('header', {}, h('h2', {}, '견적 대비 실측'), h('span', { class: 'og-sub' }, 'job gpu_s 봉투 vs quote')), quoteBody),
    h('section', { class: 'og-panel' }, h('header', {}, h('h2', {}, '화면 요구'), h('span', { class: 'og-sub' }, 'studio.js REQUESTS'), h('span', { class: 'og-right' }, tag('history'))), rqBody));

  function pick(id) {
    sel = id; for (const [k, b] of bars) b.item.setAttribute('aria-selected', k === id ? 'true' : 'false');
    history.replaceState(null, '', '?tenant=' + id);
    const x = T.find((y) => y.id === id); const u = U.get(id);
    const iso = u?.isolation || {};
    const theme = brand ? (brand.THEMES[id] || (x?.scope === 'global' ? brand.THEMES.kuksan : brand.THEMES.lx)) : null;
    headBox.replaceChildren(h('h2', {}, x?.name?.ko || id), h('span', { class: 'og-num-s' }, `${id} · ${x?.crs || ''} · ${x?.locale || ''}`),
      h('div', { class: 'tn-iso', 'aria-label': '데이터 격리' },
        h('span', { class: 'og-tag' }, 'prefix', h('b', {}, iso.prefix || `tenants/${id}/`)), h('span', { class: 'og-tag' }, 'RLS', h('b', {}, iso.rls ? 'ON' : 'OFF')),
        h('span', { class: 'og-tag' }, '서명 타일', h('b', {}, iso.signed_tiles ? 'ON' : '공용')), h('span', { class: 'og-tag' }, '원본 라우트', h('b', {}, String(iso.raw_routes ?? 0)))),
      theme ? h('div', { class: 'tn-ci', title: `포털 CI 미리보기 · brand.js THEMES.${brand.THEMES[id] ? id : (x?.scope === 'global' ? 'kuksan' : 'lx')}` },
        h('span', { class: 'og-lbl' }, '포털 CI'), h('span', { class: 'ci-mark', style: { background: theme.accent } }, theme.mark), h('span', { class: 'og-num-s' }, theme.platform || theme.name)) : null);
    for (const d of DIMS) rings.get(d).draw(u?.dims?.[d], null, { rescale: true });
    const g = u?.dims?.gpu_s_month?.used; provBox.replaceChildren(g ? prov(g) : h('span', { class: 'og-why' }, '사용량 없음'), h('span', { class: 'og-note', style: { marginLeft: '12px' } }, '링: 채움 = 사용(실측) · 옅은 채움 = 여유 · 눈금 = soft/hard/주의 80% · 점선 = 월말 예측 [추정]'));
    pickDim(selDim, true); renderLow();
  }
  function pickDim(dim, quiet) {
    selDim = dim; for (const [k, r] of rings) r.press(k === dim);
    const u = U.get(sel); if (u) ed.open(sel, dim, u.dims[dim]);
    if (!quiet) rings.get(dim).el.focus({ preventScroll: true });
  }
  let apItems = approvals?.items || [];
  async function loadApprovals(fetchNew) {
    if (fetchNew && SRC.kind === 'bridge') { const j = await get('approvals'); const before = new Set(apItems.map((a) => a.id)); apItems = j.items || []; renderAp(before); }
    else renderAp(new Set(apItems.map((a) => a.id)));
  }
  function renderAp(before) {
    const qa = apItems.filter((a) => a.subject_type === 'quota');
    if (!qa.length) { apBody.replaceChildren(...[h('div', { class: 'og-note' }, '쿼터 결재 0 · 신청은 포털 MY "디스크 증량 신청"(2차)에서 들어온다'), approvals?._fallback ? h('div', { class: 'og-why', style: { marginTop: '6px' } }, '결재 목록 = 브리지 경로(계약 변경 요청 §4.10)') : null].filter(Boolean)); return; }
    const tb = h('table', { class: 'og-table' }, h('thead', {}, h('tr', {}, h('th', {}, '시각'), h('th', {}, '기관'), h('th', {}, '결정'), h('th', {}, '사유'))));
    const body = h('tbody'); for (const a of qa.slice().reverse().slice(0, 6)) body.append(h('tr', { class: before.has(a.id) ? '' : 'is-new' }, h('td', { class: 'n' }, hhmmss(a.at)), h('td', {}, a.subject_id), h('td', {}, a.decision === 'approve' ? '승인' : a.decision || '대기'), h('td', {}, a.reason || '')));
    tb.append(body); apBody.replaceChildren(tb);
  }
  function renderLow() {
    const js = (jobs?.items || []).filter((j) => j.tenant_id === sel);
    const withQuote = js.filter((j) => j.quote_gpu_s?.value != null);
    quoteBody.replaceChildren(
      h('div', { class: 'pn-row' }, h('span', { class: 'og-kpi' }, withQuote.length ? '' : '—'), h('span', { class: 'og-lbl' }, withQuote.length ? '' : '±% 산출 불가')),
      h('div', { class: 'og-note' }, `이 기관 job ${js.length}건 · 견적 gpu_s 가 있는 job ${withQuote.length}건. 견적은 models.perf(bench) 뒤에 채워진다 — 지금 bench 실측은 aerial25/best ≈26 칩/s/GPU 1건뿐.`),
      h('div', { class: 'og-note', style: { marginTop: '6px' } }, `이번 달 실측 ${fmt(U.get(sel)?.dims?.gpu_s_month?.used)} gpu_s · 월말 예측 ${fmt(Math.round(project('gpu_s_month', U.get(sel)?.dims?.gpu_s_month?.used?.value) || 0))} [추정]`));
    const deps = new Set((deploys?.items || []).filter((d) => d.tenant_id === sel).map((d) => d.id));
    const rq = (studio?.REQUESTS || []).filter((r) => deps.has(r.deployId));
    rqBody.replaceChildren(...(rq.length ? rq.map((r) => h('div', { class: 'rq' }, h('span', { class: 'og-num-s' }, ymd(r.got)), h('span', { class: 'og-note', style: { color: 'var(--cw-sub)' } }, `${r.want} — ${r.from}`), h('span', { class: 'og-tag', 'data-basis': 'history' }, r.state))) : [h('div', { class: 'og-note' }, sel === 'lx' ? 'LX 는 요구를 받는 쪽 — 기관 요구는 기관 행에서' : '접수된 화면 요구 0')]));
  }
  pick(sel); renderAp(new Set(apItems.map((a) => a.id)));

  // ── usage.delta → 막대·링이 따라온다(값이 바뀔 때만)
  connect({
    onGpu: () => frame.tick(false),
    onUsage: (d) => {
      const dim = d.dim === 'llm_tokens' ? 'llm_tokens_month' : d.dim;   // F2-E 계량 이벤트 이름 → 링 차원
      const u = U.get(d.tenant_id); if (!u || !u.dims[dim]) return;
      const e = u.dims[dim].used; e.value = +((e.value || 0) + (Number(d.amount) || 0)).toFixed(2); e.as_of = d.at || e.as_of;
      if (d.dim === 'llm_tokens' && u.dims.llm_runs_day?.used && d.job_id && !(u._runs || (u._runs = new Set())).has(d.job_id)) { u._runs.add(d.job_id); const r = u.dims.llm_runs_day.used; r.value = (r.value || 0) + 1; if (d.tenant_id === sel) rings.get('llm_runs_day').draw(u.dims.llm_runs_day); }
      drawBar(d.tenant_id); if (d.tenant_id === sel) { rings.get(dim).draw(u.dims[dim]); renderLow(); }
    },
    onState: (st, age) => { if (st === 'stale') frame.tick(true, age / 1000); },
  });
  mountPalette(); ready();
}
</script>
</body>
