    if (pw) { const now = pw.heavy_now?.value; setText(qPow, `전력 예산 · 고부하 GPU ${now == null ? '—' : now}/${pw.heavy_max} · 배정 ${pw.booked}/${pw.heavy_max}`); qPow.dataset.level = now != null && now > pw.heavy_max ? 'caution' : 'ok'; }
    else if (!qPow.dataset.fromGpu) setText(qPow, '전력 예산 · GPU 표본 대기');
  };
  drawQueue(queues);
  const syncPow = (s) => { const pb = s?.power_budget; if (!pb || queues?.power) return; qPow.dataset.fromGpu = '1'; setText(qPow, `전력 예산 · 고부하 GPU ${pb.hot_now?.value ?? '—'}/${pb.max_hot} · 임대 ${pb.leases_n}/${pb.max_hot}`); qPow.title = pbTitle(pb, s); qPow.dataset.level = (pb.hot_now?.value ?? 0) > pb.max_hot ? 'caution' : (pb.hot_now?.value ?? 0) > 0 ? 'hot' : 'ok'; };

  // ── 스토리지
  const stBody = h('div', { class: 'og-body' });
  G.append(h('section', { class: 'og-panel inf-store' }, h('header', {}, h('h2', {}, '스토리지'), h('span', { class: 'og-sub' }, 'statfs · du 60s'), h('span', { class: 'og-right', 'data-k': 'st-at' })), stBody));
  const drawStorage = (st) => {
    if (!st?.volumes) { stBody.replaceChildren(h('div', { class: 'cw-void' }, '스토리지 폴러 첫 수집 전 — 60s 주기')); return; }
    const rings = h('div', { class: 'st-rings' });
    for (const v of st.volumes) {
      const c = h('div', { class: 'st-ring' }); const r = ring(c, { size: 96, stroke: 6, label: `${v.mount} 사용` });
      const tot = v.total_gb.value || 1, free = v.free_gb.value ?? 0, used = tot - free;
      r.set({ segs: [{ id: 'u', kind: 'value', from: 0, to: used / tot }], ticks: [{ kind: 'caution', at: 0.8 }] }).state({ caution: used / tot > 0.8 });
      r.center.append(h('b', {}, v.mount), h('span', {}, `${Math.round(used / tot * 100)}%`));
      c.append(h('span', { class: 'og-num-s', style: { color: used / tot > 0.8 ? 'var(--cw-caution)' : '' } }, `${fmt(v.free_gb)} GB 여유`), h('span', { class: 'og-lbl' }, `총 ${fmt(v.total_gb)} GB`));
      rings.append(c);
    }
    const tier = h('div', { class: 'st-tier' });
    for (const [k, lbl] of [['raw', '원본'], ['tile', '타일'], ['result', '결과']]) {
      const e = st.by_tier?.[k]; if (!e) continue;
      tier.append(h('span', { class: 'og-lbl' }, lbl), e.value == null ? h('span', { class: 'og-why' }, e.note || '없음') : h('div', { class: 'og-bar' }, h('i', { 'data-kind': k === 'result' ? 'ai' : '', style: { width: Math.min(100, (e.value / Math.max(e.value, st.by_tier.tile?.value || 1)) * 100) + '%' } })), h('span', { class: 'og-num-s' }, e.value == null ? '—' : `${fmt(e.value, 2)} GB`));
    }
    const ten = h('div', { class: 'og-note', style: { marginTop: '10px' } }, '기관별 · ', ...Object.entries(st.by_tenant || {}).map(([k, e], i) => `${i ? ' · ' : ''}${k} ${fmt(e, 2)} GB`));
    stBody.replaceChildren(rings, tier, ten, h('div', { style: { marginTop: '8px' } }, prov(st.volumes[0].free_gb, { short: true })));
  };
  drawStorage(storage);

  // ── 모델 배치 매트릭스(영상 모델 × GPU + LLM 백엔드 행 · 토큰/초 스파크라인 24px)
  const mdBody = h('div', { class: 'og-body', style: { paddingTop: '4px' } });
  G.append(h('section', { class: 'og-panel inf-models' }, h('header', {}, h('h2', {}, '모델 배치'), h('span', { class: 'og-sub' }, '영상 모델 × GPU · LLM(vLLM · Ollama) · VRAM · 처리량'), h('span', { class: 'og-right' }, tag('measured', 'bench · /metrics 실측'))), mdBody));
  const benchOf = (id) => (bench?.items || []).find((b) => b.model_id === id);
  const llmTb = h('tbody', { 'data-k': 'llm-rows' });
  const llmSparks = new Map();
  const drawModels = (ms) => {
    const tb = h('table', { class: 'mdl-mx' }, h('thead', {}, h('tr', {}, h('th', {}, '모델'), h('th', {}, 'a6000-0'), h('th', {}, 'a6000-1'), h('th', {}, 'VRAM'), h('th', {}, '처리량'), h('th', {}, '상주'))));
    const body = h('tbody');
    for (const m of ms?.items || []) {
      const b = benchOf(m.model_id) || null; const cps = b?.chips_per_s || m.perf?.chips_per_s || null;
      const pinBtn = h('button', { class: 'og-btn is-s', type: 'button' }, m.pinned ? '해제' : '고정');
      pinBtn.addEventListener('click', async () => {
        try { const r = await write(`/ops/models/${encodeURIComponent(m.model_id)}/${m.pinned ? 'unload' : 'load'}`, 'POST', { worker: 'a6000-0' }); m.pinned = !m.pinned; drawModels(ms); toast(`<b>${m.pinned ? '상주 고정' : '해제'}</b> · ${m.model_id}${r?.note ? ' · ' + r.note : ''}`); }
        catch (e) { toast(`<b>실패</b> · ${errText(e)}`, 'err'); }
      });
      guardWrite(pinBtn);
      body.append(h('tr', {}, h('td', { style: { color: 'var(--cw-ink)' } }, m.model_id),
        h('td', { class: 'c' }, h('span', { class: 'res', 'data-on': m.resident_on?.includes('a6000-0') ? '1' : '0', 'data-pin': m.pinned && (m.pin_worker || 'a6000-0') === 'a6000-0' ? '1' : '0', title: m.resident_on?.includes('a6000-0') ? '상주' : '미상주' })),
        h('td', { class: 'c' }, h('span', { class: 'res', 'data-on': m.resident_on?.includes('a6000-1') ? '1' : '0', title: m.resident_on?.includes('a6000-1') ? '상주' : '미상주' })),
        h('td', {}, m.vram_mib?.value == null ? h('span', { class: 'og-why', title: m.vram_mib?.note }, m.vram_mib?.note || '—') : h('span', { class: 'og-num-s' }, `${fmt(m.vram_mib)} MiB`)),
        h('td', {}, cps && cps.value != null ? h('span', { title: `${cps.source} · ${cps.note || ''}` }, h('b', { class: 'og-num' }, `≈${fmt(cps)} 칩/s/GPU`), ' ', tag(cps.basis)) : h('span', { class: 'og-why' }, 'bench 전')),
        h('td', {}, pinBtn, m.pin_note ? h('span', { class: 'og-why', style: { marginLeft: '6px' } }, m.pin_note) : null)));
    }
    tb.append(body, llmTb); mdBody.replaceChildren(...[tb, h('div', { class: 'og-note', style: { marginTop: '8px' } }, 'LLM 행: vLLM 은 WSL2 컨테이너라 프로세스별 VRAM 을 Windows 가 보지 못한다(표시 안 함) · 컨테이너 제어 0(읽기만) · Ollama 는 종료 금지 — 자기 보고 VRAM.'),
      SRC.writable ? null : h('div', { class: 'og-why', style: { marginTop: '8px' } }, `고정/해제 · ${SRC.why}`)].filter(Boolean));
  };
  function drawLlmRows(s) {
    const byGpu = []; for (const g of s.gpus || []) for (const p of g.external || []) if (p.llm) byGpu.push([g.index, p.llm]);
    for (const [gi, l] of byGpu) {
      let r = llmTb.querySelector(`[data-model="${l.model}"]`);
      if (!r) {
        const spH = h('span', { class: 'llm-sp' }); const sp = spark(spH, { width: 96, height: 24, max: 50, label: `${l.model} 토큰/초` }); llmSparks.set(l.model, sp);
        r = h('tr', { 'data-model': l.model, class: 'llm-row' }, h('td', { style: { color: 'var(--cw-ink)' } }, `${l.model} · vllm${l.endpoint ? ' ' + l.endpoint : ''}`, h('div', { class: 'og-num-s' }, l.role || '')),
          h('td', { class: 'c' }, h('span', { class: 'res', 'data-on': gi === 0 ? '1' : '0', 'data-llm': '1' })), h('td', { class: 'c' }, h('span', { class: 'res', 'data-on': gi === 1 ? '1' : '0', 'data-llm': '1' })),
          h('td', {}, h('span', { class: 'og-why', title: l.note }, 'WSL 미노출')), h('td', { 'data-k': 'tps' }, h('b', { class: 'og-num' }, '—'), ' ', spH, h('span', { class: 'og-num-s', 'data-k': 'req' })),
          h('td', {}, h('span', { class: 'og-tag', 'data-dashed': '' }, `GPU${gi} · 컨테이너`)));
        llmTb.append(r);
      }
      const b = r.querySelector('[data-k="tps"] b'); if (setText(b, l.tps?.value == null ? '— tok/s' : `${fmt(l.tps, 1)} tok/s`)) b.title = `${l.tps?.source} · ${l.tps?.note}`;
      setText(r.querySelector('[data-k="req"]'), ` 요청 ${l.reqs_active ?? '—'} · KV ${l.kv_cache_pct?.value ?? '—'}%`);
      llmSparks.get(l.model)?.draw(llmHist.get(l.model) || []);
    }
    const ol = s.llm_ollama;
    if (ol?.models?.length) {
      let r = llmTb.querySelector('[data-model="ollama"]');
      const sum = ol.models.reduce((a, m) => a + (m.size_vram_mib?.value || 0), 0);
      if (!r) { r = h('tr', { 'data-model': 'ollama', class: 'llm-row' }, h('td', { style: { color: 'var(--cw-ink)' } }, 'Ollama(llama-server)', h('div', { class: 'og-num-s', 'data-k': 'names' })), h('td', { class: 'c' }, h('span', { class: 'res', 'data-on': '1', 'data-llm': '1' })), h('td', { class: 'c' }, h('span', { class: 'res', 'data-on': '1', 'data-llm': '1' })), h('td', { 'data-k': 'vram' }), h('td', {}, h('span', { class: 'og-why' }, '/metrics 없음')), h('td', {}, h('span', { class: 'og-tag', 'data-dashed': '' }, '종료 금지'))); llmTb.append(r); }
      setText(r.querySelector('[data-k="names"]'), ol.models.map((m) => m.name).join(' · '));
      const v = r.querySelector('[data-k="vram"]'); setText(v, `${fmt(sum)} MiB`); v.title = 'Ollama /api/ps size_vram 자기 보고(두 장 분할 합) · 실측';
    }
  }
  drawModels(models);

  // ── 용량 계획 [추정]
  const capBody = h('div', { class: 'og-body' });
  G.append(h('section', { class: 'og-panel og-dash inf-cap' }, h('header', {}, h('h2', {}, '용량 계획'), h('span', { class: 'og-sub' }, 'infra.js capacityPlan()'), h('span', { class: 'og-right' }, tag('estimate', '추정'))), capBody));
  try {
    const inf = await import('../assets/data/infra.js');
    const plan = inf.capacityPlan(); const gpuN = (gpus?.gpus || []).length || 2;
    const capGpu = gpuN * 24 * 300;
    const rows = plan.rows.map((r) => r.id === 'gpu' ? { ...r, cap: capGpu, pct: Math.round(r.use / capGpu * 100), afterPct: Math.round(r.after / capGpu * 100), note: `GPU ${gpuN}장(nodes 합계 · infra.js gpuCards ${inf.CAPACITY.gpuCards} 아님) × 24h × 300일` } : r);
    capBody.append(...rows.map((r) => h('div', { class: 'cap-row' }, h('span', { class: 'og-lbl' }, r.name), h('div', { class: 'og-bar', 'data-caution': r.afterPct >= 80 ? '1' : '0', title: r.note }, h('i', { style: { width: Math.min(100, r.afterPct) + '%' } }), h('em', { style: { left: '80%' } })), h('span', { class: 'og-num-s', style: { color: r.afterPct >= 80 ? 'var(--cw-caution)' : '' } }, `${r.afterPct}%`))),
      h('div', { class: 'og-note', style: { marginTop: '10px' } }, '점선 = 예정 사업 포함 소요 ÷ 보유. 눈금 80% ', goal(), '. 계수 RATES 는 견적용 — bench·계량 실측으로 보정 전.'),
      h('div', { class: 'og-note' }, `GPU 보유 교정: 등록 노드 합계 ${gpuN}장 · A100 노드 2 는 등록 대기(미포함).`));
  } catch (e) { capBody.append(h('div', { class: 'cw-void' }, 'infra.js 읽기 실패 — ' + errText(e))); }

  // ── 첫 그림 · 텔레메트리
  if (gpus?.gpus) { drawGpu(gpus, null, new Map()); syncPow(gpus); }
  else for (const x of R.values()) { x.rg.state({ void: true }); setText(x.util, '—'); x.provBox.replaceChildren(h('div', { class: 'og-why' }, '폴러 미기동 — 수신 없음')); }
  frame.setMeta('nodes', String((nodes?.items || []).filter((n) => n.state !== 'pending').length)); frame.setMeta('gpus', String(gpus?.gpus?.length ?? 2));
  const running = new Set((jobs?.items || []).filter((j) => j.state === 'running').map((j) => j.id));
  // ops 스트림의 job.state 는 게이트웨이 밖(다른 에픽 pytest · e2e 주입)에서도 온다 — 없는 id 를 GET /jobs/{id} 로 두드리면 404 가 콘솔에 남는다(판정: 간헐 404 1건).
  // 그래서 이벤트로 알게 된 작업은 목록(GET /jobs?state=…  · 늘 200)에서 찾는다. 딥링크(?job=)만 단건 GET(없으면 칩으로 알린다).
  const findJob = async (id, state) => { const l = await api(`/jobs?${state ? 'state=' + state + '&' : ''}limit=100`); return (l?.items || []).find((x) => x.id === id) || null; };
  connect({
    onGpu: (s, changed, hist) => { drawGpu(s, changed, hist); syncPow(s); ln.tick(); frame.tick(false); for (const x of R.values()) { x.row.dataset.stale = '0'; x.rg.el.dataset.stale = '0'; x.rg.el.dataset.void = '0'; } },
    onQueue: (q) => drawQueue(q),
    onAlert: (a) => strip.event(a),
    onUsage: (d) => drawUsage(d),
    onRecovered: (ev) => { qr.recovered(ev); recs.set(ev.job_id, { job_id: ev.job_id, mode: ev.mode || 'resumed', shards_done: ev.shards_done, shards_total: ev.shards_total }); drawRec(); },
    onJob: async (ev) => {
      qr.event(ev);
      if (ev.state === 'running' && !running.has(ev.job_id)) {
        running.add(ev.job_id);
        let workers = []; try { const jj = SRC.kind !== 'off' ? await findJob(ev.job_id) : null; if (jj) { workers = jj.workers || []; qr.patch(ev.job_id, jj); } } catch { /* */ }
        // 워커 배정 전(첫 shard 전)이면 a6000 풀의 첫 워커로 먼저 세우고, 1s 간격으로 /jobs 를 다시 읽어 실제 워커로 바로잡는다(최대 6회)
        // GPU 카드에는 a6000 풀 · a6000-* 워커만(cpu-0/cpu-1 의 접미 숫자를 GPU 0/1 로 읽지 않는다 — F2-C must_fix)
        const place = (ws) => { const pool = qr.jobs.get(ev.job_id)?.pool || ev.pool; const gw = ws.filter((w) => /^a6000-\d+$/.test(String(w)));
          const idx = (pool && pool !== 'a6000' ? [] : gw.length ? gw : ws.length ? [] : ['a6000-0']).map((w) => Number(String(w).split('-').pop())).filter((i) => R.has(i));
          for (const [i, m] of runOn) if (m.has(ev.job_id) && !idx.includes(i)) { m.delete(ev.job_id); drawJobCard(i); }
          for (const i of idx) { if (!runOn.has(i)) runOn.set(i, new Map()); runOn.get(i).set(ev.job_id, qr.jobs.get(ev.job_id)?.model_id || ev.model_id || ''); drawJobCard(i); } return idx; };
        const idx = place(workers);
        if (!workers.length && SRC.kind !== 'off') (async () => { for (let k = 0; k < 6 && running.has(ev.job_id); k++) { await new Promise((r) => setTimeout(r, 1000)); try { const jj = await findJob(ev.job_id); if (jj?.workers?.length) { qr.patch(ev.job_id, jj); place(jj.workers); break; } } catch { break; } } })();
        requestAnimationFrame(() => leader(qr.row(ev.job_id), idx.map((i) => R.get(i).row)));
      }
      if (['done', 'cancelled', 'failed'].includes(ev.state)) { running.delete(ev.job_id); endedJobs.add(ev.job_id); for (const [i, m] of runOn) if (m.delete(ev.job_id) || R.get(i)?.pollJob === ev.job_id) { const x = R.get(i); if (x && x.pollJob === ev.job_id) x.pollJob = null; drawJobCard(i); } try { const jj = SRC.kind !== 'off' ? await findJob(ev.job_id) : null; if (jj) qr.patch(ev.job_id, jj); } catch { /* */ } }
    },
    onState: (st, age) => {
      if (st === 'stale') { frame.tick(true, age / 1000); for (const x of R.values()) { x.row.dataset.stale = '1'; x.rg.el.dataset.stale = '1'; } }
    },
  });
  // shard 진행(행의 a/b) — 실행 중일 때 2s 마다 GET /jobs 로 맞춘다(값이 바뀔 때만 행이 다시 그려진다)
  if (SRC.kind !== 'off') setInterval(async () => { if (!running.size) return; const j = await get('jobs'); for (const x of j.items || []) if (qr.jobs.has(x.id) && !jobSse.has(x.id)) qr.patch(x.id, x); }, 2000);
  if (SRC.kind !== 'off') setInterval(async () => { drawStorage(await get('storage')); }, 60000);
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView({ block: 'center' });
  mountPalette(); ready();
}
