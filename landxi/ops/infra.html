</head>
<body data-stage="ops">
<script type="module">
import { gate, ready, get, h, prov, setText, fmt, tag, goal, hhmmss, SRC, write, guardWrite, toast, errText } from '/landxi/ops/js/boot.js';
import { mountFrame } from '/landxi/ops/js/rail.js';
import { mountPalette } from '/landxi/ops/js/palette.js';
import { ring } from '/landxi/ops/js/rings.js';
import { spark } from '/landxi/ops/js/sparkline.js';
import { swimlanes, queueRows, leader } from '/landxi/ops/js/lanes.js';
import { alertStrip } from '/landxi/ops/js/alerts.js';
import { connect, STALE_MS } from '/landxi/ops/js/telemetry.js';
import { panel } from '/landxi/ops/js/deploy-map.js';

const CAUTION = { temp: 68, vram: 0.76 };   // 임계 80% 규칙: 85°C×.8 · 95%×.8 — 전부 [목표]
const w = await gate();
if (w) {
  const frame = mountFrame({ page: 'infra', title: '인프라 관제', crumb: 'GPU · 대기열 · 모델 배치 · 스토리지', user: w });
  const [nodes, gpus, queues, storage, alerts, models, bench, jobs] = await Promise.all([get('nodes'), get('gpus'), get('queues'), get('storage'), get('alerts'), get('models'), get('bench'), get('jobs')]);
  const G = h('div', { class: 'inf' }); frame.main.append(G);

  // ── 경보 스트립
  const alHost = h('div', { class: 'inf-alerts' }); G.append(alHost); const strip = alertStrip(alHost); strip.load(alerts);

  // ── 노드 카드
  const n0 = (nodes?.items || []).find((n) => n.state !== 'pending') || { id: 'node-tr3995wx' };
  const lastSeen = h('span', { class: 'og-num', 'data-k': 'last-seen' }, hhmmss(n0.last_seen));
  const head = h('div', { class: 'nd-head' },
    h('div', {}, h('div', { class: 'og-lbl' }, '노드'), h('div', { class: 'og-num', id: n0.id }, n0.id)),
    h('div', {}, h('div', { class: 'og-lbl' }, 'CPU'), h('div', { class: 'og-num' }, n0.cpu || '—')),
    h('div', {}, h('div', { class: 'og-lbl' }, 'RAM'), h('div', { class: 'og-num' }, n0.ram_gb ? `${fmt(n0.ram_gb)} GB` : '—')),
    h('div', {}, h('div', { class: 'og-lbl' }, '풀 · 드라이버'), h('div', { class: 'og-num', 'data-k': 'drv' }, `a6000 · ${gpus?.gpus?.[0]?.driver || '—'} ${gpus?.gpus?.[0]?.mode || ''}`)),
    h('div', { class: 'og-right' }, h('span', { class: 'og-lbl' }, '마지막 수신 '), lastSeen));
  const rowsBox = h('div', {});
  G.append(h('section', { class: 'og-panel inf-node' }, h('header', {}, h('h2', {}, 'GPU 노드'), h('span', { class: 'og-sub' }, 'nvidia-smi 2s · 값이 바뀔 때만 현상'), h('span', { class: 'og-right' }, tag(SRC.kind === 'off' ? 'demo' : 'measured'))), head, rowsBox));
  const R = new Map();
  // 외부 프로세스: 이름 ×n (+ PDH 가 준 프로세스별 전용 메모리 합). 64 MiB 미만(System 등)은 한 줄에서 빼고 툴팁에만.
  const extNames = (gs, full = false) => { const all = gs.flatMap((g) => g.external || []).filter((p) => full || p.mem_mib == null || p.mem_mib >= 64); const by = {};
    for (const p of all) { const b = by[p.name] || (by[p.name] = { n: 0, mib: null }); b.n++; if (p.mem_mib != null) b.mib = (b.mib || 0) + p.mem_mib; }
    return Object.entries(by).map(([k, v]) => `${k} ×${v.n}${full && v.mib != null ? ' ' + fmt(v.mib) + ' MiB' : ''}`).join(' · '); };
  const perProc = (g) => ((g.external || []).some((p) => p.mem_mib != null) ? '프로세스별 VRAM = Windows 커널 집계(PDH · 커밋 기준 — 합이 어댑터 사용량과 다를 수 있음)' : '프로세스별 VRAM N/A(WDDM)');
  for (const g of gpus?.gpus || [{ index: 0 }, { index: 1 }]) {
    const row = h('div', { class: 'gpu-row', 'data-gpu': g.index });
    const ringHost = h('div', { class: 'g-ringc' }); const rg = ring(ringHost, { size: 132, stroke: 6, label: `GPU ${g.index} VRAM` });
    rg.center.append(h('b', { 'data-k': 'vpct' }, '—'), h('span', { 'data-k': 'vmib' }, '—'), h('span', { 'data-k': 'vtot' }, '—'));
    const util = h('span', { class: 'og-kpi', 'data-k': 'util' }, '—');
    const spHost = h('div', {}); const sp = spark(spHost, { width: 340, height: 24, max: 100, label: `GPU ${g.index} 사용률 60s` });
    const ext = h('div', { class: 'g-ext', 'data-k': 'ext' }, h('i'), h('span', {}, '외부 점유 —'));
    const budget = h('div', { class: 'og-num-s', 'data-k': 'budget' }, '—');
    const job = h('div', { class: 'g-job', 'data-k': 'job' }, '현재 job 없음');

      h('div', { class: 'g-stat' }, h('div', { class: 'og-lbl' }, '온도'), temp, h('div', { class: 'og-lbl', style: { marginTop: '4px' } }, '주의 68°C ', goal())),
      h('div', { class: 'g-stat' }, h('div', { class: 'og-lbl' }, '전력'), pw, provBox));
    rowsBox.append(row); R.set(g.index, { row, rg, util, sp, ext, budget, job, temp, pw, provBox });
  }
  const drawGpu = (s, changed, hist) => {
    const names = extNames(s.gpus || []);
    for (const g of s.gpus || []) {
      const x = R.get(g.index); if (!x) continue; const ch = changed?.get(g.index);
      const tot = g.mem_total_mib.value || 1, used = g.mem_used_mib.value ?? 0, extMib = g.external_used_mib?.value ?? used; const wk = Math.max(0, used - extMib);
      const extTitle = `외부 점유 ${fmt(extMib)} MiB · ${(g.external || []).length ? extNames([g], true) : (names || '프로세스 이름 미보고') + '(노드 전체)'} · ${perProc(g)} · 사용량 출처 ${g.mem_used_mib.source || ''}${g.mem_used_mib.note ? ' · ' + g.mem_used_mib.note : ''}`;
      if (!ch || ch.has('mem_used_mib') || ch.has('external_used_mib') || ch.has('mem_total_mib') || ch.has('external')) {
        x.rg.set({ segs: [{ id: 'ext', kind: 'ext', from: 0, to: extMib / tot, title: extTitle }, { id: 'wk', kind: 'ai', from: extMib / tot, to: used / tot, title: `워커 ${fmt(wk)} MiB` }],
          ticks: [{ kind: 'caution', at: CAUTION.vram }, { kind: 'hard', at: 0.95 }] }).state({ caution: used / tot > CAUTION.vram, fault: used / tot > 0.95 });

        setText(x.rg.center.querySelector('[data-k="vmib"]'), `${fmt(used)} MiB`); setText(x.rg.center.querySelector('[data-k="vtot"]'), `/ ${fmt(tot)}`);
        x.ext.title = extTitle; setText(x.ext.querySelector('span'), `외부 점유 ${fmt(extMib)} MiB · ${(g.external || []).length ? extNames([g]) : (names ? names + ' (노드)' : '이름 미보고')} · WDDM`);
        const bud = Math.max(0, tot - extMib - 2048);
        setText(x.budget, `워커 예산 ${fmt(bud)} MiB = 총 − 외부 − 2,048 · 워커 사용 ${fmt(wk)} MiB`);
      }
      if (!ch || ch.has('util_pct')) { setText(x.util, `${fmt(g.util_pct)}%`); }
      x.sp.draw(hist?.get(g.index) || []);
      if (!ch || ch.has('temp_c')) { setText(x.temp, `${fmt(g.temp_c)}°C`); x.temp.classList.toggle('og-caution', (g.temp_c.value ?? 0) > CAUTION.temp); }
      if (!ch || ch.has('power_w')) setText(x.pw, `${fmt(g.power_w, 1)} W`);
      if (!ch || ch.has('job_id') || ch.has('worker_vram')) { const j = g.job_id || g.worker_vram?.job_id; setText(x.job, j ? `현재 job ${j}${g.worker_vram?.model_id ? ' · ' + g.worker_vram.model_id : ''}` : '현재 job 없음'); x.job.dataset.on = j ? '1' : '0'; }
      x.provBox.replaceChildren(prov(g.power_w, { short: true }));
    }
    setText(lastSeen, hhmmss(s.at));
  };
  if (gpus?.gpus) drawGpu(gpus, null, new Map());
  else for (const x of R.values()) { x.rg.state({ void: true }); setText(x.util, '—'); x.provBox.replaceChildren(h('div', { class: 'og-why' }, '폴러 미기동 — 수신 없음')); }

  // ── A100 노드 2 (등록 대기 · join-token 실동작)
  const side = h('div', { class: 'inf-side' }); G.append(side);
  for (const n of (nodes?.items || []).filter((x) => x.state === 'pending')) {
    const tokBox = h('div', {});
    const btn = h('button', { class: 'og-btn', type: 'button' }, '가입 토큰 발급');
    btn.addEventListener('click', async () => {
      try {
        const r = await write('/ops/nodes/join-token', 'POST', { node: n.id });
        const copy = h('button', { class: 'og-btn is-s', type: 'button', onclick: async () => { try { await navigator.clipboard.writeText(r.token); copy.textContent = '복사됨'; } catch { copy.textContent = '복사 불가(권한)'; } } }, '복사');
        tokBox.replaceChildren(h('div', { class: 'a1-tok', 'data-k': 'token' }, r.token), h('div', { class: 'pn-row', style: { marginTop: '8px' } }, copy, h('span', { class: 'og-num-s' }, `만료 ${hhmmss(r.expires_at)} (24h)`)), h('div', { class: 'og-note', style: { marginTop: '6px' } }, r.compose_hint));
        toast(`<b>가입 토큰 발급</b> · ${n.id} · 감사 기록`);
      } catch (e) { toast(`<b>발급 실패</b> · ${errText(e)}`, 'err'); }
    });
    guardWrite(btn);
    side.append(h('section', { class: 'a100' }, h('div', { class: 'pn-row' }, h('b', { class: 'og-num' }, n.id), h('span', { class: 'og-tag', 'data-dashed': '' }, '등록 대기')),
      h('div', { class: 'og-note' }, n.note || 'A100 80GB×4 · 등록 대기'), h('div', { class: 'a1-gpus' }, h('i'), h('i'), h('i'), h('i')),
      h('div', { class: 'pn-row' }, btn, SRC.writable ? null : h('span', { class: 'og-why' }, SRC.why)), tokBox));
  }

  // ── 대기열 · 스윔레인
  const qWrap = h('div', { class: 'q-wrap' });
  const qMeta = h('span', { class: 'og-num-s' }, '—');
  const qPow = h('span', { class: 'og-tag q-power', 'data-k': 'power', title: '전력 규칙(2026-09-26): GPU 2장 동시 풀로드 → 전력 부족 셧다운. 스케줄러가 동시 고부하 GPU 를 한도 이하로 묶는다 · 측정 = nvidia-smi 사용률' }, '—');
  G.append(h('section', { class: 'og-panel inf-queue' }, h('header', {}, h('h2', {}, '작업 대기열'), h('span', { class: 'og-sub' }, '행 = 워커 · 가로 30분 · 블록 = job'), h('span', { class: 'og-right' }, qPow, ' ', qMeta)), qWrap));
  const qr = queueRows(qWrap);
  const lnHost = h('div', {}); qWrap.append(lnHost); const ln = swimlanes(lnHost);
  qr.load((jobs?.items || []).filter((j) => ['queued', 'running'].includes(j.state)).concat((jobs?.items || []).filter((j) => !['queued', 'running'].includes(j.state)).slice(0, 2)));
  const drawQueue = (q) => {
    ln.set(q); const a = q?.pools?.a6000 || {}; const c = q?.pools?.cpu || {};
    setText(qMeta, `a6000 대기 ${a.queued ?? 0} · 실행 ${a.running ?? 0} · cpu 대기 ${c.queued ?? 0} · p95 대기 ${a.p95_wait_s?.value == null ? '—' : fmt(a.p95_wait_s) + 's'}`);
    frame.setMeta('queued', String((a.queued || 0) + (c.queued || 0)));
    const pw = q?.power;
    if (pw) {
      const now = pw.heavy_now?.value;
      setText(qPow, `전력 예산 · 고부하 GPU ${now == null ? '—' : now}/${pw.heavy_max} · 배정 ${pw.booked}/${pw.heavy_max}`);
      qPow.dataset.level = now != null && now > pw.heavy_max ? 'caution' : 'ok';
    } else setText(qPow, '전력 예산 · 수신 전');
  };
  drawQueue(queues);

  // ── 스토리지
  const stBody = h('div', { class: 'og-body' });
  G.append(h('section', { class: 'og-panel inf-store' }, h('header', {}, h('h2', {}, '스토리지'), h('span', { class: 'og-sub' }, 'statfs · du 60s'), h('span', { class: 'og-right', 'data-k': 'st-at' })), stBody));
  const drawStorage = (st) => {
    if (!st?.volumes) { stBody.replaceChildren(h('div', { class: 'cw-void' }, '스토리지 폴러 첫 수집 전 — 60s 주기')); return; }
    const rings = h('div', { class: 'st-rings' });
    for (const v of st.volumes) {
      const c = h('div', { class: 'st-ring' }); const r = ring(c, { size: 96, stroke: 6, label: `${v.mount} 사용` });
      const tot = v.total_gb.value || 1, free = v.free_gb.value ?? 0, used = tot - free;
      r.set({ segs: [{ id: 'u', kind: 'value', from: 0, to: used / tot }], ticks: [{ kind: 'caution', at: 0.8 }] }).state({ caution: used / tot > 0.8 });
      r.center.append(h('b', {}, v.mount), h('span', {}, `${Math.round(used / tot * 100)}%`));
      c.append(h('span', { class: 'og-num-s', style: { color: used / tot > 0.8 ? 'var(--cw-caution)' : '' } }, `${fmt(v.free_gb)} GB 여유`), h('span', { class: 'og-lbl' }, `총 ${fmt(v.total_gb)} GB`));
      rings.append(c);
    }
    const tier = h('div', { class: 'st-tier' });
    for (const [k, lbl] of [['raw', '원본'], ['tile', '타일'], ['result', '결과']]) {
      const e = st.by_tier?.[k]; if (!e) continue;
      tier.append(h('span', { class: 'og-lbl' }, lbl), e.value == null ? h('span', { class: 'og-why' }, e.note || '없음') : h('div', { class: 'og-bar' }, h('i', { 'data-kind': k === 'result' ? 'ai' : '', style: { width: Math.min(100, (e.value / Math.max(e.value, st.by_tier.tile?.value || 1)) * 100) + '%' } })), h('span', { class: 'og-num-s' }, e.value == null ? '—' : `${fmt(e.value, 2)} GB`));
    }
    const ten = h('div', { class: 'og-note', style: { marginTop: '10px' } }, '기관별 · ', ...Object.entries(st.by_tenant || {}).map(([k, e], i) => `${i ? ' · ' : ''}${k} ${fmt(e, 2)} GB`));
    stBody.replaceChildren(rings, tier, ten, h('div', { style: { marginTop: '8px' } }, prov(st.volumes[0].free_gb, { short: true })));
  };
  drawStorage(storage);

  // ── 모델 배치 매트릭스(모델 × GPU 상주 · VRAM · bench · 고정/해제)
  const mdBody = h('div', { class: 'og-body', style: { paddingTop: '4px' } });
  G.append(h('section', { class: 'og-panel inf-models' }, h('header', {}, h('h2', {}, '모델 배치'), h('span', { class: 'og-sub' }, '모델 × GPU 상주 · VRAM · 처리량 bench'), h('span', { class: 'og-right' }, tag('measured', 'bench 실측 1건'))), mdBody));
  const benchOf = (id) => (bench?.items || []).find((b) => b.model_id === id);
  const drawModels = (ms) => {
    const tb = h('table', { class: 'mdl-mx' }, h('thead', {}, h('tr', {}, h('th', {}, '모델'), h('th', {}, 'a6000-0'), h('th', {}, 'a6000-1'), h('th', {}, 'VRAM'), h('th', {}, '처리량(bench)'), h('th', {}, '상주'))));
    const body = h('tbody');
    for (const m of ms?.items || []) {
      const b = benchOf(m.model_id) || null; const cps = b?.chips_per_s || m.perf?.chips_per_s || null;
      const pinBtn = h('button', { class: 'og-btn is-s', type: 'button' }, m.pinned ? '해제' : '고정');
      pinBtn.addEventListener('click', async () => {
        try { const r = await write(`/ops/models/${encodeURIComponent(m.model_id)}/${m.pinned ? 'unload' : 'load'}`, 'POST', { worker: 'a6000-0' }); m.pinned = !m.pinned; drawModels(ms); toast(`<b>${m.pinned ? '상주 고정' : '해제'}</b> · ${m.model_id}${r?.note ? ' · ' + r.note : ''}`); }
        catch (e) { toast(`<b>실패</b> · ${errText(e)}`, 'err'); }
      });
      guardWrite(pinBtn);
      body.append(h('tr', {}, h('td', { style: { color: 'var(--cw-ink)' } }, m.model_id),
        h('td', { class: 'c' }, h('span', { class: 'res', 'data-on': m.resident_on?.includes('a6000-0') ? '1' : '0', 'data-pin': m.pinned && (m.pin_worker || 'a6000-0') === 'a6000-0' ? '1' : '0', title: m.resident_on?.includes('a6000-0') ? '상주' : '미상주' })),
        h('td', { class: 'c' }, h('span', { class: 'res', 'data-on': m.resident_on?.includes('a6000-1') ? '1' : '0', title: m.resident_on?.includes('a6000-1') ? '상주' : '미상주' })),
        h('td', {}, m.vram_mib?.value == null ? h('span', { class: 'og-why', title: m.vram_mib?.note }, m.vram_mib?.note || '—') : h('span', { class: 'og-num-s' }, `${fmt(m.vram_mib)} MiB`)),
        h('td', {}, cps && cps.value != null ? h('span', { title: `${cps.source} · ${cps.note || ''}` }, h('b', { class: 'og-num' }, `≈${fmt(cps)} 칩/s/GPU`), ' ', tag(cps.basis)) : h('span', { class: 'og-why' }, 'bench 전')),
        h('td', {}, pinBtn, m.pin_note ? h('span', { class: 'og-why', style: { marginLeft: '6px' } }, m.pin_note) : null)));
    }
    tb.append(body); mdBody.replaceChildren(tb, SRC.writable ? null : h('div', { class: 'og-why', style: { marginTop: '8px' } }, `고정/해제 · ${SRC.why}`));
  };

  // ── 용량 계획 [추정] — infra.js capacityPlan() · GPU 보유는 nodes 합계로 교정

    const rows = plan.rows.map((r) => r.id === 'gpu' ? { ...r, cap: capGpu, pct: Math.round(r.use / capGpu * 100), afterPct: Math.round(r.after / capGpu * 100), note: `GPU ${gpuN}장(nodes 합계 · infra.js gpuCards ${inf.CAPACITY.gpuCards} 아님) × 24h × 300일` } : r);
    capBody.append(...rows.map((r) => h('div', { class: 'cap-row' }, h('span', { class: 'og-lbl' }, r.name), h('div', { class: 'og-bar', 'data-caution': r.afterPct >= 80 ? '1' : '0', title: r.note }, h('i', { style: { width: Math.min(100, r.afterPct) + '%' } }), h('em', { style: { left: '80%' } })), h('span', { class: 'og-num-s', style: { color: r.afterPct >= 80 ? 'var(--cw-caution)' : '' } }, `${r.afterPct}%`))),
      h('div', { class: 'og-note', style: { marginTop: '10px' } }, '점선 = 예정 사업 포함 소요 ÷ 보유. 눈금 80% ', goal(), '. 계수 RATES 는 견적용 — bench·계량 실측으로 보정 전.'),
      h('div', { class: 'og-note' }, `GPU 보유 교정: 등록 노드 합계 ${gpuN}장 · A100 노드 2 는 등록 대기(미포함).`));
  } catch (e) { capBody.append(h('div', { class: 'cw-void' }, 'infra.js 읽기 실패 — ' + errText(e))); }

  // ── 텔레메트리
  frame.setMeta('nodes', String((nodes?.items || []).filter((n) => n.state !== 'pending').length)); frame.setMeta('gpus', String(gpus?.gpus?.length ?? 2));
  const running = new Set((jobs?.items || []).filter((j) => j.state === 'running').map((j) => j.id));
  const tel = connect({
    onGpu: (s, changed, hist) => { drawGpu(s, changed, hist); ln.tick(); frame.tick(false); for (const x of R.values()) { x.row.dataset.stale = '0'; x.rg.el.dataset.stale = '0'; x.rg.el.dataset.void = '0'; } },
    onQueue: (q) => drawQueue(q),
    onAlert: (a) => strip.event(a),
    onJob: async (ev) => {
      qr.event(ev);
      if (ev.state === 'running' && !running.has(ev.job_id)) {
        running.add(ev.job_id);
        let workers = []; try { const j = await get('jobs'); const jj = (j.items || []).find((x) => x.id === ev.job_id); if (jj) { workers = jj.workers || []; qr.patch(ev.job_id, jj); } } catch { /* */ }
        const idx = (workers.length ? workers : ['a6000-0', 'a6000-1']).map((w) => Number(String(w).split('-').pop())).filter((i) => R.has(i));
        requestAnimationFrame(() => leader(qr.row(ev.job_id), idx.map((i) => R.get(i).row)));
      }
      if (['done', 'cancelled', 'failed'].includes(ev.state)) { running.delete(ev.job_id); try { const j = await get('jobs'); const jj = (j.items || []).find((x) => x.id === ev.job_id); if (jj) qr.patch(ev.job_id, jj); } catch { /* */ } }
    },
    onState: (st, age) => {
      if (st === 'stale') { frame.tick(true, age / 1000); for (const x of R.values()) { x.row.dataset.stale = '1'; x.rg.el.dataset.stale = '1'; } }
    },
  });
  // shard 진행(행의 a/b) — job.state 는 상태 변화만 오므로 실행 중일 때 2s 마다 GET /jobs 로 맞춘다(값이 바뀔 때만 행이 다시 그려진다)
  if (SRC.kind !== 'off') setInterval(async () => { if (!running.size) return; const j = await get('jobs'); for (const x of j.items || []) if (qr.jobs.has(x.id)) qr.patch(x.id, x); }, 2000);
  if (SRC.kind !== 'off') setInterval(async () => { drawStorage(await get('storage')); }, 60000);
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView({ block: 'center' });
  mountPalette(); ready();
}
</script>
</body>
</html>
