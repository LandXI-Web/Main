<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XI맵 · Land-XI</title>
<meta name="description" content="XI맵 정돈판 — 현장 확인이 필요한 필지를 지도 위에서 바로.">
<link rel="icon" href="../../assets/images/favicon_landxi.png">
<link rel="stylesheet" href="../../proto/fonts-system.css">
<link rel="stylesheet" href="../../assets/css/v2/tokens-v2.css">
<link rel="stylesheet" href="../../proto/vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="chrome.css">
<script src="../../proto/vendor/maplibre/maplibre-gl.js"></script>
<script src="../../xi/vendor/pmtiles/pmtiles.js"></script>
<script type="module" src="xi-clean.js"></script>
</head>
<body data-stage="imagery">
<main class="xc" id="stage" aria-label="XI맵">
  <div class="xc-map" id="map"></div>
  <div class="xc-map xc-map--b" id="map-b" hidden aria-hidden="true"></div>
  <div class="xc-fx" id="fx" aria-hidden="true"></div>
  <div class="xc-load" id="load" aria-hidden="true"><img src="../../assets/brand/vector/landxi-wordmark.svg" alt="" height="15"><i></i></div>

  <!-- 상단 막대: 마크 · 지역 · 검색(장소 · 지번 · 한 문장) -->
  <header class="xc-top">
    <div class="xc-mast g">
      <a class="xc-brand" href="./" aria-label="XI맵 처음으로"><img src="../../assets/brand/vector/landxi-wordmark-dark.svg" alt="Land-XI" height="13"></a>
      <span class="xc-rule" aria-hidden="true"></span>
      <b class="xc-title">XI맵</b>
      <span class="xc-region" id="region"></span>
    </div>
    <div class="xc-search g" id="search" role="search">
      <svg class="xc-ico" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="장소 · 지번 · 또는 한 문장" aria-label="장소 · 지번 검색 또는 질문" autocomplete="off" spellcheck="false">
      <kbd class="xc-kbd" aria-hidden="true">⌘K</kbd>
      <i class="xc-think" id="think" aria-hidden="true"></i>
      <ul class="xc-sugg g" id="sugg" role="listbox" hidden></ul>
    </div>
    <div class="xc-chip g" id="chip" hidden><span id="chip-t"></span><button type="button" id="chip-x" aria-label="조건 지우기">×</button></div>
  </header>

  <!-- 도구 7 -->
  <nav class="xc-rail g" id="rail" aria-label="도구">
    <button type="button" data-tool="layers" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 3 9l9 5 9-5-9-5Z"/><path d="m3 14 9 5 9-5"/></svg><span>층</span></button>
    <button type="button" data-tool="rules" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span>규칙</span></button>
    <button type="button" data-tool="list" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h1M4 12h1M4 18h1"/></svg><span>목록</span></button>
    <i class="xc-sep" aria-hidden="true"></i>
    <button type="button" data-tool="swipe" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15"/><path d="M12 2v20"/></svg><span>가르기</span></button>
    <button type="button" data-tool="tilt" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 6-9 4 5 3-3 5 7Z"/></svg><span>입체</span></button>
    <i class="xc-sep" aria-hidden="true"></i>
    <button type="button" data-tool="sweep"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg><span>대조</span></button>
    <button type="button" data-tool="report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6Z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg><span>보고서</span></button>
  </nav>

  <!-- 도구 팝오버(한 번에 하나) -->
  <section class="xc-pop g" id="pop" hidden aria-live="polite"></section>

  <!-- HUD: 큰 숫자 하나 -->
  <section class="xc-hud g" id="hud" aria-live="polite">
    <p class="xc-hud-l"><span>현장 확인 필요</span><span class="xc-hud-where" id="where"></span><abbr class="xc-trust" id="trust" title="">~</abbr></p>
    <p class="xc-big"><b id="big">—</b><small>필지</small></p>
    <ol class="xc-bars" id="bars"></ol>
    <p class="xc-prog" id="prog" hidden><i id="prog-i"></i><span id="prog-t"></span></p>
  </section>

  <!-- 필지 카드 -->
  <article class="xc-card g" id="card" hidden aria-label="필지"></article>

  <!-- 가르기 손잡이 -->
  <div class="xc-grip" id="grip" hidden role="slider" tabindex="0" aria-label="원본과 AI 결과를 가르는 선" aria-valuemin="6" aria-valuemax="94" aria-valuenow="50">
    <span class="xc-grip-l">원본</span><i></i><span class="xc-grip-r">AI</span>
  </div>

  <!-- 축척 -->
  <p class="xc-scale" id="scale" aria-hidden="true"><i></i><b></b></p>
  <!-- 알림 한 줄 -->
  <p class="xc-toast" id="toast" role="status" hidden></p>
  <!-- 계정 -->
  <button type="button" class="xc-me g" id="me" hidden title="로그아웃"></button>

  <!-- 로그인(세션 없을 때 · 실제 POST /auth/login) -->
  <section class="xc-gate" id="gate" hidden aria-label="로그인">
    <form class="xc-gate-f" id="gate-f" autocomplete="on">
      <img src="../../assets/brand/vector/landxi-wordmark-dark.svg" alt="Land-XI" height="16">
      <h1>XI맵</h1>
      <div class="xc-seg" role="radiogroup" aria-label="계정">
        <label><input type="radio" name="realm" value="lx" checked><span>LX</span></label>
        <label><input type="radio" name="realm" value="tenant"><span>기관</span></label>
      </div>
      <input name="tenant" placeholder="기관 코드" autocomplete="organization" hidden>
      <input name="login" placeholder="아이디" autocomplete="username" required>
      <input name="password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
      <p class="xc-gate-e" id="gate-e" role="alert"></p>
      <button type="submit">로그인</button>
    </form>
  </section>

  <!-- 개발자 서랍(?dev=1 · LX 계정만) -->
  <aside class="xc-dev" id="dev" hidden aria-label="개발자 정보"></aside>
</main>
<noscript><p>XI맵은 자바스크립트가 필요합니다.</p></noscript>
</body>
</html>
