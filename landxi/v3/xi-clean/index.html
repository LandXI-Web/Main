<script>
/* 첫 화면 묶음(GET /ximap/boot · impl-38) — 화면 코드 · 지도 엔진을 받기 전에 첫 화면 자료를 한 요청으로 받기 시작한다.
   서버는 다 된 것부터 한 줄씩 보낸다(줄 = 경로 하나의 응답). shared/api-v1.js 가 경로마다 한 번 __lxBoot.get(경로)로 쓴다 —
   올 경로면 그 줄을 기다리고(시작 뒤 4초까지), 오지 않을 경로 · 실패한 줄 · 다 받은 뒤 20초가 지난 것은 undefined(화면이 예전처럼 따로 부른다) */
(() => { try {
  const L = (k) => localStorage.getItem(k);
  const s = JSON.parse(L('lx_api_session') || 'null');
  if (!s || !s.token || !(new Date(s.expires_at) > new Date())) return;
  const h = location.hostname;
  const base = L('lx_api_base') || (location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/i.test(h) ? 'http://localhost:8700' : /\.github\.io$/i.test(h) ? 'https://app.land-xi.dev' : location.origin);
  const q = new URLSearchParams(location.search), b = new URLSearchParams();
  for (const k of ['service', 'region', 'pnu']) if (q.get(k)) b.set(k, q.get(k));
  const E = new Map(), plan = new Set(), used = new Set(), wait = new Set(), t = performance.now();
  let fin = false, end = 0;
  const known = (k) => E.has(k) || end || (fin && !plan.has(k));
  const take = (k) => { const e = E.get(k); if (!e || used.has(k) || e.s !== 200 || !('b' in e)) return undefined; used.add(k); return e.b; };
  const tick = () => { for (const w of [...wait]) if (known(w.k)) { wait.delete(w); w.ok(take(w.k)); } };
  const on = (x) => { if (x.plan) x.plan.forEach((k) => plan.add(k)); if (x.final) fin = true; if (x.p) E.set(x.p, x); };
  window.__lxBoot = { tok: s.token, t, peek: (k) => E.get(k), get(k) {
    const now = performance.now();
    if (used.has(k) || (end ? now - end > 20e3 : now - t > 4e3)) return undefined;
    if (known(k)) return take(k);
    return new Promise((ok) => { const w = { k, ok }; wait.add(w); setTimeout(() => { if (wait.delete(w)) ok(undefined); }, Math.max(0, 4e3 - (now - t))); });
  } };
  fetch(base + '/api/v1/ximap/boot?' + b, { headers: { authorization: 'Bearer ' + s.token, accept: 'application/x-ndjson' } }).then(async (r) => {
    if (!r.ok || !r.body) return;
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf('\n')) >= 0) { const ln = buf.slice(0, i); buf = buf.slice(i + 1); if (ln) on(JSON.parse(ln)); }
      tick();
    }
  }).catch(() => {}).finally(() => { end = performance.now(); tick(); });
} catch { /* 저장 불가 창 — 화면이 따로 부른다 */ } })();
</script>

<noscript><p>XI맵은 자바스크립트가 필요합니다.</p></noscript>
<div id="xc-pre" aria-hidden="true"><i class="pm"></i><i class="pr"></i><i class="pv"></i></div>
<script>
/* 첫 그림 고르기 · 넘기기 · 다시 찍기(위 style 설명). 그림 열쇠 = 사람(로그인한 사람) + 주소 — 다른 사람의 그림은 쓰지 않고 지운다. 14일 지난 그림은 버린다. */
(() => { try {
  const D = document.documentElement, pre = document.getElementById('xc-pre');
  const L = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const s = JSON.parse(L('lx_api_session') || 'null');
  if (!s || !s.token || !(new Date(s.expires_at) > new Date())) { pre.remove(); return; }   // 로그인 전 — 화면이 곧 로그인으로 보낸다
  const who = [s.realm, s.tenant_id || '', s.user && s.user.id || ''].join('|'), key = 'lx_xc_pre:' + who + '|' + location.search;
  try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.startsWith('lx_xc_pre:') && !k.startsWith('lx_xc_pre:' + who + '|')) localStorage.removeItem(k); } } catch { /* */ }
  let c = null; try { c = JSON.parse(L(key) || 'null'); } catch { /* */ }
  const url = c && c.url && Date.now() - c.t < 14 * 864e5 ? c.url : new URL('pre-kr.webp', location.href).href;
  D.style.setProperty('--xc-pre-img', 'url("' + url + '")');
  D.classList.add('xc-pre', 'xc-pre-boot');
  // 머리줄 · 지도 판이 서면 첫 그림 판을 걷는다(지도 그림은 지도 판 바탕으로 이어진다)
  const mo = new MutationObserver(() => { if (document.querySelector('.k-app .k-mast') && document.querySelector('.xc-load')) { mo.disconnect(); pre.remove(); } });
  mo.observe(document.body, { childList: true, subtree: true });
  setTimeout(() => { mo.disconnect(); pre.remove(); }, 15000);
  // 지도가 처음 다 그려지면(사람이 아직 움직이지 않았을 때) 그 첫 지도를 작은 그림으로 남긴다 — 다음에 열 때 첫 그림
  const t0 = Date.now();
  const wait = setInterval(() => {
    const X = window.__xc, m = X && X.map;
    if (Date.now() - t0 > 30000) { clearInterval(wait); D.classList.remove('xc-pre-boot'); return; }
    if (!m || !X.boot || !X.boot.shown) return;
    clearInterval(wait);
    setTimeout(() => D.classList.remove('xc-pre-boot'), 700);   // 지도 판이 걷힌 뒤부터는 여느 기다림 표시
    let moved = false; m.on('movestart', (e) => { if (e.originalEvent) moved = true; });
    const t1 = Date.now();
    const snap = () => {
      if (moved || Date.now() - t1 > 12000) return;
      if (m.isMoving() || !m.areTilesLoaded()) { setTimeout(snap, 400); return; }
      m.once('render', () => { try {
        const cv = m.getCanvas(), w = Math.min(1200, Math.round(cv.clientWidth)), h = Math.round(w * cv.height / cv.width);
        const o = document.createElement('canvas'); o.width = w; o.height = h; o.getContext('2d').drawImage(cv, 0, 0, w, h);
        const u = o.toDataURL('image/webp', 0.72);
        if (u.length > 40 && u.length < 900000) localStorage.setItem(key, JSON.stringify({ t: Date.now(), url: u }));
      } catch { /* 저장 불가 · 그리기 판 읽기 불가 — 다음에는 전국 바탕 그림 */ } });
      m.triggerRepaint();
    };
    setTimeout(snap, 1200);
  }, 300);
} catch { const p = document.getElementById('xc-pre'); if (p) p.remove(); } })();
</script>
