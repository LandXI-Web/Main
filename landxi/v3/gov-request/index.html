<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>요청하기</title>
<meta name="description" content="LX가 가진 영상으로 분석을 맡기거나, 새로 찍어 달라고 요청합니다. LX 담당이 받습니다.">
<link rel="icon" href="../../assets/images/favicon_landxi.png">
<link rel="stylesheet" href="../../proto/vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="../kit/kit.css">
<link rel="stylesheet" href="../kit/service-card.css">
<link rel="stylesheet" href="../gov-select/brand.css">
<link rel="stylesheet" href="../gov-select/gov-select.css">
<link rel="stylesheet" href="gov-request.css">
<script src="../../proto/vendor/maplibre/maplibre-gl.js"></script>
<script src="../../xi/vendor/pmtiles/pmtiles.js"></script>
<script type="module" src="app.js"></script>
</head>
<body class="t gq-boot">
<template id="tpl">
<div class="gs-scroll gq-scroll">
 <div class="gs-page gq">
  <!-- 요청하기(18차 촬영-1 ⓑ · 원칙 120) — 탭 셋: 분석 요청(기관-5 ⓐ — 왼쪽 세 단계 · 오른쪽 '어디를 분석하나' · 내가 보낸 요청) · 촬영 요청(shoot.js) · 보낸 요청(sent.js) -->
  <header class="gs-head">
    <div class="gs-head-t"><h1>요청하기</h1><p class="gs-sub">LX가 가진 영상으로 분석을 맡기거나, 새로 찍어 달라고 요청합니다 — LX 담당이 받습니다</p></div>
  </header>
  <nav class="gs-tabs gq-tabs" role="tablist" aria-label="요청하기">
    <button type="button" class="gs-tab" role="tab" data-tab="new" aria-selected="true">분석 요청</button>
    <button type="button" class="gs-tab" role="tab" data-tab="shoot" aria-selected="false">촬영 요청</button>
    <button type="button" class="gs-tab" role="tab" data-tab="sent" aria-selected="false">보낸 요청<small class="gq-tab-n num" id="sent-n"></small></button>
  </nav>
  <div class="gq-grid gq-pane" data-pane="new">
    <div class="gq-col" aria-label="분석 요청">
      <section class="gq-stp t-card" data-s="1">
        <div class="gq-sh"><span class="n">1</span><b>영상 고르기</b><span class="gq-done" id="ok-1"></span></div>
        <!-- 원칙 179 · 185(GPT3-1) — 기관이 파일을 올려 맡기는 칸은 없다(보안 검토 전). 관할을 덮는 LX 영상 중 하나를 고른다 -->
        <p class="gq-note gq-why" id="src-why">보안 검토 전이라 지금은 LX가 가진 영상으로 분석합니다</p>
        <div class="gq-src" data-n="1">
          <div class="gq-tile" id="shared-tile"><div class="gq-shared" id="shared" role="radiogroup" aria-label="분석할 영상"></div></div>
        </div>
        <div class="gq-picked" id="picked" hidden></div>
      </section>
      <section class="gq-stp t-card" data-s="2">
        <div class="gq-sh"><span class="n">2</span><b>분석 카드 고르기</b><span class="gq-done" id="ok-2"></span></div>
        <div class="gq-cards" id="svcs" role="radiogroup" aria-label="분석 카드"></div>
      </section>
      <section class="gq-stp t-card" data-s="3">
        <div class="gq-sh"><span class="n">3</span><b>요청하기</b><small>메모는 선택</small></div>
        <input class="t-input" id="memo" type="text" maxlength="200" autocomplete="off" placeholder="메모 한 줄 — 예: 새 농지 확인용" aria-label="메모 한 줄">
        <div class="gq-go-row">
          <button type="button" class="t-btn gq-go" id="go" disabled>분석 요청</button>
          <p class="gq-note gq-after" id="go-note">LX 담당자가 확인한 뒤 분석합니다.<br>끝나면 알림으로 알려 드리고, 결과는 그 서비스에 새 시점으로 쌓입니다.</p>
        </div>
      </section>
    </div>
    <aside class="gq-col">
      <section class="t-card gq-box gq-where" aria-label="어디를 분석하나">
        <h2>어디를 분석하나</h2>
        <div class="gq-map-box"><div class="gq-map" id="map"></div><span class="gq-cap" id="map-cap" hidden></span></div>
        <p class="gq-note" id="map-note">영상을 넣으면 어디를 찍은 것인지 여기에 보입니다</p>
      </section>
      <section class="t-card gq-box gq-mine" id="mine" aria-label="내가 보낸 분석 요청">
        <h2>내가 보낸 분석 요청<small class="gq-n num" id="mine-n"></small></h2>
        <ul class="gq-rows" id="rows"></ul>
        <div class="gq-empty" id="rows-empty" hidden></div>
        <div class="gq-det" id="det" hidden></div>
      </section>
    </aside>
  </div>
  <div class="gq-grid gq-pane" data-pane="shoot" hidden>
    <div class="gq-col" id="shoot" aria-label="촬영 요청"></div>
    <aside class="gq-col">
      <section class="t-card gq-box" aria-label="보낸 요청">
        <h2>보낸 요청<small class="gq-n num" id="sent-n2"></small></h2>
        <div id="sent-mini"></div>
        <p class="gq-note">분석 · 촬영 · 검토 요청을 한 목록에서 봅니다</p>
        <button type="button" class="t-btn t-btn--text gd-more" data-go="sent">모두 보기</button>
      </section>
    </aside>
  </div>
  <div class="gq-pane gq-sentp" data-pane="sent" hidden>
    <section class="t-card gq-box" aria-label="보낸 요청 전체">
      <h2>보낸 요청<small class="gq-n" id="sent-sub">분석 · 촬영 · 검토 요청 · 최근 순</small></h2>
      <div id="sent-all"></div>
    </section>
  </div>
 </div>
</div>
</template>
</body>
</html>
