<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Land-XI</title>
<!-- GitHub Pages 는 보기 전용 사본 — 로그인·운영은 바깥 주소(메인 입구 — 주소 이름은 kit/sites.js 한 곳)에서. 화면을 막지 않게 async -->
<script src="../kit/sites.js" async onload="if (/\.github\.io$/i.test(location.hostname)) location.replace('https://' + LX_SITES.app.host + location.pathname.replace(/^\/[^/]+(?=\/landxi\/)/, '') + location.search)"></script>
<link rel="icon" href="../../assets/images/favicon_landxi.png">
<!-- 로그인 — 법전 v2.2 '토스 톤'. 회백 바탕 위 흰 문 카드(좌 440) + 둥근 24 히어로 카드(우 · 실결과 지도 3장면 = 모토 3축).
     글 예산 ≤ 200자(공백 제외) · 버튼 3(로그인 · 계정 찾기 · 이어서).
     역할 탭 없음(확인 대장 6 · 원칙 27) — LX 전용(원칙 78): app·admin = 아이디(메일 주소)·비밀번호. 기관은 기관 메인({기관}.land-xi.dev)의 로그인으로.
     입구 표기는 머리 오른쪽 작은 글(관리자 입구만) — 역할은 색이 아니라 표기로. -->
<link rel="stylesheet" href="../kit/kit.css"><!-- 토큰 포함 키트 CSS 한 벌 -->
<link rel="stylesheet" href="../../proto/vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="login.css">
<link rel="preload" as="image" href="still-national.webp" fetchpriority="high">
<script src="../../proto/vendor/maplibre/maplibre-gl.js" defer></script>
<script src="../../xi/vendor/pmtiles/pmtiles.js" defer></script>
</head>
<body class="t">

<main class="gate" id="gate">

  <!-- 문 — 흰 카드 하나. 헤드라인 1 · 문장 1 · 폼(아이디 · 비밀번호) -->
  <section class="door t-card t-card--hero" id="door">
    <header class="door__top e">
      <img class="door__mark" src="../../assets/brand/vector/landxi-wordmark-dark.svg" alt="LAND-XI PLATFORM" width="152" height="16">
      <span class="door__site" id="site" hidden></span>
    </header>

    <div class="door__body">
      <h1 class="door__h e">AI 기반 국토정보<br>통합조사</h1>
      <p class="door__lead e">국토 위성·항공·드론 영상과 AI 기술로<br>현장조사 업무를 효율적으로 지원하고,<br>수요 맞춤형 행정서비스를 제공합니다.</p>

      <form class="form e" id="form" method="post" action="#" novalidate autocomplete="on" onsubmit="event.preventDefault();window.__lxSubmit=1"><!-- 화면 코드가 늦게 올라와도 브라우저가 폼을 그대로 보내지 않게(바깥 주소 405) — 준비되면 auth.js 가 이어서 보낸다 -->
        <div class="fld" data-f="id">
          <label class="fld__l" for="id">아이디</label>
          <input class="t-input" id="id" name="username" type="text" autocomplete="username" spellcheck="false" autocapitalize="off" required>
        </div>
        <div class="fld" data-f="pw">
          <label class="fld__l" for="pw">비밀번호</label>
          <input class="t-input" id="pw" name="password" type="password" autocomplete="current-password" required>
        </div>

        <p class="msg" id="msg" role="alert" hidden></p>

        <button class="t-btn go" id="go" type="submit"><span>로그인</span><i class="go__line" aria-hidden="true"></i></button>
      </form>

      <div class="door__aux e">
        <a class="t-btn t-btn--text resume" id="resume" href="#" hidden></a>
        <button class="aux" id="helpBtn" type="button" aria-haspopup="dialog">계정 찾기 · 신청</button>
      </div>
    </div>

    <footer class="door__foot e">
      <img src="../../assets/brand/vector/lx-lockup.svg" alt="LX 한국국토정보공사" width="132" height="15">
    </footer>
  </section>

  <!-- 히어로 카드 — 실제 영상 위 실제 판독 결과. 장면 3 = 모토 3축. 지역은 변수(국내 2 · 해외 1). -->
  <section class="hero" id="hero" aria-label="Land-XI 모토와 분석 결과">
    <div class="hero__map" id="map" aria-hidden="true"></div>
    <!-- 덮개 — 0초부터 카드가 비지 않게 첫 장면 스틸, 장면을 옮길 때는 떠나는 장면의 마지막 프레임 -->
    <img class="hero__cover" id="cover" src="still-national.webp" alt="" aria-hidden="true" decoding="async" fetchpriority="high">
    <div class="hero__shade" aria-hidden="true"></div>
    <i class="hero__sweep" id="sweep" aria-hidden="true"></i>

    <div class="axis" id="axis">
      <ol class="axis__ix" id="ix" aria-label="모토"></ol>
      <p class="axis__t" id="axisT" aria-live="polite">&nbsp;</p>
      <p class="axis__l" id="axisL">&nbsp;</p>
    </div>

    <figure class="res t-card t-card--map away" id="res">
      <figcaption class="res__where" id="resWhere">&nbsp;</figcaption>
      <p class="res__row"><b class="res__v" id="resNum">&nbsp;</b><span class="res__u" id="resUnit"></span><span class="res__s" id="resSig"></span></p>
      <p class="res__cr" id="credit2" aria-hidden="true"></p>
    </figure>
    <p class="hero__credit" id="credit"></p>
    <!-- 장면 3 — 말 한 줄(XI ChatGEO) → 지도 · 단축키 글자는 쓰지 않는다(9차 채팅-2 ⓐ) -->
    <div class="ask t-card t-card--map" id="ask" aria-hidden="true"><span class="ask__t" id="askT"></span><i class="ask__c"></i></div>
  </section>
</main>

<script type="module" src="auth.js"></script>
</body>
</html>
