<!doctype html><html lang="ko" data-base="../"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지도 셸 테스트 — Land-XI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/map.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
</head><body style="margin:0">
<div id="m" style="position:relative;height:100vh"></div>
<script type="module">
import { createMap } from '../assets/js/map/shell.js';
import { IMAGERY } from '../assets/data/imagery.js';
const params = new URLSearchParams(location.search);
if (params.get('engine') === 'fallback') window.maplibregl = undefined;   // 폴백 경로 강제(테스트용)
const nw = IMAGERY.find(i => i.id === 'namwon_2508');
const c = nw ? [(nw.bounds[0] + nw.bounds[2]) / 2, (nw.bounds[1] + nw.bounds[3]) / 2] : [127.8, 36.2];
const map = await createMap(document.getElementById('m'), { ortho: true, center: c, zoom: nw ? 17 : 6 });
// 남원 2025.08 실촬영 정사영상을 바탕에 얹는다(두 엔진 모두 같은 타일 URL).
if (nw) map.addRaster('namwon', nw, { opacity: 1 });
</script>
</body></html>
