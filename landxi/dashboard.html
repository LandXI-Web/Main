<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대시보드 — Land-XI</title>
<link rel="icon" href="assets/images/favicon_landxi.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/map.css">
<link rel="stylesheet" href="assets/css/pages/dashboard.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head><body>

<div id="dashMap" class="dash__map" aria-hidden="true"></div>

<div class="dash">
  <header class="dash__head rule">
    <div class="dash__headline">
      <h2>LX 관리자 대시보드</h2>
      <p class="dash__sub">오늘 처리할 승인·문의와 서비스 운영 현황</p>
    </div>
    <a class="dash__notice" href="notice.html" id="dashNotice"></a>
    <div class="dash__date mono" id="dashDate"></div>
  </header>

  <section class="queue card glass">
    <div class="card__head">
      <h3 class="card__title">처리 대기 <span class="count" id="queueCount"></span></h3>
      <div class="card__actions"><span class="xsmall faint">대기 일수 내림차순</span></div>
    </div>
    <div class="card__body"><div class="queue__list" id="queueList"></div></div>
  </section>

  <div class="dash__mid">
    <section class="kpis" id="kpis" aria-label="핵심 지표"></section>

    <section class="charts card glass">
      <div class="card__head">
        <h3 class="card__title">운영 지표</h3>
        <div class="card__actions">
          <div class="tabs" id="chartTabs" role="tablist" aria-label="운영 지표 보기">
            <button type="button" class="tab" role="tab" id="tabProjects" aria-controls="chartProjects" aria-selected="true">프로젝트 용량</button>
            <button type="button" class="tab" role="tab" id="tabVisits" aria-controls="chartVisits" aria-selected="false">7일 방문</button>
            <button type="button" class="tab" role="tab" id="tabStorage" aria-controls="chartStorage" aria-selected="false">스토리지</button>
          </div>
        </div>
      </div>
      <div class="card__body">
        <div class="chart" id="chartProjects" role="tabpanel" aria-labelledby="tabProjects"></div>
        <div class="chart" id="chartVisits" role="tabpanel" aria-labelledby="tabVisits" hidden></div>
        <div class="chart" id="chartStorage" role="tabpanel" aria-labelledby="tabStorage" hidden></div>
      </div>
    </section>
  </div>

  <aside class="side" id="side" aria-label="서비스 운영 현황"></aside>

  <section class="coverage card" id="coverage"></section>
</div>

<script type="module" src="assets/js/pages/dashboard.js"></script>
</body></html>
