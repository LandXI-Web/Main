<!doctype html>
<html lang="en" data-lx="boot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Land-XI Global — LX GeoAI</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/landxi/proto/vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="/landxi/assets/css/v2/tokens-v2.css">
<link rel="stylesheet" href="css/fonts-v2.css">
<link rel="stylesheet" href="/landxi/assets/css/v2/globe-stage.css">
<link rel="stylesheet" href="global.css">
<script src="/landxi/proto/vendor/maplibre/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>
</head>
<!-- 글로벌판 XI맵 · ?tenant=kgz-agri|kgz-land|lx & svc=<deploy_id> & locale=en|ko & build=lx|tenant|public|export & from=namwon & tour=1
     GLOBE-STAGE(순백 글로브) → CANVAS-FULL(영상 무대) · 같은 지도 한 장 · 페이지 이동 0 -->
<body data-stage="imagery">
<div class="gs-root" id="root" data-scene="globe">
  <div class="gs-map" id="map" aria-label="map"></div>
  <div class="gs-map gs-map--b" id="map-b" aria-hidden="true"></div>

  <header class="gs-mast">
    <div class="gs-brand"><b>Land-XI</b><span data-i18n="brand.sub">Global</span></div>
    <span class="gs-chip" id="tenant-chip"></span>
    <span class="gs-chip" id="mode-chip" data-kind="demo"><i></i><span></span></span>
    <span class="gs-spacer"></span>
    <nav class="g-scenes" id="scenes" aria-label="scenes">
      <button data-scene="globe" data-i18n="scene.globe">Globe</button>
      <button data-scene="ysykata" data-i18n="scene.ysykata">Ysyk-Ata</button>
      <button data-scene="sokuluk" data-i18n="scene.sokuluk">Sokuluk · Bishkek</button>
      <button data-scene="meiktila" data-i18n="scene.meiktila">Meiktila</button>
    </nav>
    <nav class="g-go" aria-label="other stages"><a href="../xi/" data-i18n-skip title="XI맵 — domestic stage (Namwon 25 cm · live inference)">XI map · KR</a><a href="http://localhost:8702/landxi/ops/index.html" title="LX/OPS console (:8702 · admin)">OPS</a></nav>
    <nav class="g-lang" id="lang" aria-label="language"><a href="?locale=en" data-l="en">EN</a><a href="?locale=ko" data-l="ko">KO</a></nav>
  </header>

  <div class="gs-date gs-fade" id="date"></div>

  <section class="gs-hero gs-fade gs-only-globe" id="hero">
    <h1 class="g-h1 g-in" data-i18n-html="hero.h1"></h1>
    <p class="g-in-2" data-i18n="hero.lead"></p>
    <div class="g-in-3" id="hero-prov"></div>
  </section>

  <aside class="gs-list gs-fade gs-only-globe" id="list" aria-label="LX project countries">
    <div class="gs-list__head">
      <h2 class="g-h2" data-i18n="list.h"></h2>
      <p id="list-sub"></p>
      <div class="gs-list__legend"><span><i style="background:#006DF7;opacity:.6"></i><span data-i18n="list.active"></span></span><span><i style="background:#D6E6FF;outline:1px solid #93BDFF"></i><span data-i18n="list.history"></span></span><span><i style="background:#fff;outline:1.5px solid #010102;width:10px;height:10px"></i><span data-i18n="list.point"></span></span></div>
    </div>
    <ul class="gs-list__rows" role="listbox"></ul>
  </aside>

  <article class="g-card g-glass" id="card" hidden></article>
  <div class="g-hud" id="hud" hidden aria-live="polite"></div>
  <div class="g-scrub g-glass" id="scrub" hidden></div>
  <div class="g-ladder" id="ladder"></div>
  <div class="g-pf g-glass" id="pf" hidden aria-live="polite"></div>

  <div class="gs-swipe" aria-label="swipe">
    <div class="gs-swipe__side gs-swipe__side--l"></div>
    <button class="gs-swipe__grip" aria-label="swipe handle">⇆</button>
    <div class="gs-swipe__side gs-swipe__side--r"></div>
  </div>
</div>
<script type="module" src="js/boot.js"></script>
</body>
</html>
