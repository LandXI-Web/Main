function listView() {
  const n = Number(q.get('n') || 4), w = q.get('w') || 'a', d = q.get('d') || 'a', f = q.get('f') || '';
  const list = C.filter((c) => !f || c.imgs.includes(f));
  const cnt = (k) => C.filter((c) => c.imgs.includes(k)).length;
  const pages = Math.max(1, Math.ceil(list.length / n));
  const per = `<div class="per"><span>한 페이지</span>${[2, 4, 6, 8].map((k) => `<b class="${k === n ? 'on' : ''}">${k}</b>`).join('')}<span style="margin-left:4px">장</span></div>`;
  const pager = pages > 1 ? `<nav class="pager"><b class="ar off">‹</b>${Array.from({ length: pages }, (_, i) => `<b class="${i === 0 ? 'on' : ''}">${i + 1}</b>`).join('')}<b class="ar">›</b><small>${list.length}장 가운데 1–${Math.min(n, list.length)}</small></nav>` : `<nav class="pager"><small>${list.length}장 모두 한 페이지에</small></nav>`;
  return `<header class="head"><h1>분석하기</h1><p class="sub">정식 분석 서비스를 골라 내 영상으로 분석합니다 — 결과는 지도 서비스에서 봅니다</p></header>
  <div class="tools2"><div class="row">

      <span class="sep"></span><span class="k">영상</span>${['drone', 'aerial', 'sat'].map((k) => `<span class="chip ${f === k ? 'on' : ''}">${IMGK[k]} <small>${cnt(k)}</small></span>`).join('')}</div>
    <div class="right">${per}<span class="search">서비스 이름 · 찾는 것</span></div></div></div>
  <div class="gl" data-n="${n}">${list.slice(0, n).map((c) => card(c, w, d)).join('')}</div>${pager}`;

    <div class="fw-r"><section class="box"><h2>고른 영상의 범위</h2><div class="rmap" id="rmap"><span class="mcap">남원시 2023 항공영상 · 전역</span><div class="lg2"><span><i class="a"></i>고른 영상</span><span><i class="b"></i>다른 공유 영상</span></div></div>
      <p class="note" style="margin-top:10px">테두리는 영상이 실제로 덮는 범위입니다. 고른 영상 범위 안에서만 분석하고, 범위 밖 필지는 결과에 나오지 않습니다.</p></section></div>
  </div>`;
}
const rect = (b) => ({ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [[[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]], [b[0], b[1]]]] } });
async function mountRangeMap() {
  const st = createStage(document.getElementById('rmap'), { bounds: [127.1, 35.25, 127.8, 36.9], interactive: true, scale: false });
  await st.ready;
  st.geo('others', { type: 'FeatureCollection', features: SHARED.filter((s) => !s.pick).map((s) => rect(s.bb)) }, 'focus');
  st.geo('pick', { type: 'FeatureCollection', features: SHARED.filter((s) => s.pick).map((s) => rect(s.bb)) }, 'ai');
  st.map.fitBounds([127.15, 35.28, 127.78, 36.88], { padding: 24, duration: 0 });
  await new Promise((r) => setTimeout(r, 1500));
  document.documentElement.dataset.mapReady = '1';
}

  { svc: '건축물 분석서비스', card: 'bld', sgg: '44133', job: 'job_01M3TPFBAA9CTQSZTDDS2CGYMD', r: '천안시 서북구', img: '2023 항공영상 25cm · 영상 있는 7% · 이전 모델', d: '2026.10.01', v: '1,158건' },
  { svc: '주차장 분석서비스', card: 'park', sgg: '44133', job: 'job_01M4ARGYES7RGXQXVQCXG5WP9W', r: '천안시 서북구', img: '2023 항공영상 25cm · 영상 있는 7%', d: '2026.10.07', v: '93건' },
  { svc: '주차장 분석서비스', card: 'park', sgg: '41670', job: 'job_01M4ARJ76ARDGB04EAF8QP591P', r: '여주시', img: '2023 항공영상 25cm · 영상 있는 6%', d: '2026.10.07', v: '71건' },
];
const NAMWON = [127.18411, 35.30246, 127.67407, 35.56051];
function mapView(base, z) {
  const groups = ['gh', 'bld', 'park'].map((k) => {
    const rows = MINE.filter((m) => m.card === k);
    const open = k === 'gh';
    const li = rows.map((m) => `<li class="${m.on ? 'on' : ''}"><i></i><div class="tx"><b>${esc(m.r)} · ${esc(m.d)}</b><span>${esc(m.img)}</span></div><span class="v">${esc(m.v)}</span></li>`).join('');
    return `<section class="grp ${open ? '' : 'closed'}"><header><span>${esc(rows[0].svc)}</span><small>${rows.length}건</small><i>${open ? '−' : '+'}</i></header><ul class="ly">${li}</ul></section>`;
  }).join('');
  const r = (k, t, sub) => `<li class="${base === k ? 'on' : ''}"><i></i><span>${t}</span>${sub ? `<small>${sub}</small>` : ''}</li>`;
  return `<aside class="lp">
    <h1>지도 서비스</h1><p class="sub">내가 돌린 분석 결과를 서비스별로 켜고 끕니다</p>
    <div class="sum2"><div><b>703<i>동</i></b><small>켜진 결과 · 남원시 비닐하우스</small></div><div><b>7<i>건</i></b><small>내가 돌린 분석 · 3개 서비스</small></div></div>
    ${groups}
    <h2>바탕</h2><ul class="base">
      ${r('img', '영상', '분석에 쓴 영상 먼저')}<li class="ep">${['2023 항공', '2025.04 드론', '2025.06 드론', '2025.08 드론', '2025.10 드론'].map((t, i) => `<b class="${i === 0 && base === 'img' ? 'on' : ''}">${t}</b>`).join('')}</li>
      ${r('lx', 'LX맵 (편집지적도)', 'V-World 연결 확인 중')}
      ${r('cad', '연속지적 (필지 경계)', '지번 · 지목 속성')}
    </ul>
    <h2>범례</h2><ul class="lg"><li><i class="g"></i>비닐하우스 (AI 분석 결과)</li><li><i class="c"></i>필지 경계</li></ul>
    <p class="foot">다른 직원이나 LX 관리자가 돌린 분석은 여기에 나오지 않습니다. 실시간 · 전국 분석은 XI맵에서.</p>
  </aside>
  <div class="mapwrap"><div class="k-stage" id="stage"></div><span class="mcap" id="mcap">비닐하우스 분석서비스 · 남원시 · 2026.10.07 · 703동</span></div>`;
}
async function mountMap(base, z) {
  const st = createStage(document.getElementById('stage'), { bounds: NAMWON, interactive: true });
  await st.ready;
  const map = st.map;
  const cat = await api('/catalog/layers?' + new URLSearchParams({ stage: 'domestic', build: 'lx', locale: 'ko' }));
  const items = cat.items || [];
  const byId = (id) => items.find((i) => i.id === id);
  // 바탕 — 영상(남원 2023 항공 PMTiles) / LX맵(V-World WMS lt_c_landinfobasemap · 게이트웨이 프록시) / 연속지적(필지 선 · 남원 필지 PMTiles)
  if (base === 'img') { const it = byId('ap25-namwon-2023'); map.addSource('b-img', await sourceSpec(it)); map.addLayer({ id: 'b-img', type: 'raster', source: 'b-img' }, 'slot-imagery'); }
  if (base === 'lx') {
    const wms = `${API.prefix}/proxy/vworld/wms?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=lt_c_landinfobasemap&STYLES=&CRS=EPSG:3857&BBOX={bbox-epsg-3857}&WIDTH=256&HEIGHT=256&FORMAT=image/png&TRANSPARENT=false`;
    map.addSource('b-lx', { type: 'raster', tiles: [wms], tileSize: 256 }); map.addLayer({ id: 'b-lx', type: 'raster', source: 'b-lx' }, 'slot-imagery');
  }
  if (base === 'cad' || base === 'img') {
    const p = byId('parcels-namwon');
    if (p) {
      map.addSource('b-cad', await sourceSpec(p));
      if (base === 'cad') map.addLayer({ id: 'b-white', type: 'background', paint: { 'background-color': '#F4F6F8' } }, 'slot-imagery');
      map.addLayer({ id: 'b-cad', type: 'line', source: 'b-cad', 'source-layer': p.layer, minzoom: 12, paint: { 'line-color': base === 'cad' ? '#6B7280' : '#FFFFFF', 'line-width': base === 'cad' ? 0.8 : 0.7, 'line-opacity': base === 'cad' ? 0.9 : 0.7 } }, 'slot-reference');
    }
  }
  // 내 분석 결과 — 켜진 것(남원 비닐하우스 703동)만 지도에. 같은 세트는 /regions/{sgg}/results 가 준다.
  const on = MINE.filter((m) => m.on);
  for (const m of on) {
    const res = await api(`/regions/${m.sgg}/results`).catch(() => null);
    const it = (res?.items || []).find((i) => i.id === `results-lx-${m.job}`);
    if (!it) continue;
    const sid = 'my-' + m.job;
    map.addSource(sid, await sourceSpec(it));
    addResultLayers(map, sid, sid, { kind: 'result', sourceLayer: it.layer, visible: true });
  }
  if (z === 'unbong') map.jumpTo({ center: [127.5186, 35.4322], zoom: 14.6 });
  else if (z === 'close') map.jumpTo({ center: [127.5186, 35.4322], zoom: 16.4 });
  else map.fitBounds(NAMWON, { padding: 24, duration: 0 });
  await new Promise((r) => setTimeout(r, 3500));
  document.documentElement.dataset.mapReady = '1';
}

/* ── 그리기 ── */
const boot = () => new Promise((r) => { const t = () => (window.maplibregl && window.pmtiles ? r() : setTimeout(t, 30)); t(); });
if (v === 'list2') {
  rail('analyze'); page.innerHTML = listView();
  stamp.textContent = `분석하기 목록 2차 — 영상 거르기 ${q.get('f') ? IMGK[q.get('f')] : '전체'} · 설명 ${q.get('d') === 'b' ? 'ⓑ 짧게 + 결과 항목' : 'ⓐ 문장'} · 학습 데이터 ${({ a: 'ⓐ 한 줄', b: 'ⓑ 세 칸', c: 'ⓒ 데이터셋 이름' })[q.get('w') || 'a']}`;
  document.documentElement.dataset.mapReady = '1';
} else if (v === 'flow2') {
  rail('analyze'); page.classList.add('flow'); page.innerHTML = flowView();
  stamp.textContent = '영상 고르기 2차 — 실제 미리보기 · 해상도 · 촬영 시기 · 범위(실제 지도 위 테두리)';
  await boot(); await mountRangeMap();
} else {
  const base = q.get('base') || 'img', z = q.get('z') || 'all';
  rail('mapsvc'); document.getElementById('homeName').textContent = '지도 서비스'; page.classList.add('map2'); page.innerHTML = mapView(base, z);
  stamp.textContent = `지도 서비스 2차 — 실제 지도 · 바탕 ${({ img: '영상(2023 항공)', lx: 'LX맵(편집지적도)', cad: '연속지적(필지 경계)' })[base]} · 켜진 결과 = 남원 비닐하우스 703동`;
  await boot(); await mountMap(base, z);
}
</script>
