<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 · 지도 서비스 · 메뉴 · 분석하기 다듬기</title>
<link rel="stylesheet" href="ms.css">
</head>
<body class="m" data-v="list">
<div class="app">
  <header class="mast">
    <span class="word">LAND-XI</span><span class="home" id="homeName">LX 직원 대시보드</span>
    <span class="sp"></span>
    <span class="fresh"><i></i><span>14:20</span></span>
    <span class="role">LX 직원</span>
    <span class="mb help">?</span><span class="mb">나가기</span>
  </header>
  <nav class="rail" aria-label="LX 직원 메뉴" id="rail"></nav>
  <main class="main"><div class="page" id="page"></div></main>
</div>
<div class="chat"><span>XI ChatGEO</span><i>LX</i></div>
<div class="stamp"><b>시안</b><span id="stampT"></span></div>

<script>
/* 값은 모두 이 PC 서버 2026-10-09 14:00 기록 그대로(모델 기록 · 학습 자료 · 내가(test@lx.or.kr) 돌린 분석 작업 · 남원 영상 목록). 지어낸 숫자 0.
   정확도 = 모델 기록의 학습 끝 검증 값(mask mAP50) · 갱신일 = 그 검증 기록의 날. '학습한 지역' = 모델이 학습한 자료의 지역 — 기록에 없으면 '기록 없음'. */
const IMG = '../../../../../../../landxi/';
const q = new URLSearchParams(location.search);
const v = q.get('v') || 'list';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (x) => Number(x).toLocaleString('ko-KR');

/* ───── A. 왼쪽 메뉴 — 지금 메뉴 레일의 아이콘만(kit/shell.js ICON) · 새 아이콘 없음 ───── */
const ICON = {
  home: '<path d="M3 9.5L10 4l7 5.5V16H3z"/>',
  folder: '<path d="M3 5h5l2 2h7v9H3z"/>',
  scan: '<path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/><path d="M10 6.5l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5L6.5 10 9 9z"/>',
  map: '<path d="M3 5l4.5-1.5 5 2L17 4v11l-4.5 1.5-5-2L3 16z M7.5 3.5v11 M12.5 5.5v11"/>',
  grid: '<path d="M3 3h6v6H3z M11 3h6v6h-6z M3 11h6v6H3z M11 11h6v6h-6z"/>',
  data: '<ellipse cx="10" cy="5" rx="6" ry="2"/><path d="M4 5v10c0 1.1 2.7 2 6 2s6-.9 6-2V5 M4 10c0 1.1 2.7 2 6 2s6-.9 6-2"/>',
  inbox: '<path d="M3 11l2-7h10l2 7v5H3z M3 11h4l1 2h4l1-2h4"/>',
};
const svg = (k) => `<svg viewBox="0 0 20 20" aria-hidden="true">${ICON[k]}</svg>`;
function rail(current, variant) {
  // ⓐ 지도 서비스 = 지도 아이콘 · XI맵 = 글자 'XI' 표기 / ⓑ XI맵 = 지도 아이콘 · 지도 서비스 = 바둑판 아이콘
  const items = [
    ['home', '대시보드', svg('home')], ['projects', '프로젝트', svg('folder')], ['analyze', '분석하기', svg('scan')],
    ['mapsvc', '지도 서비스', variant === 'b' ? svg('grid') : svg('map')], ['ximap', 'XI맵', variant === 'b' ? svg('map') : '<span class="xi">XI</span>'],
    'div', ['data', '데이터', svg('data')], ['inbox', '요청함', svg('inbox')],
  ];
  document.getElementById('rail').innerHTML = items.map((it) => it === 'div' ? '<span class="div"></span>'
    : `<span class="ri ${it[0] === current ? 'on' : ''}">${it[2]}<span>${it[1]}</span></span>`).join('');
}

/* ───── 정식 서비스 5장(서버 2026-10-09) — 이름 · 모델 · 검증 정확도 · 갱신일 · 학습한 지역 ───── */
const C = [
  { id: 'farm', name: '경작·휴경 분석서비스', grp: '농지·시설', img: 'v3/service-detail/data/img/namwon-cycle4/3@2x.jpg',
    acc: 95, upd: '2026.01', model: '경작지 · 비경작지 2분류', learned: '남원시', learnedNote: '모델 기록(남원 학습본)',
    lines: { a: '경작 중인지 쉬고 있는지 필지마다 알려 줍니다', b: '경작·휴경 필지 가려내기', c: '농지가 실제로 경작되는지 볼 때' } },
  { id: 'gh', name: '비닐하우스 분석서비스', grp: '농지·시설', img: 'assets/proto/crops/namwon-greenhouse-2025/2@2x.jpg',
    acc: 89, upd: '2026.05.16', model: '건물 · 주차장 · 경작지 · 비닐하우스 4분류', learned: null,
    lines: { a: '단동·다동 비닐하우스를 찾아 줍니다', b: '비닐하우스 위치와 동 수 파악', c: '비닐하우스가 어디에 몇 동 있는지 볼 때' } },
  { id: 'bld', name: '건축물 분석서비스', grp: '건축·변화', img: null,
    acc: 89, upd: '2026.05.16', model: '건물 · 주차장 · 경작지 · 비닐하우스 4분류', learned: null,
    lines: { a: '대장에 없는 건물이 선 필지를 알려 줍니다', b: '대장과 다른 건물 찾기', c: '대장과 다른 건물을 가려낼 때' } },
  { id: 'park', name: '주차장 분석서비스', grp: '건축·변화', img: null,
    acc: 89, upd: '2026.05.16', model: '건물 · 주차장 · 경작지 · 비닐하우스 4분류', learned: null,
    lines: { a: '지목과 다르게 주차장으로 쓰는 땅을 알려 줍니다', b: '지목과 다른 주차장 찾기', c: '지목과 다른 주차장을 가려낼 때' } },
  { id: 'silage', name: '곤포사일리지 분석서비스', grp: '농지·시설', img: null,
    acc: 96, upd: '2026.09.30', model: '곤포사일리지 1분류', learned: '남원시', learnedNote: '학습 자료 60장 · 남원시',
    lines: { a: '들에 쌓아 둔 곤포사일리지를 세어 줍니다', b: '곤포사일리지 적치 현황 파악', c: '곤포사일리지가 어디 쌓여 있는지 볼 때' } },
];
const pic = (c) => c.img ? `<div class="pic"><img src="${IMG + c.img}" alt=""></div>` : `<div class="pic blank"><span>결과 장면이 아직 없습니다</span></div>`;
const hero = (c) => `<div class="hero2"><div><b>${c.acc}<i>%</i></b><small>검증 정확도</small></div><div><b class="d">${c.upd}</b><small>모델 갱신</small></div></div>`;
const learned = (c) => `<div class="where"><span class="k">학습한 지역</span><span class="v ${c.learned ? '' : 'none'}">${c.learned ? esc(c.learned) : '기록 없음'}</span></div>`;
const card = (c, w) => `<article class="ca">${pic(c)}<div class="bd"><h3 class="nm">${esc(c.name)}</h3><p class="ln">${esc(c.lines[w])}</p>${hero(c)}${learned(c)}<div class="acts"><span class="go">분석하기</span><span class="more">자세히</span></div></div></article>`;

/* ───── D. 분석하기 목록 — 한 페이지 2 · 4 · 6 · 8장 + 페이지 넘김 ───── */
function listView() {
  const n = Number(q.get('n') || 4), w = q.get('w') || 'a', p = Number(q.get('p') || 1);
  const pages = Math.max(1, Math.ceil(C.length / n));
  const slice = C.slice((p - 1) * n, p * n);
  const per = `<div class="per"><span>한 페이지</span>${[2, 4, 6, 8].map((k) => `<b class="${k === n ? 'on' : ''}">${k}</b>`).join('')}<span style="margin-left:4px">장</span></div>`;
  const pager = pages > 1 ? `<nav class="pager"><b class="ar ${p === 1 ? 'off' : ''}">‹</b>${Array.from({ length: pages }, (_, i) => `<b class="${i + 1 === p ? 'on' : ''}">${i + 1}</b>`).join('')}<b class="ar ${p === pages ? 'off' : ''}">›</b><small>${C.length}장 가운데 ${(p - 1) * n + 1}–${Math.min(p * n, C.length)}</small></nav>`
    : `<nav class="pager"><small>${C.length}장 모두 한 페이지에</small></nav>`;
  return `<header class="head"><h1>분석하기</h1><p class="sub">정식 분석 서비스를 골라 내 영상으로 분석합니다 — 결과는 지도 서비스에서 봅니다</p></header>
  <div class="tools"><div class="chips"><span class="chip on">전체 <small>5</small></span><span class="chip">농지·시설 <small>3</small></span><span class="chip">건축·변화 <small>2</small></span></div><div class="right">${per}<span class="search">서비스 이름 · 찾는 것</span></div></div>
  <div class="gl" data-n="${n}">${slice.map((c) => card(c, w)).join('')}</div>${pager}`;
}

/* ───── B. 분석하기 상세 — 모델 알기 → 영상 고르기 → 분석 → (끝) 지도 서비스에서 보기. 지도 층 화면은 상세에 두지 않는다.
   예 = 비닐하우스 분석서비스(내가 2026.10.07 실제로 남원 · 함양 · 증평을 돌린 카드). ───── */
const GH = C[1];
const MINE_GH = [
  ['2026.10.07', '남원시', '2023 항공영상 25cm · 남원시 전역', '703동'],
  ['2026.10.07', '함양군', '2023 항공영상 25cm · 영상 있는 66%', '235동'],
  ['2026.10.07', '증평군', '2023 항공영상 25cm · 영상 있는 9%', '84동'],
];
function flowView(step) {
  const on = (i) => (i === step ? 'on' : i < step ? 'done' : '');
  const s1 = `<dl class="kv">
      <div><dt>찾는 것</dt><dd>비닐하우스 (단동 · 다동 — 동 단위로 셉니다)</dd></div>
      <div><dt>검증 정확도</dt><dd><b>89%</b> · 학습 끝 검증 · 모델 갱신 2026.05.16</dd></div>
      <div><dt>학습한 영상</dt><dd>항공 정사영상 25cm</dd></div>
      <div><dt>학습한 지역</dt><dd class="none">기록 없음 — 학습 자료가 등록되면 여기에 보입니다</dd></div>
      <div><dt>맞는 영상</dt><dd>25cm 안팎 항공 · 드론 정사영상. 더 거친 영상은 고를 때 '맞지 않음'으로 표시됩니다</dd></div>
      <div><dt>같은 모델</dt><dd>건축물 · 주차장 분석서비스와 같은 4분류 모델을 씁니다</dd></div>
    </dl>
    <div class="thumbs2">
      <figure><img src="${IMG}assets/proto/crops/namwon-greenhouse-2025/1@2x.jpg" alt=""><figcaption>남원시 · 2025 정사영상</figcaption></figure>
      <figure><img src="${IMG}assets/proto/crops/namwon-greenhouse-2025/2@2x.jpg" alt=""><figcaption>남원시 · 2025 정사영상</figcaption></figure>
      <figure><img src="${IMG}assets/proto/crops/namwon-greenhouse-2025/3@2x.jpg" alt=""><figcaption>남원시 · 2025 정사영상</figcaption></figure>
    </div>`;
  const s2 = `<h4>내 정사영상 올리기</h4>
    <div class="drop"><b>정사영상 파일을 여기에 끌어다 놓거나 고르세요</b><small>tif · jpg · jp2 · ecw · 한 번에 20GB까지 · 올라오면 서버가 표준 형식으로 바꿔 보관합니다 · 지역과 촬영 시기를 적습니다</small></div>
    <h4 class="mt">공유 데이터셋에서 불러오기 <small>LX 관리자가 관리 · 내 관할 먼저</small></h4>
    <ul class="ds">
      <li class="pick"><span class="nm2">남원시 2023 항공영상</span><span class="g">25cm</span><span class="fit ok">모델에 맞음</span></li>
      <li><span class="nm2">남원시 2020 항공영상</span><span class="g">25cm</span><span class="fit ok">모델에 맞음</span></li>
      <li><span class="nm2">함양군 2023 항공영상</span><span class="g">25cm</span><span class="fit ok">모델에 맞음</span></li>
      <li><span class="nm2">증평군 2023 항공영상</span><span class="g">25cm</span><span class="fit ok">모델에 맞음</span></li>
      <li><span class="nm2">남원시 2025.08 드론 정사영상</span><span class="g">1.5cm</span><span class="fit so">해상도 차이 커 결과 확인 필요</span></li>
    </ul>`;
  const s3 = `<div class="fin"><i>✓</i><b>분석이 끝났습니다 — 남원시 · 2023 항공영상 · 비닐하우스 703동</b><span>2026.10.07 · 남원시 전역 · 걸린 시간 약 21분 · 결과는 지도 서비스의 '내 분석 결과'에 들어갔습니다</span></div>
    <p class="note">끝난 결과는 이 화면이 아니라 지도 서비스에서 층으로 켜고 봅니다. 분석이 도는 동안에는 여기에 읍면동 순 진행이 보이고, 닫아도 계속 돌며 끝나면 알림이 옵니다.</p>`;
  const steps = [['모델 알기', '무엇을 얼마나 잘 찾나', s1], ['영상 고르기', '내 정사영상 올리기 · 공유 데이터셋', s2], ['분석', '대기열 → 끝나면 지도 서비스로', s3]];
  const left = steps.map(([t, sub, body], i) => `<section class="stp ${on(i + 1)}"><header><i>${i + 1}</i><b>${t}</b><small>${sub}</small></header>${i + 1 === step ? `<div class="stb">${body}</div>` : ''}</section>`).join('');
  const foot = step === 1 ? `<span class="go wide">영상 고르기로</span>` : step === 2 ? `<span class="go wide">이 영상으로 분석 시작</span><span class="note">예상 시간 약 21분 · 최근 같은 영상 기록</span>` : `<span class="go wide">지도 서비스에서 보기</span><span class="alt">같은 서비스로 다른 영상 분석</span>`;
  const mine = MINE_GH.map(([d, r, im, vv]) => `<li><b>${d} · ${r}</b><span>${im}</span><span class="v">${vv}</span></li>`).join('');
  return `<nav class="crumb"><span>분석하기</span><span>›</span><b>${esc(GH.name)}</b></nav>
  <div class="fw">
    <aside class="fw-l">
      <div class="fl-h"><h1 class="nm">${esc(GH.name)}</h1><p class="ln">${esc(GH.lines.a)}</p></div>
      ${left}
      <div class="fl-f">${foot}</div>
    </aside>
    <div class="fw-r">
      <section class="box mdl"><h2>이 서비스의 모델</h2>${hero(GH)}<dl class="kv"><div><dt>찾는 것</dt><dd>비닐하우스</dd></div><div><dt>모델</dt><dd>${esc(GH.model)}</dd></div><div><dt>학습한 영상</dt><dd>항공 정사영상 25cm</dd></div><div><dt>학습한 지역</dt><dd class="none">기록 없음</dd></div></dl></section>
      <section class="box"><h2>내가 돌린 분석 <small>이 서비스로 3건</small></h2><ul class="mine2">${mine}</ul><p class="alt" style="margin:12px 0 0">지도 서비스에서 모두 보기</p></section>
    </div>
  </div>`;
}

/* ───── C. 지도 서비스 — 내가 돌린 분석 결과(서버 작업 기록 · test@lx.or.kr) + 층 · 범례 · 바탕. XI맵의 실시간 · 전역 요소 0(원칙 147). ───── */
const MINE = [
  { svc: '비닐하우스 분석서비스', r: '남원시', img: '2023 항공영상 25cm · 남원시 전역', d: '2026.10.07', v: '703동', st: '끝', on: true },
  { svc: '비닐하우스 분석서비스', r: '함양군', img: '2023 항공영상 25cm · 영상 있는 66%', d: '2026.10.07', v: '235동', st: '끝' },
  { svc: '비닐하우스 분석서비스', r: '증평군', img: '2023 항공영상 25cm · 영상 있는 9%', d: '2026.10.07', v: '84동', st: '끝' },
  { svc: '건축물 분석서비스', r: '원주시', img: '2023 항공영상 25cm · 영상 있는 13%', d: '2026.10.07', v: '5,011건', st: '끝' },
  { svc: '주차장 분석서비스', r: '천안시 서북구', img: '2023 항공영상 25cm · 영상 있는 7%', d: '2026.10.07', v: '93건', st: '끝' },
  { svc: '주차장 분석서비스', r: '여주시', img: '2023 항공영상 25cm · 영상 있는 6%', d: '2026.10.07', v: '71건', st: '끝' },
  { svc: '건축물 분석서비스', r: '천안시 서북구', img: '2023 항공영상 25cm · 영상 있는 7% · 이전 모델', d: '2026.10.01', v: '1,158건', st: '끝' },
];
function mapView() {
  const rows = MINE.map((m) => `<li class="${m.on ? 'on' : ''}"><span class="t">${esc(m.svc)} · ${esc(m.r)}</span><span class="v">${esc(m.v)}<small>${esc(m.st)}</small></span><span class="m">${esc(m.d)} · ${esc(m.img)}</span></li>`).join('');
  return `<div class="ms">
    <aside class="ms-l">
      <h1>지도 서비스</h1><p class="sub">내가 돌린 분석 결과를 지도 위에 층으로 켜고 봅니다</p>
      <div class="ms-f"><span class="chip on">전체 <small>7</small></span><span class="chip">비닐하우스 <small>3</small></span><span class="chip">건축물 <small>2</small></span><span class="chip">주차장 <small>2</small></span></div>
      <ul class="rs">${rows}</ul>
