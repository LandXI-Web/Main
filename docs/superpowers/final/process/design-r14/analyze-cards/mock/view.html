<!doctype html>
<html lang="ko">
<head>

<link rel="stylesheet" href="ci.css">

</head>
<body class="m" data-v="list">
<div class="app">
  <header class="mast">
    <span class="word">LAND-XI</span><span class="home">LX 직원 대시보드</span>
    <span class="sp"></span>
    <span class="fresh"><i></i><span>10:50</span></span>
    <span class="role">LX 직원</span>
    <span class="mb">XI맵</span><span class="mb help">?</span><span class="mb">나가기</span>
  </header>
  <nav class="rail" aria-label="LX 직원 메뉴">
    <span class="ri"><svg viewBox="0 0 20 20"><path d="M3 9.5L10 4l7 5.5V16H3z"/></svg><span>홈</span></span>
    <span class="ri"><svg viewBox="0 0 20 20"><path d="M3 5h5l2 2h7v9H3z"/></svg><span>프로젝트</span></span>
    <span class="ri on"><svg viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/><path d="M10 6.5l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5L6.5 10 9 9z"/></svg><span>분석하기</span></span>
    <span class="ri"><svg viewBox="0 0 20 20"><path d="M3 4h14v12H3z M3 8h14"/></svg><span>서비스 카드</span></span>
    <span class="ri"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="5" rx="6" ry="2"/><path d="M4 5v10c0 1.1 2.7 2 6 2s6-.9 6-2V5 M4 10c0 1.1 2.7 2 6 2s6-.9 6-2"/></svg><span>데이터</span></span>
    <span class="ri"><svg viewBox="0 0 20 20"><path d="M3 11l2-7h10l2 7v5H3z M3 11h4l1 2h4l1-2h4"/></svg><span>요청함</span></span>
  </nav>
  <main class="main"><div class="page" id="page"></div></main>
</div>
<div class="chat"><span>XI ChatGEO</span><i>LX</i></div>
<div class="stamp"><b>시안</b><span id="stampT"></span></div>

<script>
/* 값은 모두 이 PC 서버 2026-10-09 응답(모델 기록 · 카드 묶음 · 배포본) 그대로. 정확도 = 모델 기록의 학습 끝 검증 값(mAP50) · 갱신일 = 그 검증 기록의 날.
   정식 서비스 = 등록된 모델이 있고 적용된 지역이 있는 카드만(원칙 146). 이름은 '{대상} 분석서비스'(원칙 145). */
const IMG = '../../../../../../../landxi/';
const S = { ga: '운영', pilot: '시범', none: '첫 결과 전' };
const C = [
  { id: 'farm', name: '경작·휴경 분석서비스', old: '영농관리 행정서비스', grp: '농지·시설', img: 'v3/service-detail/data/img/namwon-cycle4/3@2x.jpg', cap: '남원시 · 2025.08 드론 정사영상',
    line: '경작·휴경·시설·전용 필지를 찾습니다', acc: 95, accOf: '검증', upd: '2026.01', model: '경작지 · 비경작지 2분류', unit: '필지',
    regions: [['남원시', 'ga', 2098, '2025년 드론영상'], ['강진군', 'pilot', null, '2023년 항공영상'], ['구례군', 'pilot', null, '2023년 항공영상'], ['여수시', 'pilot', null, '2023년 항공영상'], ['목포시', 'pilot', null, '2023년 항공영상'], ['익산시', 'none', null, '2025년 드론영상'], ['시흥시', 'none', null, null]] },
  { id: 'gh', name: '비닐하우스 분석서비스', old: '비닐하우스 서비스', grp: '농지·시설', img: 'assets/proto/crops/namwon-greenhouse-2025/2@2x.jpg', cap: '남원시 · 2025 정사영상',
    line: '단동·다동 비닐하우스를 찾습니다', acc: 89, accOf: '검증', upd: '2026.05.16', model: '건물 · 주차장 · 경작지 · 비닐하우스 4분류', unit: '필지',
    regions: [['남원시', 'pilot', null, '2025년 드론영상'], ['함양군', 'pilot', null, '2023년 항공영상'], ['증평군', 'pilot', null, '2023년 항공영상']] },
  { id: 'bld', name: '건축물 분석서비스', old: '건축물', grp: '건축·변화', img: null,
    line: '건물과 대장이 다른 필지를 찾습니다', acc: 89, accOf: '검증', upd: '2026.05.16', model: '건물 · 주차장 · 경작지 · 비닐하우스 4분류', unit: '필지',
    regions: [['원주시', 'pilot', null, '2023년 항공영상']] },
  { id: 'park', name: '주차장 분석서비스', old: '주차장', grp: '건축·변화', img: null,
    line: '지목과 다른 주차장 필지를 찾습니다', acc: 89, accOf: '검증', upd: '2026.05.16', model: '건물 · 주차장 · 경작지 · 비닐하우스 4분류', unit: '필지',
    regions: [['천안시 서북구', 'pilot', null, '2023년 항공영상'], ['여주시', 'pilot', null, '2023년 항공영상']] },
  { id: 'silage', name: '곤포사일리지 분석서비스', old: '곤포사일리지', grp: '농지·시설', img: null,
    line: '들에 쌓인 곤포사일리지를 찾습니다', acc: 96, accOf: '검증', upd: '2026.09.30', model: '곤포사일리지 1분류', unit: '필지',
    regions: [['보령시', 'pilot', null, '2023년 항공영상']] },
];
const nf = (v) => Number(v).toLocaleString('ko-KR');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const regionText = (c) => { const n = c.regions.map((r) => r[0]); return n.length > 3 ? `${n.slice(0, 3).join(' · ')} 외 ${n.length - 3}곳` : n.join(' · '); };
const regionCount = (c) => { const g = c.regions.filter((r) => r[1] === 'ga').length, p = c.regions.filter((r) => r[1] === 'pilot').length; return [g ? `운영 ${g}` : '', p ? `시범 ${p}` : ''].filter(Boolean).join(' · '); };

/* ───── 카드 한 틀: 그림 → 이름 → 한 줄 → 정확도 · 모델 갱신(주인공) → 대상 지역 → 버튼 ───── */
const pic = (c) => c.img
  ? `<div class="pic"><img src="${IMG + c.img}" alt=""></div>`
  : `<div class="pic blank"><span>결과 장면이 아직 없습니다</span></div>`;
const hero = (c) => `<div class="hero2"><div><b>${c.acc}<i>%</i></b><small>${c.accOf} 정확도</small></div><div><b class="d">${c.upd}</b><small>모델 갱신</small></div></div>`;
const where = (c) => `<div class="where"><span class="k">대상 지역 ${c.regions.length}곳</span><span>${esc(regionText(c))}</span></div>`;
const acts = () => `<div class="acts"><span class="go">분석하기</span><span class="more">자세히</span></div>`;
const cardA = (c) => `<article class="ca">${pic(c)}<div class="bd"><h3 class="nm">${esc(c.name)}</h3><p class="ln">${esc(c.line)}</p>${hero(c)}${where(c)}${acts()}</div></article>`;
const cardB = (c) => `<article class="ca nb"><div class="bd"><p class="top"><span>${esc(c.grp)}</span><span class="r">${regionCount(c)}</span></p><h3 class="nm">${esc(c.name)}</h3><p class="ln">${esc(c.line)}</p>${hero(c)}${where(c)}${acts()}</div></article>`;

const head = `<header class="head"><h1>분석하기</h1><p class="sub">정식 분석 서비스를 골라 지역을 정하면 AI가 분석합니다 — 결과는 서비스 지도에서 봅니다</p></header>`;
const tools = `<div class="tools"><div class="chips"><span class="chip on">전체 <small>5</small></span><span class="chip">농지·시설 <small>3</small></span><span class="chip">건축·변화 <small>2</small></span></div><span class="search">서비스 이름 · 찾는 것</span></div>`;

/* ───── 상세 = 정식 지도 서비스(원칙 147): 왼쪽 대상 지역 · 층 · 범례 / 가운데 지도 / 오른쪽 지역별 결과 · 모델 · 분석하기 ───── */
function mapView(c) {
  const rows = c.regions.map(([n, s, v, im], i) => `<li class="${i === 0 ? 'on' : ''}"><span class="st" data-s="${s}">${S[s]}</span><span class="n">${esc(n)}</span><span class="v ${v ? '' : 'none'}">${v ? nf(v) + ' ' + c.unit : '—'}</span></li>`).join('');
  const tbl = c.regions.map(([n, s, v, im]) => `<tr><td>${esc(n)}</td><td><span class="st" data-s="${s}">${S[s]}</span></td><td class="${v ? '' : 'none'}">${v ? nf(v) + ' ' + c.unit : '—'}</td><td class="sub2">${esc(im || '영상 등록 필요')}</td></tr>`).join('');
  return `<nav class="crumb"><span>분석하기</span><span>›</span><b>${esc(c.name)}</b></nav>
  <div class="mp">
    <aside class="mp-l">
      <section><h2>대상 지역</h2><ul class="rl2">${rows}</ul></section>
      <section><h2>층</h2><ul class="ly">
        <li class="on"><i></i><span>AI 분석 결과 — 경작지</span></li>
        <li class="on"><i></i><span>AI 분석 결과 — 비경작지</span></li>
        <li class="on"><i></i><span>필지 경계 · 연속지적</span></li>
        <li class="on"><i></i><span>정사영상 2025.08</span></li>
        <li><i></i><span>정사영상 2025.04</span></li>
      </ul></section>
      <section><h2>범례</h2><ul class="lg"><li><i class="a"></i>경작지</li><li><i class="b"></i>비경작지</li><li><i class="c"></i>필지 경계</li></ul></section>
    </aside>
    <div class="mp-m"><img src="${IMG + c.img}" alt=""><span class="mcap">${esc(c.cap)}</span><span class="zoom"><b>+</b><b>−</b></span></div>
    <aside class="mp-r">
      <h1 class="nm">${esc(c.name)}</h1><p class="ln">${esc(c.line)}</p>
      ${hero(c)}
      <p class="note">${esc(c.model)} 모델 · 학습 끝 검증 값</p>
      <section><h2>지역별 결과</h2><table class="rt"><tbody>${tbl}</tbody></table></section>
      <span class="alt" style="margin-top:auto">서비스 카드에서 관리하기</span>
      <span class="go wide" style="margin-top:0">새 지역에 분석하기</span>
    </aside>
  </div>`;
}


/* ───── 3차(원칙 148): 상세 = 모델 알기 → 영상 고르기(내 영상 올리기 · 공유 데이터셋) → 분석 → 지도 층 ───── */
function flowView(c, step) {
  const on = (n) => (n === step ? 'on' : n < step ? 'done' : '');
  const s1 = `<dl class="kv">
      <div><dt>찾는 것</dt><dd>경작지 · 비경작지 (필지 단위로 정리)</dd></div>
      <div><dt>검증 정확도</dt><dd><b>95%</b> · 학습 끝 검증 · 모델 갱신 2026.01</dd></div>
      <div><dt>학습한 영상</dt><dd>드론 정사영상 2cm · 남원시</dd></div>
      <div><dt>잘 되는 조건</dt><dd>학습과 같은 드론 정사영상(2cm 안팎) · 영농기 촬영 — 남원시 운영 결과 2,098필지</dd></div>
      <div><dt>약한 조건</dt><dd>25cm 항공영상 — 학습 영상보다 거칠어 시범 4곳(강진 · 구례 · 여수 · 목포)은 결과 확인 중</dd></div>
    </dl>
    <div class="thumbs2"><figure><img src="${IMG}v3/service-detail/data/img/namwon-cycle4/2@2x.jpg" alt=""><figcaption>남원시 2025.06 결과</figcaption></figure><figure><img src="${IMG}v3/service-detail/data/img/namwon-cycle4/4@2x.jpg" alt=""><figcaption>남원시 2025.10 결과</figcaption></figure></div>`;
  const s2 = `<h4>내 정사영상 올리기</h4>
    <div class="drop"><b>정사영상 파일을 여기에 끌어다 놓거나 고르세요</b><small>tif · jpg · jp2 · ecw 파일 · 한 번에 20GB까지 · 올라오면 서버가 표준 형식으로 바꿔 보관합니다</small></div>
    <div class="up"><span class="fn">원주시_2025_정사영상.tif</span><span class="sz">3.2GB</span><span class="bar"><i style="width:62%"></i></span><span class="st2">올리는 중 62% · 예시</span></div>
    <div class="fld"><span>지역</span><span class="in">원주시</span><span>촬영 시기</span><span class="in">2025.05</span></div>
    <h4 class="mt">공유 데이터셋에서 불러오기 <small>LX 관리자가 관리 · 내 관할 먼저</small></h4>
    <ul class="ds">
      <li class="pick"><span class="nm2">남원시 2025.08 드론 정사영상</span><span class="g">1.5cm</span><span class="fit ok">모델에 맞음</span></li>
      <li><span class="nm2">남원시 2025.04 드론 정사영상</span><span class="g">1.5cm</span><span class="fit ok">모델에 맞음</span></li>
      <li><span class="nm2">익산시 황등면 드론 정사영상</span><span class="g">1.4cm</span><span class="fit ok">모델에 맞음</span></li>
      <li><span class="nm2">김제시 2023 항공영상</span><span class="g">25cm</span><span class="fit so">거칠어 결과 확인 필요</span></li>
      <li><span class="nm2">V-World 위성영상 · 연결된 영상</span><span class="g">25cm</span><span class="fit so">거칠어 결과 확인 필요</span></li>
      <li><span class="nm2">Sentinel-2 위성영상 · 연결된 영상</span><span class="g">10m</span><span class="fit no">이 모델에 맞지 않음</span></li>
    </ul>`;
  const s3 = `<div class="sel"><span class="k">고른 영상</span><b>남원시 2025.08 드론 정사영상 · 1.5cm</b><span class="k">예상 시간</span><b>남원 전역 약 2시간 9분 <small>최근 같은 영상 분석 기록</small></b></div>
    <div class="prog"><div class="pb"><i style="width:17%"></i></div><p><b>분석 중</b> · 23개 읍면동 가운데 4곳 끝 <small>예시</small></p><p class="note">작업 대기열에서 순서대로 돌고, 끝난 읍면동부터 지도에 층으로 올라옵니다. 이 화면을 닫아도 계속 돌고, 끝나면 알림이 옵니다.</p></div>
    <span class="go2 ghost">분석 멈추기</span>`;
  const s4 = `<h4>층</h4><ul class="ly">
      <li class="on"><i></i><span>내 분석 결과 2026.10.09 — 경작지</span></li>
      <li class="on"><i></i><span>내 분석 결과 2026.10.09 — 비경작지</span></li>
      <li><i></i><span>지난 결과 2026.06.08 · 2,098필지</span></li>
      <li class="on"><i></i><span>필지 경계 · 연속지적</span></li>
      <li class="on"><i></i><span>정사영상 2025.08</span></li></ul>
    <h4 class="mt">범례</h4><ul class="lg"><li><i class="a"></i>경작지</li><li><i class="b"></i>비경작지</li><li><i class="c"></i>필지 경계</li></ul>
    <h4 class="mt">내 분석 결과</h4><ul class="mine">
      <li class="pick"><span>2026.10.09 · 남원시 · 2025.08 드론</span><b>분석 중</b></li>
      <li><span>2026.06.08 · 남원시 · 2025 드론 4시점</span><b>2,098필지</b></li></ul>`;
  const steps = [['모델 알기', '무엇을 얼마나 잘 찾나', s1], ['영상 고르기', '내 정사영상 올리기 · 공유 데이터셋', s2], ['분석', '대기열 → 읍면동 순으로', s3], ['지도 층', '결과를 켜고 끄며 보기', s4]];
  const next = ['영상 고르기로', '이 영상으로 분석 시작', '지도에서 보기', '새로 분석하기'][step - 1];
  const left = steps.map(([t, sub, body], i) => `<section class="stp ${on(i + 1)}"><header><i>${i + 1}</i><b>${t}</b><small>${sub}</small></header>${i + 1 === step ? `<div class="stb">${body}</div>` : ''}</section>`).join('');
  const chips = { 1: '남원시 · 2025.08 드론 정사영상 · 운영 결과', 2: '남원시 · 2025.08 드론 정사영상 (고른 영상 미리 보기)', 3: '남원시 · 분석 중 — 끝난 읍면동부터 층이 올라옵니다', 4: '남원시 · 내 분석 결과 2026.10.09' };
  return `<nav class="crumb"><span>분석하기</span><span>›</span><b>${esc(c.name)}</b></nav>
  <div class="fl">
    <aside class="fl-l">
      <div class="fl-h"><h1 class="nm">${esc(c.name)}</h1><p class="ln">${esc(c.line)}</p><p class="mini"><b>95%</b> 검증 정확도 · 모델 갱신 2026.01 · 대상 지역 7곳</p></div>
      ${left}
      <div class="fl-f"><span class="go wide">${next}</span></div>
    </aside>
    <div class="mp-m"><img src="${IMG + c.img}" alt=""><span class="mcap">${chips[step]}</span><span class="zoom"><b>+</b><b>−</b></span></div>
  </div>`;
}

const q = new URLSearchParams(location.search);
const v = q.get('v') || 'list';
document.body.dataset.v = v;
const page = document.getElementById('page');
const stamp = document.getElementById('stampT');
if (v === 'list') { page.innerHTML = head + tools + `<div class="g3">${C.map(cardA).join('')}</div>`; stamp.textContent = 'ⓐ 정식 서비스 5장 — 그림 위 · 정확도 · 모델 갱신 · 대상 지역'; }
else if (v === 'listb') { page.innerHTML = head + tools + `<div class="g4">${C.map(cardB).join('')}</div>`; stamp.textContent = 'ⓑ 그림 없이 — 정확도 · 모델 갱신 · 대상 지역만 · 4열'; }
else if (v === 'flow') { const st = Number(q.get('s') || 1); page.classList.add('map'); page.innerHTML = flowView(C[0], st); stamp.textContent = `상세 흐름 ${st}/4 — 모델 알기 → 영상 고르기 → 분석 → 지도 층(지도 칸은 결과 장면 조각)`; }
else { page.classList.add('map'); page.innerHTML = mapView(C[0]); stamp.textContent = '상세 = 정식 지도 서비스 — 지역 · 층 · 범례 · 지역별 결과(지도 칸은 결과 장면 조각)'; }
