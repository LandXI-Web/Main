<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시안 · 카드 상세 휴대폰 — 장면 · 결과 예시 · 아래 고정 '이 카드로 분석'</title>
<link rel="stylesheet" href="mock.css">
<style>
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{margin:0;font:700 18px/24px var(--font-display);letter-spacing:-.02em;color:var(--ink)}
.m-app--m .m-main{padding-bottom:80px}
</style>
</head>
<body class="m m--m t">
<div class="m-app m-app--m">
  <header class="m-mast">
    <span class="m-word">LAND-XI</span>
    <span class="m-home">분석하기</span>
    <span class="m-sp"></span>
    <span class="m-mast-b m-help">?</span>
  </header>
  <main class="m-main">
    <div class="dt">
      <div class="col">
        <div class="hero"><img src="../../../../../../../landxi/v3/service-detail/data/img/farm-hero.jpg" alt=""></div>
        <div class="dt-head">
          <div class="tags"><span class="chip ga">운영</span><span class="chip">v2.1</span></div>
          <h1>영농관리 행정서비스</h1>
          <p class="m-body">경작·휴경·시설·전용을 영상으로 판정해 확인이 필요한 필지만 남깁니다.</p>
        </div>
        <section class="m-card sec">
          <h2>결과 예시</h2>
          <div class="big"><span class="lab">현장 확인 필요 · 남원시</span><b>1,035</b><span class="u">필지</span></div>
          <div class="thumbs">
            <div class="th"><img src="../../../../../../../landxi/v3/service-detail/data/img/namwon-farmland-2025/1@2x.jpg" alt=""><span>경작</span></div>
            <div class="th"><img src="../../../../../../../landxi/v3/service-detail/data/img/namwon-farmland-2025/2@2x.jpg" alt=""><span>휴경</span></div>
            <div class="th"><img src="../../../../../../../landxi/v3/service-detail/data/img/namwon-greenhouse-2025/4@2x.jpg" alt=""><span>시설</span></div>
            <div class="th"><img src="../../../../../../../landxi/v3/service-detail/data/img/namwon-farmland-2025/6@2x.jpg" alt=""><span>전용</span></div>
          </div>
        </section>
        <section class="m-card sec">
          <h2>쓰이는 곳</h2>
          <ul class="reg-l">
            <li><span class="chip ga">운영</span><b>남원시</b><span class="n">2025 드론</span></li>
            <li><span class="chip pilot">시범</span><b>강진 · 구례 · 여수 · 목포</b><span class="n">2023 항공</span></li>
          </ul>
        </section>
      </div>
    </div>
  </main>
  <div class="m-cta"><button class="t-btn">이 카드로 분석</button></div>
  <nav class="m-tabs" aria-label="메뉴">
    <span class="m-rail-i" data-ic="home"><span>홈</span></span>
    <span class="m-rail-i" data-ic="proj"><span>프로젝트</span></span>
    <span class="m-rail-i" data-ic="analyze" aria-current="true"><span>분석하기</span></span>
    <span class="m-rail-i" data-ic="inbox"><span class="bd">3</span><span>요청함</span></span>
    <span class="m-rail-i" data-ic="menu"><span>메뉴</span></span>
  </nav>
</div>
<span class="m-stamp"><b>시안</b> 카드 상세 · 휴대폰</span>
<script src="icons.js"></script>
