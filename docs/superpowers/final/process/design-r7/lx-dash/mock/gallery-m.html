<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시안 · 분석하기 갤러리 휴대폰 — 한 줄에 카드 하나</title>
<link rel="stylesheet" href="mock.css">
<style>
.m-chips{flex-wrap:nowrap;overflow:hidden}
</style>
</head>
<body class="m m--m t">
<div class="m-app m-app--m">
  <header class="m-mast">
    <span class="m-word">LAND-XI</span>
    <span class="m-home">분석하기</span>
    <span class="m-sp"></span>
    <span class="m-mast-b m-help">?</span>
  </header>
  <main class="m-main">
    <div class="m-chips">
      <span class="chip" aria-pressed="true">전체<small>13</small></span><span class="chip">운영<small>2</small></span><span class="chip">시범<small>9</small></span><span class="chip">첫 결과 전<small>2</small></span><span class="chip">해외</span>
    </div>
    <div class="gal">
      <article class="gcard">
        <div class="crop"><img src="../../../../../../../landxi/v3/service-detail/data/img/farm-hero.jpg" alt=""><span class="chip ga">운영</span></div>
        <div class="where"><span>남원시 · 2026.10.01 기준</span><span>v2.1</span></div>
        <h3>영농관리 행정서비스</h3>
        <p class="line">경작·휴경·시설·전용을 영상으로 판정해 확인이 필요한 필지만 남깁니다</p>
        <div class="res"><b>1,035</b><span>현장 확인 필요 필지 · 남원시</span></div>
        <div class="spec"><span>쓰이는 곳 <b>운영 1 · 시범 4</b></span><span>영상 <b>드론·항공 50cm↓</b></span></div>
        <div class="acts"><button class="t-btn">이 카드로 분석</button><span class="m-more">자세히</span></div>
      </article>
      <article class="gcard">
        <div class="crop"><img src="../../../../../../../landxi/assets/proto/crops/namwon-greenhouse-2025/2@2x.jpg" alt=""><span class="chip pilot">시범</span></div>
        <div class="where"><span>증평군 · 함양군 · 남원시</span><span>v1.0</span></div>
        <h3>비닐하우스 서비스</h3>
        <p class="line">단동·다동 비닐하우스를 찾아 세어 영농시설 현황을 만듭니다</p>
        <div class="res"><b>725</b><span>비닐하우스 동 · 증평군</span></div>
      </article>
    </div>
  </main>
  <nav class="m-tabs" aria-label="메뉴">
    <span class="m-rail-i" data-ic="home"><span>홈</span></span>
    <span class="m-rail-i" data-ic="proj"><span>프로젝트</span></span>
    <span class="m-rail-i" data-ic="analyze" aria-current="true"><span>분석하기</span></span>
    <span class="m-rail-i" data-ic="inbox"><span class="bd">3</span><span>요청함</span></span>
    <span class="m-rail-i" data-ic="menu"><span>메뉴</span></span>
  </nav>
</div>
<span class="m-stamp"><b>시안</b> 분석하기 갤러리 · 휴대폰</span>
<script src="icons.js"></script>
</body>
</html>
