<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시안 · 기다리는 중(Land-XI XI맵 목록) — 그림 없이 막대 하나와 글 한 줄</title>
<link rel="stylesheet" href="mock.css">
<style>
.search{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:460px;height:36px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--rule);border-radius:8px;background:var(--bg-1);font:400 14px/1 var(--font-body);color:var(--sub)}
.search kbd{margin-left:auto;font:500 12px/1 var(--font-num);background:var(--bg-0);padding:4px 6px;border-radius:4px}
.panel{position:absolute;left:24px;top:24px;width:392px;background:var(--bg-1);border-radius:16px;box-shadow:var(--elev-map);padding:24px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font:700 24px/32px var(--font-display);letter-spacing:-.02em}
.wait{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--bg-0);border-radius:16px}
.wait p{margin:0;font:500 15px/22px var(--font-body);color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.rows .r{display:grid;grid-template-columns:1fr 64px;gap:12px}
</style>
</head>
<body class="m t">
<div class="m-app has-rail">
  <header class="m-mast">
    <span class="m-word">LAND-XI</span>
    <span class="m-home">XI맵</span>
    <span class="m-sp"></span>
    <span class="m-role"><b>LX 직원</b>김도윤</span>
    <span class="m-mast-b m-help">?</span>
    <span class="m-mast-b">나가기</span>
    <span class="search">시군구 · 지번 · 또는 문장으로 물어보기<kbd>Ctrl K</kbd></span>
  </header>
  <nav class="m-rail">
    <span class="m-rail-i"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>층</span>
    <span class="m-rail-i"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>규칙</span>
    <span class="m-rail-i" aria-current="true"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></svg>목록</span>
    <span class="m-rail-i"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg>가르기</span>
    <span class="m-rail-i"><svg viewBox="0 0 24 24"><path d="M3 17l6-8 4 5 3-3 5 6z"/></svg>입체</span>
    <span class="m-rail-i"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0114-5M20 12a8 8 0 01-14 5"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>대조</span>
    <span class="m-rail-i"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>보고서</span>
    <span class="m-rail-i"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M4 4h4M16 4h4M4 20h4M16 20h4"/></svg>분석</span>
  </nav>
  <main class="m-main">
    <div class="m-map m-map--ortho-rail"></div>
    <div class="panel">
      <h2>목록</h2>
      <div class="wait">
        <div class="m-bar"><i></i></div>
        <p>불러오는 중</p>
      </div>
      <div class="rows">
        <div class="r"><span class="m-ph"></span><span class="m-ph"></span></div>
        <div class="r"><span class="m-ph" style="width:70%"></span><span class="m-ph"></span></div>
        <div class="r"><span class="m-ph" style="width:85%"></span><span class="m-ph"></span></div>
      </div>
    </div>
    <span class="m-scale">3 km</span>

    <span class="m-note" style="left:440px;top:60px"><i>1</i>그림 없이 막대 하나 + '불러오는 중' 글 한 줄 — 어느 화면이든 이 모양</span>
    <span class="m-note" style="left:440px;top:108px"><i>2</i>6초 넘게 안 오면 '서버 응답이 늦습니다 · 다시 시도'로 바뀜(멈춰 있지 않음)</span>
  </main>
</div>
<span class="m-stamp"><b>시안</b> 둘 다 같은 모양 · 예: Land-XI XI맵 목록</span>
</body>
</html>
