<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시안 ⓐ · 전남광주 AI 플랫폼(광역 기관 분기) — 틀은 Land-XI, 마크·이름·기관색만 광주전남</title>
<link rel="stylesheet" href="mock.css">
<style>
.sheet-rows{display:flex;flex-direction:column}
.sheet-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);font:400 15px/22px var(--font-body);color:var(--ink)}
.sheet-row .s{color:var(--sub);font-size:14px}
.sheet-row .t-chip{margin-left:auto}
.foot{margin-top:auto;font:400 13px/18px var(--font-body);color:var(--sub)}
</style>
</head>
<body class="m t ci-gj ci-a">
<div class="m-app">
  <header class="m-mast">
    <span class="m-mark"><span>光全</span><span>AI</span></span>
    <span class="m-word m-word--ci">전남광주 AI 플랫폼</span>
    <span class="m-home">해양수산과</span>
    <span class="m-sp"></span>
    <span class="m-ask">물어보기 <kbd>Ctrl K</kbd></span>
    <span class="m-fresh"><i></i>17:35</span>
    <span class="m-role"><b>해양수산과</b>담당자</span>
    <span class="m-mast-b">XI맵</span>
    <span class="m-mast-b m-help">?</span>
    <span class="m-mast-b">나가기</span>
  </header>
  <main class="m-main">
    <div class="m-map m-map--korea"></div>
    <div class="m-list">
      <div class="m-row"><b>여수시</b><span class="s">해양쓰레기 실태조사 서비스</span><span class="v"><small>AI 탐지</small><span class="m-num">1,857</span>건</span></div>
    </div>
    <aside class="m-sheet">
      <div class="m-sheet-h"><h2>보는 범위</h2><span class="m-x">×</span></div>
      <div class="m-tabs"><span class="m-tab" aria-current="true">광역 전체</span><span class="m-tab">시군구 고르기</span></div>
      <p class="m-label">서비스가 있는 시군구</p>
      <div class="sheet-rows">
        <div class="sheet-row">여수시 <span class="s">해양쓰레기 · 2023년 항공영상</span><span class="t-chip">운영</span></div>
      </div>
      <button class="t-btn">여수시로 보기</button>
      <p class="foot">AI 분석 · 모델 개발과 갱신 — LX 한국국토정보공사</p>
    </aside>
    <span class="m-scale">50 km</span>

    <span class="m-note" style="left:440px;top:16px"><i>1</i>마크 · 플랫폼 이름 · 기관색(파랑)만 광주전남 것</span>
    <span class="m-note" style="left:440px;top:64px"><i>2</i>광역은 '광역 전체'로 시작하고, 시군구는 담당자가 고름</span>
  </main>
</div>
<span class="m-stamp"><b>시안 ⓐ</b> 기관 분기 화면 · 전남광주 AI 플랫폼(광역 · 해양수산과)</span>
</body>
</html>
