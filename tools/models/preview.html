<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Land-XI 모델 프리뷰</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0e1116; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 14px; top: 12px; z-index: 5;
    font: 500 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #9fb0c4; letter-spacing: .02em; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  #hud b { color: #dfe8f2; font-weight: 600; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #ff8080;
         font: 14px ui-monospace, monospace; white-space: pre-wrap; padding: 40px; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const name = q.get('m') || 'satellite';
const src = q.get('src') || `/landxi/assets/proto/models/${name}.glb`;
const grid = q.get('grid') !== '0';                 // 기본: 4분할 검수 뷰
const spin = q.get('spin') === '1';
const bgHex = q.get('bg') || '#12161d';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setScissorTest(grid);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(bgHex);

// HDR 파일 없이 금속 반사를 만들기 위한 절차적 환경맵.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

// 3점 조명: 키 / 필 / 림
const key = new THREE.DirectionalLight(0xfff4e6, 3.1);
key.position.set(4.2, 6.0, 4.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0009;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd4ff, 1.0);
fill.position.set(-5.5, 1.6, 3.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 2.4);
rim.position.set(-2.4, 3.2, -6.0);
scene.add(rim);

scene.add(new THREE.HemisphereLight(0x9fc0ff, 0x1a1d24, 0.35));

const root = new THREE.Group();
scene.add(root);

// 런타임에서 돌릴 부품 — 노드 원점(피벗)이 제대로 잡혔는지 확인하는 용도.
// rotor_0..3 은 glTF +Y(수직) 축, prop 은 glTF Z(기수-꼬리) 축으로 돈다.
const spinners = [];
const anim = q.get('anim') === '1';
const animT = Number(q.get('t') || 0);   // 고정 각도로 정지시켜 스크린샷 검수

const hud = document.getElementById('hud');
const cams = [];
const dirs = grid
  ? [[1.15, 0.60, 1.0], [0, 0, -1], [1, 0, 0], [0, 1, 0.0015]]  // iso / front(-Z, glTF 기수) / side(+X) / top(+Y)
  : [[1.15, 0.60, 1.0]];
let controls = null, radius = 1, center = new THREE.Vector3(), bbox = null;

const _u = new THREE.Vector3(), _r = new THREE.Vector3(), _f = new THREE.Vector3(), _v = new THREE.Vector3();

/** 카메라 방향별로 바운딩박스를 화면에 꽉 채운다(뷰포트 종횡비 반영). */
function fitCam(cam, dirArr, aspect, pad = 1.08) {
  if (!bbox) return;
  _f.set(...dirArr).normalize();
  _u.set(0, 1, 0);
  if (Math.abs(_f.y) > 0.995) _u.set(0, 0, -1);
  _r.crossVectors(_f, _u).normalize();
  _u.crossVectors(_r, _f).normalize();

  const vt = Math.tan(THREE.MathUtils.degToRad(cam.fov) / 2);
  const ht = vt * aspect;
  let hw = 0, hh = 0, hd = 0;
  for (let i = 0; i < 8; i++) {
    _v.set(i & 1 ? bbox.max.x : bbox.min.x, i & 2 ? bbox.max.y : bbox.min.y, i & 4 ? bbox.max.z : bbox.min.z)
      .sub(center);
    hw = Math.max(hw, Math.abs(_v.dot(_r)));
    hh = Math.max(hh, Math.abs(_v.dot(_u)));
    hd = Math.max(hd, Math.abs(_v.dot(_f)));
  }
  const dist = Math.max(hw / ht, hh / vt) * pad + hd;
  cam.position.copy(center).addScaledVector(_f, dist);
  cam.near = Math.max(dist * 0.005, 0.001);
  cam.far = dist * 6;
  cam.lookAt(center);
}

function frameAll(box) {
  bbox = box;
  center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;

  for (const d of dirs) {
    const c = new THREE.PerspectiveCamera(34, 1, 0.01, 5000);
    fitCam(c, d, 1.45);
    cams.push(c);
  }
  controls = new OrbitControls(cams[0], renderer.domElement);
  controls.target.copy(center);
  controls.enableDamping = true;
  controls.update();

  // 형태를 읽기 쉽게 하는 옅은 접지 그림자
  if (q.get('ground') !== '0') {
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(radius * 40, radius * 40),
      new THREE.ShadowMaterial({ opacity: 0.13 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = box.min.y - radius * 0.22;
    ground.receiveShadow = true;
    scene.add(ground);
  }

  key.target.position.copy(center); scene.add(key.target);
  const s = key.shadow.camera;
  s.left = -radius * 2.2; s.right = radius * 2.2;
  s.top = radius * 2.2; s.bottom = -radius * 2.2;
  s.near = 0.01; s.far = radius * 30;
  key.position.copy(center).add(new THREE.Vector3(4.2, 6.0, 4.6).normalize().multiplyScalar(radius * 6));
  s.updateProjectionMatrix();
}

new GLTFLoader().load(src, (gltf) => {
  root.add(gltf.scene);
  let tris = 0, meshes = 0, mats = new Set(), nodes = [];
  gltf.scene.traverse((o) => {
    if (o.isMesh) {
      meshes++;
      o.castShadow = o.receiveShadow = true;
      const g = o.geometry;
      tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => mats.add(m.name || '?'));
    }
    if (o.parent === gltf.scene) nodes.push(o.name);
    if (/^rotor_\d+$/.test(o.name)) spinners.push([o, 'y', 1]);
    else if (o.name === 'prop') spinners.push([o, 'z', 1]);
  });
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const size = box.getSize(new THREE.Vector3());
  frameAll(box);
  hud.innerHTML =
    `<b>${name}.glb</b> &nbsp; tris ${Math.round(tris).toLocaleString()} &nbsp;· meshes ${meshes}` +
    ` &nbsp;· mats ${mats.size}<br>bbox ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} m` +
    `<br>nodes: ${nodes.join(', ')}` +
    (grid ? '<br>iso &nbsp;|&nbsp; front(−Z) &nbsp;/&nbsp; side(+X) &nbsp;/&nbsp; top(+Y)' : '');
  window.__modelInfo = { name, tris: Math.round(tris), meshes, nodes, size: size.toArray() };
  window.__ready = true;
}, undefined, (e) => {
  const el = document.getElementById('err');
  el.style.display = 'grid';
  el.textContent = 'load failed: ' + src + '\n' + (e?.message || e);
  window.__ready = true;
});

const layout = () => {
  renderer.setSize(innerWidth, innerHeight);
  const W = innerWidth, H = innerHeight;
  if (!grid) return [[0, 0, W, H]];
  const hw = (W / 2) | 0, hh = (H / 2) | 0;
  return [[0, hh, hw, H - hh], [hw, hh, W - hw, H - hh], [0, 0, hw, hh], [hw, 0, W - hw, hh]];
};

addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));

renderer.setAnimationLoop((t) => {
  if (!cams.length) return;
  if (spin) root.rotation.y = t * 0.00035;
  if (anim || animT) {
    const ang = animT ? animT : t * 0.006;
    for (const [o, ax] of spinners) o.rotation[ax] = ang;
  }
  controls?.update();
  const vps = layout();
  if (!grid) {
    cams[0].aspect = innerWidth / innerHeight; cams[0].updateProjectionMatrix();
    renderer.render(scene, cams[0]);
    return;
  }
  // 4분할: 좌상 iso(오빗 조작 가능) / 우상 front / 좌하 side / 우하 top
  vps.forEach((vp, i) => {
    const c = cams[i];
    if (!c) return;
    const [x, y, w, h] = vp;
    renderer.setViewport(x, y, w, h);
    renderer.setScissor(x, y, w, h);
    c.aspect = w / h;
    if (i > 0) fitCam(c, dirs[i], c.aspect);   // 고정 뷰는 매 프레임 재프레이밍
    c.updateProjectionMatrix();
    renderer.render(scene, c);
  });
});
</script>
</body>
</html>
