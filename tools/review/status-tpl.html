<title>Land-XI 구현 현황판</title>
<style>body{margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#FFFFFF; --ground:#F4F6F9; --ink:#0B1220; --sub:#5B6576; --faint:#8A93A3; --rule:#E2E6EC;
  --accent:#006DF7; --accent-tint:#E8F1FF;
  --ok:#128A4A; --ok-t:#E3F5EA; --part:#B7770A; --part-t:#FBF1DC; --fake:#C2322A; --fake-t:#FBE6E4;
  --slot:#6B7280; --slot-t:#EEF0F3; --wip:#006DF7; --wip-t:#E8F1FF;
  --shadow:0 1px 2px rgba(11,18,32,.06),0 8px 24px rgba(11,18,32,.06);
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--paper:#141A24;--ground:#0C1118;--ink:#E8EDF4;--sub:#A3AEBF;--faint:#7B8699;--rule:#263041;
  --accent:#4C9BFF;--accent-tint:#13253F;--ok:#4CC17F;--ok-t:#12301F;--part:#E0A93A;--part-t:#33280F;--fake:#F06A5F;--fake-t:#3A1A18;
  --slot:#9AA3B2;--slot-t:#1F2733;--wip:#4C9BFF;--wip-t:#13253F;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);}}
:root[data-theme="dark"]{
  color-scheme:dark;--paper:#141A24;--ground:#0C1118;--ink:#E8EDF4;--sub:#A3AEBF;--faint:#7B8699;--rule:#263041;
  --accent:#4C9BFF;--accent-tint:#13253F;--ok:#4CC17F;--ok-t:#12301F;--part:#E0A93A;--part-t:#33280F;--fake:#F06A5F;--fake-t:#3A1A18;
  --slot:#9AA3B2;--slot-t:#1F2733;--wip:#4C9BFF;--wip-t:#13253F;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0;padding-inline:clamp(16px,4vw,48px);padding-block:32px 64px}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:40px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
header{display:grid;gap:18px}
header h1{font-size:clamp(28px,4vw,44px);font-weight:900;letter-spacing:-.02em;line-height:1.15}
header p{margin:0;color:var(--sub);max-width:62ch}
.num{font-variant-numeric:tabular-nums}
/* summary */
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}@media (max-width:860px){.summary{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:20px;display:grid;gap:14px;align-content:start}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-size:48px;font-weight:900;letter-spacing:-.03em;line-height:1}
.big span{color:var(--sub)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--slot-t)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:14px}
.row .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--slot-t);overflow:hidden}
.row .track i{display:block;height:100%;background:var(--accent)}
/* issues */
.issues{display:grid;gap:10px;counter-reset:n}
.issue{background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--fake);border-radius:10px;padding:14px 16px;display:grid;gap:4px}
.issue b{font-weight:700}
.issue p{margin:0;color:var(--sub);font-size:14px}
/* filters */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--rule)}
.filters label{font-size:12px;color:var(--faint);margin-right:2px}
.chipbtn{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sep{width:1px;height:20px;background:var(--rule);margin:0 4px}
.count{margin-left:auto;font-size:13px;color:var(--sub)}
/* groups */
.group{display:grid;gap:14px}
.group h2{font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.group h2 small{font-size:13px;color:var(--faint);font-weight:400}
.xlinks{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}.xlinks a{color:var(--accent);text-decoration:none}.xlinks a:hover{text-decoration:underline}
.scr{display:grid;gap:10px}.scr h3{font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.scr h3 small{font-size:12px;color:var(--faint);font-weight:400}.scr h3 a{font-size:12px;font-weight:500;color:var(--accent);text-decoration:none}
.group{gap:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0}
.card:hover{box-shadow:var(--shadow)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thumb{aspect-ratio:16/10;background:var(--slot-t);display:grid;place-items:center;color:var(--faint);font-size:13px;max-width:100%;overflow:hidden}
.thumb{position:relative}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb .play{position:absolute;left:6px;bottom:6px;font:600 11px/1 var(--mono);padding:5px 7px;background:rgba(11,18,32,.8);color:#fff}
.rownow{margin:0;font-size:13.5px;color:var(--sub);max-width:100ch}.rownow b{color:var(--ink);margin-right:4px}.rownow b.nx{color:var(--accent);margin-left:6px}
.dlg dd a{margin-right:2px}.dlg dd a.dim{color:var(--faint)}
.body{padding:12px 14px 14px;display:grid;gap:6px;align-content:start}
.title{font-weight:700;font-size:15px;line-height:1.35}
.path{font-family:var(--mono);font-size:11.5px;color:var(--faint);word-break:break-all}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;font-weight:500;white-space:nowrap}
.s-완성{background:var(--ok-t);color:var(--ok)}
.s-부분{background:var(--part-t);color:var(--part)}
.s-시연고정값{background:var(--fake-t);color:var(--fake)}
.s-자리{background:var(--slot-t);color:var(--slot)}
.s-제작중{background:var(--wip-t);color:var(--wip)}
.g{background:var(--slot-t);color:var(--sub)}
.problem{font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* backend */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.list{display:grid}
.li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--rule)}
.li:first-child{border-top:0}
.li .n{font-weight:700;font-size:14px}
.li .d{grid-column:2;font-size:13px;color:var(--sub)}
/* dialog */
dialog{border:0;border-radius:16px;padding:0;max-width:min(960px,calc(100vw - 32px));width:100%;background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,12,20,.55)}
.dlg{display:grid;gap:0}
.dlg img{width:100%;display:block;background:var(--slot-t)}
.dlg .in{padding:18px 20px 22px;display:grid;gap:10px}
.dlg dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14px}
.dlg dt{color:var(--faint)} .dlg dd{margin:0}
.close{justify-self:end;font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
footer{font-size:12px;color:var(--faint)}
@media (max-width:520px){.big b{font-size:40px}.count{width:100%;margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Land-XI · 전체 화면 전수 점검 · <span id="gen"></span></div>
    <h1>플랫폼 전체를 펼쳐 본 구현 상황</h1>
    <p>모든 화면을 실제 로그인 경로로 열어 찍은 결과입니다. 9월 29일부터 로그인에서 역할별 첫 화면까지 <b>새 화면 17개</b>로 이어지고, 예전 화면은 메뉴에서 빠진 채 파일로 보관돼 있습니다. 이 사이트에서는 서버가 없어 서버가 필요한 화면은 <b>캡처·영상</b>으로 보입니다. 화면 이름과 줄 순서는 <a href="../masters.html">자산 대장</a>과 같습니다.</p>
    <p class="xlinks"><a href="../index.html">검토 허브</a><a href="../masters.html">자산 대장(화면마다 한 줄)</a></p>
  </header>

  <section class="summary" id="summary"></section>

  <section style="display:grid;gap:12px">
    <h2 style="font-size:20px">지금 가장 큰 문제</h2>
    <div class="issues" id="issues"></div>
  </section>

  <nav class="filters" id="filters" aria-label="화면 거르기"></nav>
  <div id="groups" style="display:grid;gap:36px"></div>

  <section class="two">
    <div class="panel"><h2 style="font-size:18px">서버·AI 구성요소</h2><div class="list" id="backend"></div></div>
    <div class="panel"><h2 style="font-size:18px">데이터 자산</h2><div class="list" id="data"></div></div>
  </section>
  <footer id="foot"></footer>
</div>

<dialog id="dlg"><div class="dlg"><img id="dimg" alt=""><div class="in"><button class="close" id="dclose" type="button">닫기</button><h3 id="dtitle" style="font-size:19px"></h3><dl id="ddl"></dl></div></div></dialog>

<script id="payload" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('payload').textContent);
const S=D.screens;
const STATUS=['연결됨','완성','부분','시연고정값','자리','제작 중'];
const SCOL={'연결됨':'var(--accent)','완성':'var(--ok)','부분':'var(--part)','시연고정값':'var(--fake)','자리':'var(--slot)','제작 중':'var(--wip)'};
const SLABEL={'연결됨':'새 화면 · 연결됨','완성':'완성','부분':'부분 구현','시연고정값':'고정값 화면','자리':'빈 자리','제작 중':'제작 중'};
const AXES=['게스트','LX직원','관리자','기관','해외','영업','내부','-'];
const AXLABEL={'게스트':'게스트 (로그인 전)','LX직원':'LX 직원','관리자':'LX 관리자','기관':'지자체 기관','해외':'해외 기관','영업':'영업','내부':'내부 도구','-':'공통'};
const GEN=['v3 새 화면','F1·F2 신규 v2','구 proto v1'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls=s=>'s-'+String(s).replace(/\s/g,'');
const cnt=(k,v)=>S.filter(x=>x[k]===v).length;
document.getElementById('gen').textContent=(D.generated_at||'').slice(0,16).replace('T',' ');

// summary
const bar=(items)=>`<div class="bar">${items.map(([n,c])=>`<i style="width:${n/S.length*100}%;background:${c}"></i>`).join('')}</div>`;
const live=S.filter(x=>String(x['실데이터']||'').startsWith('API')).length;
const byGen=GEN.map(g=>[g,cnt('세대',g)]);
const groups=[...new Set(S.map(x=>x['기능군']).filter(g=>g&&g!=='-'))];
const liveBy=groups.map(g=>{const all=S.filter(x=>x['기능군']===g);return [g,all.length,all.filter(x=>String(x['실데이터']||'').startsWith('API')).length]}).sort((a,b)=>b[1]-a[1]);
document.getElementById('summary').innerHTML=`
<div class="panel"><div class="eyebrow">전체 화면</div><div class="big num"><b>${S.length}</b><span>개</span></div>
${bar(STATUS.map(s=>[cnt('상태',s),SCOL[s]]))}
<div class="legend">${STATUS.map(s=>`<span><i class="dot" style="background:${SCOL[s]}"></i>${SLABEL[s]} <b class="num">${cnt('상태',s)}</b></span>`).join('')}</div></div>
<div class="panel"><div class="eyebrow">실제 서버에 연결된 화면</div><div class="big num"><b>${live}</b><span>/ ${S.length}개</span></div>
${bar([[live,'var(--accent)'],[S.length-live,'var(--slot-t)']])}
<div class="legend"><span>나머지 ${S.length-live}개는 예전 고정값 데이터로 그려짐 · 이 사이트에서는 ${live}개 모두 캡처·영상으로만 보임</span></div></div>
<div class="panel"><div class="eyebrow">세대</div><div class="rows">${byGen.map(([g,n])=>`<div class="row"><span>${g==='구 proto v1'?'예전 화면 (v1)':g==='v3 새 화면'||g==='v3 시안'?'새 화면 (v3)':'예전 화면 (v2)'}</span><b class="num">${n}</b><div class="track"><i style="width:${n/S.length*100}%"></i></div></div>`).join('')}</div></div>
<div class="panel" style="grid-column:1/-1"><div class="eyebrow">기능별 · 실제 연결 / 전체</div>
<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 18px">${liveBy.map(([g,n,l])=>`<div class="row"><span>${esc(g)}</span><b class="num">${l} / ${n}</b><div class="track"><i style="width:${l/n*100}%"></i></div></div>`).join('')}</div></div>`;

// issues
const ISS=[
 ['새 화면은 서버가 켜진 곳에서만 로그인됩니다','9월 29일부터 로그인에서 역할별 첫 화면까지 새 화면 17개로 이어집니다. 이 사이트(GitHub)에서는 게스트 메인·서비스 상세·로그인 화면만 열리고, 로그인 뒤 화면은 캡처·영상으로 봅니다.'],
 ['로그인 뒤 화면이 이 사이트 주소 밖으로 돌려보냅니다','로그인이 없을 때 새 화면이 로그인으로 되돌리는 주소가 사이트 주소(/Main/)를 빼먹어 빈 페이지가 됩니다. 서비스 상세의 그림 일부도 같은 이유로 비어 보입니다.'],
 ['새 화면 머리에 예전 이름이 남아 있습니다','LX 직원 대시보드와 LX 관리자 대시보드의 맨 위 이름표가 아직 9월 24일에 붙인 예전 이름입니다. 쓰는 말(LX 직원 대시보드 · LX 관리자 대시보드)로 바꿔야 합니다.'],
 ['예전 화면은 메뉴에서 빠지고 파일만 남아 있습니다','예전 화면(v1 · v2)은 비교용으로 보관합니다. 대부분 고정값으로 그려지고, 예전 XI맵·LX 관리자·해외 화면은 서버가 켜진 곳에서만 동작합니다.'],
];
document.getElementById('issues').innerHTML=ISS.map(([t,p])=>`<div class="issue"><b>${t}</b><p>${p}</p></div>`).join('');

// filters
const F={axis:'전체',status:'전체',gen:'전체'};
const mk=(key,label,opts)=>`<label>${label}</label>`+['전체',...opts].map(o=>`<button type="button" class="chipbtn" data-k="${key}" data-v="${esc(o)}" aria-pressed="${F[key]===o}">${esc(key==='status'&&o!=='전체'?SLABEL[o]:key==='axis'&&o!=='전체'?AXLABEL[o].split(' (')[0]:o)}</button>`).join('');
function renderFilters(){
 document.getElementById('filters').innerHTML=mk('axis','사용자',AXES.filter(a=>S.some(x=>x['사용자_축']===a)))+'<span class="sep"></span>'+mk('status','상태',STATUS)+`<span class="count num" id="count"></span>`;
}
document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;F[b.dataset.k]=b.dataset.v;renderFilters();renderGroups();});

function renderGroups(){
 const list=S.filter(x=>(F.axis==='전체'||x['사용자_축']===F.axis)&&(F.status==='전체'||x['상태']===F.status));
 document.getElementById('count').textContent=`${list.length}개 표시`;
 // 자산 대장(screen-map.json)과 같은 키로 묶는다: 기능 → 화면
 const ORDER=(D.order||[]).map(o=>[o.function,o.screens]);
 const extra=[...new Set(list.map(x=>x.function))].filter(f=>!ORDER.some(o=>o[0]===f)).map(f=>[f,[...new Set(list.filter(x=>x.function===f).map(x=>x.screen))]]);
 document.getElementById('groups').innerHTML=ORDER.concat(extra).map(([fn,scs])=>{
   const inFn=list.filter(x=>x.function===fn);
   if(!inFn.length) return '';
   const blocks=scs.map(sc=>{
     const items=inFn.filter(x=>x.screen===sc);
     if(!items.length) return '';
     items.sort((p,q)=>GEN.indexOf(p['세대'])-GEN.indexOf(q['세대'])||STATUS.indexOf(p['상태'])-STATUS.indexOf(q['상태']));
     const row=(D.rows||[]).find(r=>r.function===fn&&r.screen===sc)||{};
     const anchor=row.anchor||items[0].anchor||'';
     return `<div class="scr" id="st-${esc(anchor)}"><h3>${esc(sc)}<small class="num">${items.length}개</small><a href="../masters.html#${esc(anchor)}">자산 대장에서 보기 ›</a></h3>${row.now?`<p class="rownow"><b>지금</b> ${esc(row.now)}${row.next?` <b class="nx">다음</b> ${esc(row.next)}`:''}</p>`:''}<div class="grid">${items.map(card).join('')}</div></div>`;
   }).join('');
   return `<section class="group"><h2>${esc(fn)}<small class="num">${inFn.length}개</small></h2>${blocks}</section>`;
 }).join('')||'<p style="color:var(--sub)">조건에 맞는 화면이 없습니다.</p>';
}
function card(x){
 const i=S.indexOf(x);
 const gen=String(x['세대']||'').startsWith('v3')?'새 구현':'예전 구현';
 const live=String(x['실데이터']||'').startsWith('API');
 const vid=(x.media||[]).some(m=>m.k==='video');
 return `<button type="button" class="card" data-i="${i}"><div class="thumb">${x.thumb?`<img loading="lazy" src="${esc(x.thumb)}" alt="${esc(x.label)} 화면">`:'<span>캡처 없음</span>'}${vid?'<span class="play">▶ 영상</span>':''}</div>
 <div class="body"><div class="title">${esc(x.label||x['제목']||x.id)}</div>
 <div class="meta"><span class="pill ${cls(x['상태'])}">${SLABEL[x['상태']]||esc(x['상태'])}</span><span class="pill g">${gen}</span><span class="pill g">${esc((AXLABEL[x['사용자_축']]||x['사용자_축']||'').split(' (')[0])}</span>${x.verdict?`<span class="pill g">대장 ${esc(x.verdict)}</span>`:''}${live?'<span class="pill s-제작중">서버 연결 · 여기선 캡처</span>':''}</div>
 ${x.open&&x.open.note?`<div class="problem">${esc(x.open.note)}</div>`:''}</div></button>`;
}
document.getElementById('groups').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;openCard(S[+c.dataset.i]);});
const dlg=document.getElementById('dlg');
function openCard(x){
 const img=document.getElementById('dimg'); if(x.thumb){img.src=x.thumb;img.hidden=false}else img.hidden=true;
 document.getElementById('dtitle').textContent=x.label||x['제목']||x.id;
 // 열기 — 이 사이트에서 실제로 되는 것: 캡처·영상은 항상, 실제 화면은 서버·로그인이 없어도 열리는 것만 1순위
 const o=x.open||{};const links=[];
 (x.media||[]).forEach((m,i)=>links.push(`<a href="${esc(m.s)}" target="_blank" rel="noopener">${m.k==='video'?'▶ 영상':'캡처 '+(i+1)}</a>`));
 if(o.href) links.push(`<a href="${esc(o.href)}" target="_blank" rel="noopener"${o.kind==='live'?'':' class="dim"'}>${esc(o.live||'실제 화면')}</a>`);
 if(x.anchor) links.push(`<a href="../masters.html#${esc(x.anchor)}">자산 대장에서 보기 ›</a>`);
 const rows=[['열기',links.join(' · ')],['화면',x.function+' › '+x.screen],['대장 판정',x.verdict],['사용자',AXLABEL[x['사용자_축']]||x['사용자_축']],['상태',SLABEL[x['상태']]||x['상태']],['데이터(개발)',x['실데이터']],['문제(개발)',x['문제']],['경로(개발)',x['경로']]];
 document.getElementById('ddl').innerHTML=rows.filter(r=>r[1]&&r[1]!=='-').map(([k,v])=>`<dt>${k}</dt><dd>${k==='열기'?v:esc(v)}</dd>`).join('')+(o.note?`<dt></dt><dd style="color:var(--faint);font-size:13px">${esc(o.note)}</dd>`:'');
 if(dlg.showModal) dlg.showModal();
}
document.getElementById('dclose').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});

const li=(n,s,d)=>`<div class="li"><span class="pill ${s==='정상'?'s-완성':s==='자리'||s==='등록 대기'?'s-자리':'s-부분'}">${esc(s)}</span><span class="n">${esc(n)}</span><span class="d">${esc(d)}</span></div>`;
document.getElementById('backend').innerHTML=D.backend.map(b=>li(b['구성요소'],b['상태'],b['설명'])).join('');
document.getElementById('data').innerHTML=D.data.map(b=>li(b['자산'],b['상태'],b['설명'])).join('');
document.getElementById('foot').textContent='실제 로그인 경로로 각 화면을 열어 1440×900으로 촬영. 새 화면 17개는 9월 29일 로그인 폼으로 들어가 찍은 캡처와 역할별 영상으로 보입니다.';
renderFilters();renderGroups();
