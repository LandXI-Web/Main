<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Land-XI — 구름 데크 브레이크스루 프리뷰</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #05070a; overflow: hidden; }
  * { box-sizing: border-box; }

  .stage {
    position: fixed; inset: 0; overflow: hidden;
    background: #7b93ad;
  }
  .bg {
    position: absolute; inset: 0;
    background: url('/shots/research/v-namwon.png') center center / cover no-repeat;
  }
  .layer {
    position: absolute; left: 50%; top: 50%;
    width: 160vw; height: 160vh;
    transform: translate(-50%, -50%);
    background-repeat: repeat;
    will-change: transform, opacity;
    pointer-events: none;
  }
  #l-far  { background-image: url('/landxi/assets/proto/clouds/cloud_far.webp');  background-size: 700px 700px; }
  #l-mid  { background-image: url('/landxi/assets/proto/clouds/cloud_mid.webp');  background-size: 1100px 1100px; }
  #l-near { background-image: url('/landxi/assets/proto/clouds/cloud_near.webp'); background-size: 1500px 1500px; }
  #l-haze {
    position: absolute; left: 50%; top: 50%;
    width: 180vw; height: 180vh; transform: translate(-50%, -50%);
    background: url('/landxi/assets/proto/clouds/haze.webp') center center / cover no-repeat;
    mix-blend-mode: screen; pointer-events: none; opacity: 0;
  }
  body.blend-screen #l-far, body.blend-screen #l-mid, body.blend-screen #l-near {
    mix-blend-mode: screen;
  }
  body.blend-normal #l-far, body.blend-normal #l-mid, body.blend-normal #l-near {
    mix-blend-mode: normal;
  }

  .hud {
    position: fixed; left: 16px; right: 16px; bottom: 16px;
    z-index: 10; font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
    color: #eef2f6; background: rgba(10, 14, 20, 0.72); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 12px 16px;
  }
  .hud input[type=range] { width: 100%; }
  .hud .row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .hud .stat { font-variant-numeric: tabular-nums; opacity: 0.85; }
  .hud button {
    background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  }
  .hud button.active { background: #4d8dff; border-color: #4d8dff; }
  .title { font-weight: 600; margin-bottom: 2px; }
</style>
</head>
<body class="blend-normal">
  <div class="stage" id="stage">
    <div class="bg"></div>
    <div class="layer" id="l-far"></div>
    <div class="layer" id="l-mid"></div>
    <div class="layer" id="l-near"></div>
    <div id="l-haze"></div>
  </div>

  <div class="hud">
    <div class="title">구름 데크 브레이크스루 — p (전체 스크롤 진행도)</div>
    <input type="range" id="p" min="0" max="1000" value="0" />
    <div class="row">
      <span class="stat" id="pval">p = 0.000</span>
      <span class="stat" id="lval">window(0.22→0.30) local = 0.000</span>
      <button id="blendBtn">blend-mode: normal</button>
      <button id="playBtn">▶ 0→1 재생 (4s)</button>
    </div>
  </div>

<script>
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;

  // 실제 프로덕션 구간: 전체 스크롤 진행도 p 가 0.22 → 0.30 사이일 때만 브레이크스루가 일어난다.
  const WIN_START = 0.22, WIN_END = 0.30;

  // 레이어별 로컬(0~1) 구간 스태거: near(가장 가까움)가 먼저 걷히고, far(가장 얇은 상층 베일)가 마지막까지 남는다.
  const LAYERS = {
    far:  { el: document.getElementById('l-far'),  a: 0.35, b: 1.00, scaleTo: 3.2, opFrom: 0.95, parallax: 14  },
    mid:  { el: document.getElementById('l-mid'),  a: 0.15, b: 0.85, scaleTo: 2.8, opFrom: 1.00, parallax: 34  },
    near: { el: document.getElementById('l-near'), a: 0.00, b: 0.60, scaleTo: 2.3, opFrom: 1.00, parallax: 62  },
  };
  const haze = document.getElementById('l-haze');

  function apply(p) {
    const local = clamp((p - WIN_START) / (WIN_END - WIN_START), 0, 1);
    document.getElementById('pval').textContent = 'p = ' + p.toFixed(3);
    document.getElementById('lval').textContent = 'window(0.22→0.30) local = ' + local.toFixed(3);

    for (const key in LAYERS) {
      const L = LAYERS[key];
      const t = smoothstep(L.a, L.b, local);
      const scale = lerp(1, L.scaleTo, t);
      const opacity = L.opFrom * (1 - t);
      const ty = -t * L.parallax; // 위로 살짝 빠지듯 패럴랙스
      L.el.style.transform = `translate(-50%, calc(-50% + ${ty}px)) scale(${scale})`;
      L.el.style.opacity = opacity.toFixed(3);
    }

    // 화이트아웃 피크: local ~0.42 부근에서 정점을 찍고 사라진다 (카메라가 데크 한가운데를 관통하는 순간).
    const hazeUp = smoothstep(0.10, 0.42, local);
    const hazeDown = smoothstep(0.42, 0.80, local);
    const hazeOp = clamp(hazeUp - hazeDown, 0, 1) * 0.85;
    haze.style.opacity = hazeOp.toFixed(3);
    haze.style.transform = `translate(-50%, -50%) scale(${lerp(1, 1.6, local)})`;
  }

  const slider = document.getElementById('p');
  slider.addEventListener('input', () => apply(slider.value / 1000));

  document.getElementById('blendBtn').addEventListener('click', (e) => {
    const isScreen = document.body.classList.toggle('blend-screen');
    document.body.classList.toggle('blend-normal', !isScreen);
    e.target.textContent = 'blend-mode: ' + (isScreen ? 'screen' : 'normal');
    e.target.classList.toggle('active', isScreen);
  });

  let playing = false;
  document.getElementById('playBtn').addEventListener('click', () => {
    if (playing) return;
    playing = true;
    const dur = 4000, start = performance.now();
    function tick(now) {
      const p = clamp((now - start) / dur, 0, 1);
      slider.value = Math.round(p * 1000);
      apply(p);
      if (p < 1) requestAnimationFrame(tick); else playing = false;
    }
    requestAnimationFrame(tick);
  });

  // URL ?p=0.55 로 초기값을 지정할 수 있다 (스크린샷 자동화용).
  const qp = new URLSearchParams(location.search);
  const initP = qp.has('p') ? clamp(parseFloat(qp.get('p')), 0, 1) : 0;
  if (qp.get('blend') === 'screen') {
    document.body.classList.add('blend-screen');
    document.body.classList.remove('blend-normal');
    document.getElementById('blendBtn').textContent = 'blend-mode: screen';
    document.getElementById('blendBtn').classList.add('active');
  }
  slider.value = Math.round(initP * 1000);
  apply(initP);
</script>
</body>
</html>
