# 기관 영상 분석 의뢰 · 올린 영상 보관(확인 대장 6차 GF-2 · 원칙 66) — 값은 여기 한 곳.
# 저장 장치 · 서버(A100 등)가 바뀌면 코드가 아니라 이 파일만 바꾼다. 게이트웨이는 파일이 바뀌면 다시 읽는다.

# 기관이 올린 영상 원본을 두는 곳(02. 데이터 아래 · {tenant} = 기관 · 당분간 이 PC 디스크가 보관소 — 사용자 결정 인프라-1 ⓐ).
# 이 폴더 크기는 기관 사용 현황(저장)으로 기록 · 표시만 한다 — 기관 한도로 막지 않는다(사용자 7차 답 10-01)
storage_root: tenants/{tenant}/requests

# 한 파일 크기 한도(조각 올리기 · 설계 7차 제안 ② 20GB) — 더 큰 영상은 LX 와 따로 협의
max_file_gb: 20

# 조각 크기(화면이 속도를 재서 한 조각이 약 30초가 되게 조절 · 바깥 주소 앞단의 요청 한 번 100MB · 100초 한도 아래)
chunk_mb: {start: 1, max: 8}

# 서버 전체 저장 공간(하드웨어)을 지키는 선 — 올린 뒤 디스크 남은 공간이 이보다 적어지면 올리기를 받지 않는다(LX 관리자가 여기서 정한다 ·
# 여유 경보 기준과 같은 선 config/alerts.yaml). 막는 것은 이 선 하나뿐(기관별 한도 없음)
disk_reserve_gb: 200

# 끝내지 못한 올리기 · 의뢰하지 않고 둔 파일 — 이 날 수가 지나면 지운다
partial_ttl_days: 7

# 받는 형식 · 표준 형식 · 원본 보관(표준본 확인 뒤 90일)은 영상 표준 설정 한 곳으로 옮겼다 — config/imagery.yaml(LX 영상 등록과 같은 값 · 원칙 94)

# 좌표계 정보가 없는 파일(JPG + 좌표 파일 등)은 위치로 좌표계를 가려낸다 — 후보(앞에서부터)
crs_guess: [5186, 5187, 5185, 5188, 5179, 32652, 32651, 4326]
