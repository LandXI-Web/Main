# 촬영 요청 대략 비용 — 국토교통부 고시 제2025-896호(드론지적측량 수수료 · 사용자 제공 10-01 · 원칙 106 · 119).
# 고시가 바뀌면 이 파일만 고친다(화면 · 코드에 금액 0). 게이트웨이는 파일이 바뀌면 다시 읽는다.
# 화면의 금액은 늘 '대략'이다 — 넓이 그대로 비례로 셈하고(촬영-2 ⓑ), 끝수 · 최소 · 부가세 · 걸침 · 할인 · 분석 대가 같은 조정은
# LX 담당자가 답할 때 정한다(촬영-3 ⓐ · 원칙 119). 요청에는 셈 당시 값의 사본이 남아, 고시가 바뀌어도 옛 요청의 대략 금액은 그대로다.
drone_shoot:
  notice: "국토교통부 고시 제2025-896호"   # 화면에는 '국토교통부 고시 기준'으로만
  unit_km2: 0.25                           # 기준 넓이
  per_unit:                                # 기준 넓이당 금액(원)
    gun: 3471000                           # 군 지역
    si: 3551000                            # 시 지역
    gu: 3656000                            # 구 지역
  region_type_of: sgg                      # 군 · 시 · 구 = 그린 범위의 중심이 든 시군구(기관이 아니라)
  general_gu: si                           # 일반구(천안시 서북구 등 — 시 아래 구)는 시 지역으로 셈(기본값 · 담당자가 답에서 조정)
  rounding: prorate                        # prorate = 넓이 그대로 비례(촬영-2 ⓑ)
  max_km2: 100                             # 한 번에 그릴 수 있는 가장 넓은 범위(㎢) — 넘으면 나눠서 요청
