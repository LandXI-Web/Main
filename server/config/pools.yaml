# GPU/CPU 풀(설계서 §5.5 Phase 0). 워커 = GPU 1장 1프로세스.
# 전력 예산(2026-09-26 필수 · 1급 제약): 이 PC 전원은 A6000 2장 동시 풀로드를 못 버틴다(셧다운 이력).
#   gpu_worker 는 shard 를 읽기 전에 Redis 임대 power:hot:{slot}(SET NX EX)을 잡아야 한다 — 슬롯 수 = max_hot_gpus.
#   임대가 없으면 shard 를 가져가지 않는다(대기). 유휴 idle_release_s 뒤 반납. vLLM 등 다른 GPU 고부하 작업도 같은 키를 존중한다.
power:
  # 10-17 사용자(원칙 270): "GPU 1도 상한선 200w가 있으니깐. 둘다 사용하는 걸로 일단 제약을 풀어보자." — 두 장 사용 시험.
  #   임대 칸 2(전국 작업이 두 장에서) · 한 작업이 쓰는 장은 1(job_max_gpus · 학습 · 사용자 분석은 그대로 한 장) · 장당 상한 200 W 그대로.
  #   두 장 합 전력 · 온도 1초 감시(pair) — 이상이면 바로 한 장으로(power:single · single_cool_s 뒤 저절로 다시 두 장).
  max_hot_gpus: 2
  job_max_gpus: 1
  start_gpus: [0, 1]         # start-landxi.ps1 · run-workers.ps1 의 워커 GPU 기본 목록
  pair:
    sum_max_w: 300           # 두 장 합 전력(드라이버 평균)이 이보다 높게
    sum_over_s: 10           #   이만큼 넘게 이어지면 한 장으로
    temp_max_c: 85           # 어느 장이든 이 온도 이상이면 바로 한 장으로
    driver_err_s: 3          # 장비 응답 오류(NVML 실패 · 장이 사라짐)가 이만큼 이어지면 한 장으로
    single_cool_s: 1800      # 한 장으로 돌아간 뒤 쉬는 시간(30분) — 지나면 다시 두 장
    log_days: 7              # 1초 기록(02. 데이터/_logs/gpu-pair-YYYYMMDD.csv) 보관 날 수
  lease_ttl_s: 20
  idle_release_s: 3
  # 임대 밖 부하(vLLM · Ollama — WSL/Docker 라 power:hot 을 잡지 않는다)도 전력 규칙에 넣는다(2026-09-27 F2-B 녹화 중 GPU1 vLLM 171 W 와 겹침 실측 → 추가)
  other_gpu_hot_w: 100       # 다른 GPU 전력(NVML 순간값 · nvidia-smi 최신 · 5표본 이동평균 중 큰 값)이 이보다 높으면 멈춘다(판정 기준 '동시 >100 W' 와 같은 선)
  # v3(F2-B 판정 불합격 2 반영): 30 s 폴백(batch 4 진행) 삭제 — 다른 GPU 가 내려갈 때까지 새 묶음을 읽지 않고, 읽어 간 묶음도 gate_chunk 칸마다 멈춘다.
  other_wait_log_s: 15       # 대기 중 로그 · 하트비트 · job.progress.power_gate(HUD 사유) 갱신 주기
  gate_chunk: 8              # 읽어 간 묶음 안의 재확인 간격(칸)
  other_quiet_s: 20          # 다른 GPU 가 내려간 뒤 이만큼 조용해야 재개(히스테리시스 · 몰려 오는 LLM 호출 사이에 끼어들지 않게)
  fast_poll_s: 0.1           # NVML 순간 전력 폴링(workers/nvml_power.py · pynvml 없이 ctypes)
  power_limit_w: 200        # nvidia-smi power.limit(장당) — 2026-09-26 전력 상한 200 W × 2 적용(LandXI-GPU-PowerLimit-200W 예약 작업)
  # 전국 결과 자산 작업(options.national) — 한 장만 · 풀로드 금지(원칙 221 · 10-12). 시스템 전력 상한은 바꾸지 않고 코드 안에서 조절:
  # 작은 묶음(chunk 칩) + 묶음 사이 쉼(이 장 사용률 · 전력 이동평균을 재며 duty 조절). 다른 장(vLLM 등)은 쓰지 않음.
  national:
    gpu: [0, 1]              # 두 장 모드(원칙 270) — 첫 장 = 전국 · 해외 · 사용자 분석 / 두 번째 장(XI ChatGEO 장) = 국내 전국 칩만 · XI ChatGEO 질문이 오면 비킴
    secondary_mem_mib: 5120  # 두 번째 장에서 워커가 쓰는 메모리 상한(vLLM · Ollama 약 38GB 사용 · 남은 약 10GB 중 일부만)
    read: 8                  # 두 장 모드에서 워커가 전국 칩을 한 번에 받는 수(한 워커가 다 가져가지 않게)
    inflight_two: 16         # 두 장 모드에서 전국 작업 하나가 스트림에 두는 칩 수(장마다 8)
    llm_quiet_s: 5           # XI ChatGEO 호출이 끝난 뒤 두 번째 장이 전국 칩을 다시 받기까지(초)
    tile_share: true         # 영상 나눠 받기(impl-41) — 첫 장 워커가 127.0.0.1 문지기 · 두 번째 장은 거기서 받음(같은 타일 두 번 받기 없앰 · 영상 서버 호출은 한 곳 · 상한 그대로)
    tile_share_port: 8706
    pipeline: 3              # 작업기가 동시에 넣어 두는 조각 수(칸 경계를 넘어 다음 칸 조각도 · 조각 · 칩 격자는 그대로라 결과 같음 · impl-41) · 10-18 2→3(해외 멈춤 · 두 장이 국내만)
    fin_backlog: 4           # 칩은 다 끝나고 결과 정리(CPU)만 남은 조각은 흐름 자리를 차지하지 않게 — 이만큼까지 더 둔다(10-18 · 정리 동안 두 장이 놀던 것 없앰)
    read_ahead: true         # 마지막 칩 묶음을 추론하는 동안 다음 칩 묶음을 이 워커 몫으로 받아 영상 읽기 시작(impl-41)
    chunk: 4
    util_max: 70             # 사용률 평균 상한(%)
    power_max_w: 160         # 전력 상한(W) — 10-25 사용자 "기준은 160W로 올린다. 이거 기본으로 한다." (장당 상한 200 W 그대로)
    target_w: 145            # 30초 평균 목표(넘으면 쉼) — 모든 GPU 작업 공용(power_throttle.limits) · 10-25
    target_util: 62
    duty: 0.5
    train_share: false       # 학습이 한 장(train.gpu)을 쓰는 동안 전국 분석이 다른 한 장으로 이어 가기(10-22 P6) — true 면 작업기 · 워커가 학습 작업을 '비킬 작업'으로 세지 않는다(파일만 바꾸면 바로)
    inflight: 8              # 스트림에 한 번에 넣는 전국 칸 수(스케줄러) — 사용자 작업이 오면 이 몇 칸 뒤에 바로 돈다
  # 학습(kind train · XI 재학습 · 새 모델 실험) — 전국 작업과 같은 상한(10-12 구현 25). 한 장만(gpu) · 배치 뒤 쉼으로 사용률 · 전력 조절.
  # 학습이 대기열에 있거나 돌면 전국 작업기는 비킨다(national/runner.py wait_turn). 시스템 전력 상한(nvidia-smi)은 바꾸지 않는다.
  train:
    gpu: 0
    util_max: 70             # 사용률 평균 상한(%)
    power_max_w: 160         # 전력 상한(W) — 10-25 사용자 "기준은 160W로 올린다. 이거 기본으로 한다." (장당 상한 200 W 그대로)
    duty: 0.35               # 시작 duty(제어기가 30초 평균을 보며 조절 · workers/power_throttle.py)
    target_w: 145            # 30초 평균이 이를 넘으면 (목표 − 여유) 아래로 내려갈 때까지 멈춘다(10-25 상한 160 W 에 맞춤 · 예전 125)
    target_util: 62
    hard_s: 20               # 30초 평균이 상한(160 W · 70 %)을 이만큼 넘게 넘으면 하드 정지(식을 때까지 멈춤 · 로그)
    temp_max_c: 83
# 새 작업의 첫 묶음 선점(v1.1-17) — 깊이와 상관없이 바로 넣는 shard 수
first_chunk: 16
# shard 고아 감시(v1.1-14) — shard.started 뒤 max(floor_s, 5×중앙값 ms) 안에 done/failed 없으면 timeout → 1회 재배정
orphan:
  floor_s: 120
  scan_s: 10
pools:
  a6000:
    device: gpu
    workers: [a6000-0, a6000-1]
    gpu_indices: [0, 1]
    # 시작 시 상주 — P0 시연 첫 shard ≤ 5s [목표]를 위해 car_v2_obb 는 미리 올린다
    resident: [car_v2_obb, aerial25/best]   # core-xi: 25cm 전국 기본 모델도 상주 — 워커 재기동 직후 첫 전역 분석도 첫 결과 ≤ 10 s
    lru_max: 3
    batch: 16
    fp16: true
    low_watermark: 24       # shards:a6000 스트림 깊이 — 이보다 얕으면 스케줄러가 우선순위 순으로 채운다(선점 지연 ≤ 1–2s) · core-xi: 48→24(시군구 전역 1만 칸이 돌 때도 새 작업 첫 결과 ≤ 10 s)
    fill_chunk: 32          # core-xi: 64→32(같은 이유)
  cpu:
    device: cpu
    workers: [cpu-0, cpu-1]   # cpu-0 = shard + finalize · cpu-1 = shard 전용(2026-09-27: 원격 NDVI 8칸 321 s 가 실태조사 39칸을 200 s+ 굶긴 실측 → 추가)
    finalize_threads: 2       # cpu-0 의 큰 작업 결과 정리 스레드 수(10-18 · 전국 조각 정리 20–30초가 한 줄로 서던 것 → 둘이 나눠)
    low_watermark: 4
    fill_chunk: 8
    slow_shard_ms: 5000       # 중앙값이 이보다 긴 어댑터 작업은 한 번에 1 shard(나머지 cpu 워커는 빠른 작업)
  a100-n1:
    device: gpu
    state: pending
    note: "A100 80GB×4 · 등록 대기(가입 토큰 발급 시 채워짐)"
  a100-n2:
    device: gpu
    state: pending
    note: "A100 80GB×4 · 등록 대기"
nodes:
  - id: node-tr3995wx
    role: control+gpu
    pool: a6000
    cpu: "Threadripper PRO 3995WX 64C"
    ram_gb: 512
    gpus: [0, 1]
  - {id: node-a100-1, state: pending, note: "A100 80GB×4 · 등록 대기 · 가입 토큰 발급 시 채워짐"}
  - {id: node-a100-2, state: pending, note: "A100 80GB×4 · 등록 대기"}
