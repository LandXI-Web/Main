# 경보 규칙(설계서 §4) — 임계는 [목표] · 운영 2주 뒤 실측 분포로 조정. ops.py 가 60s 마다 평가해 ops_alerts + Redis ops:alerts 에 쓴다.
rules:
  - {id: gpu_temp_gt_85_5m, level: caution, metric: gpu.temp_c, op: ">", threshold: 85, for_s: 300, unit: "°C"}
  - {id: vram_gt_95_5m, level: caution, metric: gpu.mem_pct, op: ">", threshold: 95, for_s: 300, unit: "%"}
  - {id: worker_heartbeat_missing_30s, level: fault, metric: worker.heartbeat_age_s, op: ">", threshold: 30, for_s: 0, unit: "s"}
  - {id: queue_wait_p95_gt_10m, level: caution, metric: queue.p95_wait_s, op: ">", threshold: 600, for_s: 0, unit: "s"}
  - {id: disk_e_free_lt_200gb, level: caution, metric: storage.E.free_gb, op: "<", threshold: 200, for_s: 0, unit: "GB"}
  - {id: vworld_calls_80pct, level: caution, metric: vworld.calls_day_pct, op: ">", threshold: 80, for_s: 0, unit: "%"}
  - {id: job_fail_rate_gt_5pct_1h, level: caution, metric: jobs.fail_rate_1h_pct, op: ">", threshold: 5, for_s: 0, unit: "%"}
