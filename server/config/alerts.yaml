# 경보 규칙(설계서 §4) — 임계는 [목표] · 운영 2주 뒤 실측 분포로 조정. ops.py 가 60s 마다 평가해 ops_alerts + Redis ops:alerts 에 쓴다.
rules:
  - {id: gpu_temp_gt_85_5m, level: caution, metric: gpu.temp_c, op: ">", threshold: 85, for_s: 300, unit: "°C"}
  - {id: vram_gt_95_5m, level: caution, metric: gpu.mem_pct, op: ">", threshold: 95, for_s: 300, unit: "%"}
  - {id: worker_heartbeat_missing_30s, level: fault, metric: worker.heartbeat_age_s, op: ">", threshold: 30, for_s: 0, unit: "s"}
  - {id: queue_wait_p95_gt_10m, level: caution, metric: queue.p95_wait_s, op: ">", threshold: 600, for_s: 0, unit: "s"}
  - {id: disk_e_free_lt_200gb, level: caution, metric: storage.E.free_gb, op: "<", threshold: 200, for_s: 0, unit: "GB"}
  - {id: disk_c_free_lt_30gb, level: caution, metric: storage.C.free_gb, op: "<", threshold: 30, for_s: 0, unit: "GB"}
  # 10-22 now21 '제안-디스크알림' 넣음 — 남은 디스크가 50GB 아래면 LX 관리자 대시보드 할 일 목록에 '저장 공간 부족' 한 줄(디스크마다)
  - {id: disk_e_free_lt_50gb, level: fault, metric: storage.E.free_gb, op: "<", threshold: 50, for_s: 0, unit: "GB"}
  - {id: disk_d_free_lt_50gb, level: fault, metric: storage.D.free_gb, op: "<", threshold: 50, for_s: 0, unit: "GB"}
  - {id: disk_c_free_lt_50gb, level: fault, metric: storage.C.free_gb, op: "<", threshold: 50, for_s: 0, unit: "GB"}
  - {id: db_backup_failed, level: fault, metric: backup.db.failed, op: ">", threshold: 0, for_s: 0, unit: ""}
  - {id: db_backup_older_30h, level: caution, metric: backup.db.age_h, op: ">", threshold: 30, for_s: 0, unit: "h"}
  - {id: vworld_calls_80pct, level: caution, metric: vworld.calls_day_pct, op: ">", threshold: 80, for_s: 0, unit: "%"}
  - {id: job_fail_rate_gt_5pct_1h, level: caution, metric: jobs.fail_rate_1h_pct, op: ">", threshold: 5, for_s: 0, unit: "%"}
  # 10-22 now21 '제안-새해영상알림' 넣음 — 국토지리정보원에 가진 해 다음 해 항공 영상 층이 열리면 LX 관리자 할 일에 한 줄(값 = 그 해 · 6시간마다 확인)
  - {id: ngii_new_year, level: caution, metric: imagery.ngii.new_year, op: ">", threshold: 0, for_s: 0, unit: ""}
