# 점유의심 조사(카드 ③) 목록 규칙 — 한 곳(10-28 사용자 회신 REPLY-v5-CARD3 §2 · 3). 바꾸면 다음 요청부터 반영(재시작 없음).
# 판정 단위 = 필지(이지목 현황 결과의 필지). 한 필지에 국토 변화 도형이 여럿이면 priority 순서로 최상위 유형 하나 + 건수.

# 이지목 현황 판정이 이 가운데 하나면 목록에
ijimok: [점유의심, 지목미정리]
# 국토 변화에서 이 유형이 걸린 필지면 목록에(넓이 min_hit_m2 이상 겹침)
change: [신축, 경작 전환, 포장 확대]
min_hit_m2: 1
# '미확정 포함' 켜면 더하는 판정(기본 꺼짐)
undetermined: 미확정_나지초지
# 기본에서 빼는 판정(정상 · 미확정 · 유휴산림화(유휴지 목록 몫) · 수역구거 · 기타) — 위 change 에 걸리면 목록에 든다
priority: [신축, 포장 확대, 경작 전환, 소실]

# 카드 '자세히'에 보이는 사람 말
words:
  - 이지목 현황 판정이 점유의심 · 지목미정리인 필지
  - 국토 변화에서 신축 · 경작 전환 · 포장 확대가 걸린 필지
  - 정상 · 미확정 · 유휴산림화 · 수역구거 · 기타는 빠집니다(미확정은 '미확정 포함'을 켜면 들어옵니다)
  - 한 필지에 변화가 여럿이면 신축 → 포장 확대 → 경작 전환 순서로 하나와 건수를 보입니다
