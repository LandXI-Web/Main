# 산사태 취약지역 분석서비스 — 산림이 벗겨진 곳 찾기(change/forest.py · 10-31 PM "변화지역 분석만 잘하면 된다").
# 이 파일 한 곳. 작업마다 다시 읽는다(모델 경로를 바꾸면 다음 작업부터 · 워커 재시작 없음 — 모델 파일은 새 이름으로 두고 여기만 바꿈).
# 모델이 없으면 예전 규칙(지적 임야 + 토지피복 ap25 · 후보 C)으로 돈다.

# 산림 변화용 토지피복 모델(6 묶음) — 데이터 폴더 기준 상대 경로
model: models/forest-change/forest6-r50-1031.pt
# 앞 시점 산림으로 볼 확률 하한 · 뒤 시점 산림 확률 상한(이 아래면 '벗겨짐')
p_forest_a: 0.6
p_forest_b_max: 0.25
# 그림자 · 빈 곳 빼기 — 밝기(0~255) 아래면 그 시점은 안 보이는 곳
dark_a: 22
dark_b: 30
# 산 범위 — 지적 임야 필지 둘레 여유(m) · 또는 앞 시점 산림 덩어리 넓이(㎡) 이상
dilate_m: 10
forest_block_m2: 5000
# 맨땅이라도 이만큼 길쭉하면 '산림 → 도로'(임도 · 절개)
road_elong: 5.0
# 앞 시점에 이미 이만큼(㎡) 넓은 맨땅(채석장 · 공사장)에 붙어 넓어진 곳 → '채석장 · 개발지 확장'(따로 표시)
quarry_min_m2: 3000
# 덩어리 거름(10-31 남원 표본으로 정함) — 앞 시점 산림 가장자리 안쪽(m) · 둘레 검사 폭(m)과 그 둘레가 뒤 시점에도 산림인 몫 · 새 밭 경작 확률 · 뒤 시점 결
erode_m: 2.0
ring_m: 30.0
ring_forest_b: 0.5
p_crop_b: 0.9
tex_b_min: 10.0
# 임야 필지 밖(지목이 이미 바뀐 개발지 등)은 이만큼(㎡) 넓게 벗겨진 곳만
outside_min_m2: 2000
# 작업 장부에 남는 모델 이름(models 표 id) — 위 model 파일과 짝(모델을 바꾸면 둘 다)
model_id: change-forest6
